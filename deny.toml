# Supply-chain policy (§3 of docs/21-stack.md: one dependency tree, audited).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only in dependencies: the AGPL obligations are Korpis' own, and nothing
# pulled in may add terms a host has to think about.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[[licenses.clarify]]
crate = "korpis-core"
expression = "AGPL-3.0-or-later"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
