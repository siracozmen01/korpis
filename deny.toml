# Supply-chain policy (§3 of docs/21-stack.md: one dependency tree, audited).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error2 is unmaintained, and nothing patched exists. It reaches Korpis only as a
    # compile-time dependency of biscuit-quote, the proc-macro behind biscuit-auth 6.0.0's
    # `datalog-macro` feature, which biscuit-auth needs in order to compile at all (its builder
    # does not build without that feature). It runs in the compiler, never in a Korpis binary.
    # Revisit when biscuit-auth releases a version without it.
    { id = "RUSTSEC-2026-0173", reason = "build-time only, via biscuit-auth's required proc-macro" },
    # zvariant, zvariant_derive, and zbus_names are unmaintained as crates of their own because
    # zbus 6.0.0 took them in as modules; their code goes on there. They reach Korpis through
    # zbus 5, which secret-service 5.2.0 uses and which the CLI's Linux keyring store
    # (zbus-secret-service-keyring-store 1.0.1) needs, and no release of either uses zbus 6 yet.
    # What they parse is D-Bus messages from the user's own Secret Service, a peer with the
    # user's authority; a flaw found now is fixed in zbus 6, not here. Revisit when
    # secret-service releases a version on zbus 6. Found by cargo-deny on 2026-10-17.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; reached via secret-service" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; reached via secret-service" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; via secret-service" },
]

[licenses]
version = 2
# Permissive licences only in dependencies: the AGPL obligations are Korpis' own, and nothing
# pulled in may add terms a host has to think about.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    # Permissive licences asking less than MIT does, which the web client's packages carry
    # (§9 of docs/21-stack.md): no conditions at all (0BSD, MIT-0, CC0-1.0), or MIT's in plainer
    # words with an explicit patent grant (BlueOak-1.0.0).
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "BlueOak-1.0.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are path dependencies and are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
