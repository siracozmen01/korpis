[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/siracozmen01/korpis"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[workspace.dependencies]
korpis-proto = { path = "crates/korpis-proto" }
korpis-core = { path = "crates/korpis-core" }

[profile.release]
lto = "thin"
codegen-units = 1
