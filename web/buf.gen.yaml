# The panel's API client, generated from the same schema as the server. The output is committed, and
# the check regenerates it and fails on any difference, as it does for the server's descriptor.
version: v2
plugins:
  - local: node_modules/.bin/protoc-gen-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=none
inputs:
  - directory: ../crates/korpis-proto/proto
    paths:
      - ../crates/korpis-proto/proto/korpis/v1
