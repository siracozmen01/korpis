[package]
name = "korpis-cdi"
description = "A node's Container Device Interface spec files, read as its own configuration by the agent and by a driver"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# A CDI device's name is the domain's (node::device::is_cdi_name).
korpis-core = { workspace = true }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vendors write their spec files in YAML or JSON.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }

[dev-dependencies]
tempfile = "3"
