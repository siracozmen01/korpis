[package]
name = "korpis-server"
description = "Korpis control plane: API, reconcilers, scheduler, gateway, relay"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test support other crates' tests run the control plane with: Pebble and its DNS.
testing = ["dep:tempfile"]

[dependencies]
base64 = "0.22"
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
clap = { version = "4", features = ["derive", "env", "string"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "client-tls", "server", "server-tls"] }
# Repository keys are sealed under the control plane's backup key (§5.5 of docs/06-storage.md).
chacha20poly1305 = "0.10"
ed25519-dalek = "2.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
http = "1"
# The accept loop (src/accept.rs): it reads a PROXY header before TLS and serves the panel's files
# beside the API, which connectrpc's own server cannot, on the same hyper it uses.
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
# The address's front (src/front.rs): the API's answers and the panel's files, as one body type.
bytes = "1"
http-body = "1"
http-body-util = "0.1"
ipnet = "2"
korpis-app = { workspace = true }
# The control plane reads a backup's trees and files when one is browsed or read (§5.4 of
# docs/06-storage.md).
korpis-backup = { path = "../korpis-backup" }
korpis-core = { workspace = true, features = ["accounts", "authz", "identity"] }
korpis-egress = { workspace = true }
# Sealed data keys under tenant custody (§5.5 of docs/06-storage.md).
korpis-extension = { workspace = true }
korpis-proto = { workspace = true, features = ["client", "services"] }
korpis-recipe = { workspace = true }
korpis-store = { workspace = true }
# Offloaded segments, checked and read as the control plane serves them (§4 of docs/14-streams.md).
korpis-stream = { workspace = true }
korpis-tls = { workspace = true }
korpis-wire = { workspace = true }
# Reading uploaded certificates: their names and validity.
x509-parser = "0.18"
# Ordering certificates from an ACME directory (RFC 8555), with ring like every TLS use here.
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# Certificate validity, as rcgen states it.
time = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
# The control plane's own backup, as a sealed document (src/control_backup.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
zeroize = "1"

# Only for `testing`.
tempfile = { version = "3", optional = true }
# The control plane's own login, written into the database URL installation makes.
url = "2"

[dev-dependencies]
korpis-server = { path = ".", features = ["testing"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "client", "client-tls"] }
korpis-proto = { workspace = true, features = ["client"] }
korpis-store = { workspace = true, features = ["testing"] }
sqlx = { workspace = true }
tempfile = "3"
base64 = "0.22"
korpis-core = { workspace = true, features = ["authz", "identity", "testing", "trust"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
korpis-backup = { path = "../korpis-backup", features = ["testing"] }
# The first-party S3 target, against MinIO, behind the control plane end to end.
korpis-target-s3 = { path = "../korpis-target-s3" }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# A DNS server answering from memory, for verifying domains (tests/api/zone.rs).
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }

[lints]
workspace = true
