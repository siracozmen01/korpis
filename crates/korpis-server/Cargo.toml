[package]
name = "korpis-server"
description = "Korpis control plane: API, reconcilers, scheduler, gateway, relay"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
clap = { version = "4", features = ["derive", "env", "string"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "server", "server-tls"] }
ed25519-dalek = "2.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
http = "1"
korpis-app = { workspace = true }
korpis-core = { workspace = true, features = ["authz", "identity"] }
korpis-proto = { workspace = true, features = ["services"] }
korpis-recipe = { workspace = true }
korpis-store = { workspace = true }
korpis-wire = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde_json = "1"
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }

[dev-dependencies]
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "client", "client-tls"] }
korpis-proto = { workspace = true, features = ["client"] }
korpis-store = { workspace = true, features = ["testing"] }
sqlx = { workspace = true }
tempfile = "3"
base64 = "0.22"
korpis-core = { workspace = true, features = ["authz", "identity", "trust"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

[lints]
workspace = true
