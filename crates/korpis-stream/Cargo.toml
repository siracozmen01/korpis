[package]
name = "korpis-stream"
description = "Korpis streams on disk: records, segment files, redaction, and the limits that keep a workload unblocked"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Literal redaction patterns, matched in one pass however many there are (§7 of
# docs/14-streams.md).
aho-corasick = "1"
# CRC-32C over each record frame, so a torn write is found rather than read.
crc = "3"
# Console input arrives from the driver as JSON frames with the bytes in base64.
base64 = "0.22"
# Search within the retention window (§8 of docs/14-streams.md): a regex engine with no
# backtracking, so a reader's pattern runs in time linear in the stream.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
serde_json = "1"
sha2 = "0.10"
# The shim ends its logging binary with SIGTERM when the task is deleted; the writer seals what it
# holds first. A safe flag rather than a handler of our own.
signal-hook = { version = "0.3", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
