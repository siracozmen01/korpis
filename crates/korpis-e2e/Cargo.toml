[package]
name = "korpis-e2e"
description = "Korpis end-to-end tests: the control plane, the agent, the oci driver, and the helper together"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]

[dev-dependencies]
base64 = "0.22"
buffa = { version = "=0.9.2" }
bytes = "1"
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "client", "client-tls"] }
korpis-agent = { path = "../korpis-agent" }
korpis-backup = { path = "../korpis-backup", features = ["testing"] }
korpis-cli = { path = "../korpis-cli" }
korpis-core = { workspace = true, features = ["accounts", "authz"] }
korpis-driver-conformance = { path = "../korpis-driver-conformance" }
korpis-driver-kit = { path = "../korpis-driver-kit" }
korpis-driver-firecracker = { path = "../korpis-driver-firecracker" }
korpis-driver-oci = { path = "../korpis-driver-oci" }
korpis-extension = { path = "../korpis-extension" }
korpis-helper = { path = "../korpis-helper" }
korpis-idp-oidc = { path = "../korpis-idp-oidc" }
http = "1"
http-body-util = "0.1"
# The ingress's features driven as a browser drives them: HTTP/2, and a WebSocket opened on it.
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet = "2"
korpis-proto = { workspace = true, features = ["client"] }
korpis-recipe = { workspace = true }
korpis-server = { workspace = true, features = ["testing"] }
korpis-store = { workspace = true, features = ["testing"] }
korpis-stream = { workspace = true }
korpis-target-s3 = { path = "../korpis-target-s3" }
korpis-wire = { workspace = true }
# The PROXY header a passthrough workload is sent, read by a parser that is not Korpis's.
ppp = "2.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
sqlx = { workspace = true }
tar = { version = "0.4", default-features = false }
serde_json = "1"
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
uuid = { workspace = true }
