[package]
name = "korpis-e2e"
description = "Korpis end-to-end tests: the control plane, the agent, the oci driver, and the helper together"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]

[dev-dependencies]
buffa = { version = "=0.9.2" }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "client", "client-tls"] }
korpis-agent = { path = "../korpis-agent" }
korpis-backup = { path = "../korpis-backup", features = ["testing"] }
korpis-cli = { path = "../korpis-cli" }
korpis-core = { workspace = true }
korpis-driver-oci = { path = "../korpis-driver-oci" }
korpis-extension = { path = "../korpis-extension" }
korpis-helper = { path = "../korpis-helper" }
korpis-proto = { workspace = true, features = ["client"] }
korpis-recipe = { workspace = true }
korpis-server = { workspace = true }
korpis-store = { workspace = true, features = ["testing"] }
korpis-stream = { workspace = true }
korpis-target-s3 = { path = "../korpis-target-s3" }
korpis-wire = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
sqlx = { workspace = true }
tar = { version = "0.4", default-features = false }
tempfile = "3"
tokio = { workspace = true }
url = "2"
uuid = { workspace = true }
