[package]
name = "korpis-guest"
description = "Korpis microVM guest init: the first process of every microVM, and the format its driver speaks to it in"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Built static, for the musl target, and placed on each microVM's boot drive by its driver
# (§4.4 and §6 of docs/04-runtimes.md). No async runtime and nothing of ours: it runs inside a
# tenant's guest, and scripts/check-layers.sh holds it to that.
[[bin]]
name = "korpis-guest"
path = "src/bin/korpis-guest/main.rs"

[dependencies]
# eth0's addresses and routes are set over netlink, as the helper sets a workload's link.
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"
netlink-sys = "0.8"
nix = { version = "0.31", features = ["fs", "hostname", "mount", "poll", "process", "reboot", "signal", "socket"] }
# An interactive entry's controlling terminal, the console's output modes, a volume grown, and
# the control port's socket, and a command's output.
rustix = { version = "1", features = ["fs", "net", "pipe", "process", "stdio", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }

[dev-dependencies]
korpis-image = { path = "../korpis-image", features = ["testing"] }
tempfile = "3"
