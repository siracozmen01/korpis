[package]
name = "korpis-store"
description = "Korpis control-plane store: the PostgreSQL schema and its access layer"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
ipnet = "2"
korpis-app = { workspace = true }
korpis-core = { workspace = true, features = ["accounts", "authz", "mesh"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
uuid = { workspace = true }
# Only for `testing`, which builds stores the way the control plane does.
korpis-wire = { workspace = true, optional = true }

[features]
# Throwaway databases for tests in this and dependent crates. Never on in a release build.
testing = ["dep:korpis-wire"]

[dev-dependencies]
korpis-store = { path = ".", features = ["testing"] }
serde_json = "1"
sqlx = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
