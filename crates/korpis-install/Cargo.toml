[package]
name = "korpis-install"
description = "Korpis's install worker: a recipe's install verbs run beneath a workload's volumes, every path resolved by the kernel beneath its volume"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "korpis-install-job"
path = "src/bin/korpis-install-job/main.rs"

[dependencies]
# Archives an `extract` unpacks: gzip, zstd, and xz around tar, and zip, each decoded in Rust
# alone, so the job builds static for a guest's boot drive and parses no archive in C.
buffa = { version = "=0.9.2" }
flate2 = "1"
getrandom = "0.4"
korpis-confine = { workspace = true }
korpis-core = { workspace = true }
# The job's spec and result, and the plan's values its actions arrive as: messages only.
korpis-proto = { workspace = true }
korpis-wire = { workspace = true }
landlock = "0.4"
lzma-rs = "0.3"
rustix = { version = "1", features = ["fs", "mount", "process", "thread"] }
tar = "0.4"
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
ruzstd = "0.9.1"

[dev-dependencies]
# The reference encoder, so the decoder is tested against archives it did not make.
zstd = "0.14.3"
sha2 = "0.10"
tempfile = "3"
