[package]
name = "korpis-app"
description = "Korpis application layer: the use cases and the ports they need"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# A node's workload pool is a network of the installation's range (§9.1 of
# docs/07-networking.md).
ipnet = "2"
korpis-core = { workspace = true, features = ["accounts", "authz", "identity", "trust"] }
# Schedules are read in the zone their intent names, handed over by the Zones port.
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde_json = "1"
thiserror = { workspace = true }
# An opened data key is wiped when the job that needed it has it.
zeroize = "1"
uuid = { workspace = true }
# The due identity bindings of one pass are asked about at once, each over its provider's stream.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# The use cases of accounts are tested against the real schema, with a software authenticator.
korpis-core = { workspace = true, features = ["testing"] }
korpis-store = { path = "../korpis-store", features = ["testing"] }
tokio = { workspace = true }
# The tests of making runs set up what the use case reads with plain statements.
sqlx = { workspace = true }

[lints]
workspace = true
