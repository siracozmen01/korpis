[package]
name = "korpis-app"
description = "Korpis application layer: the use cases and the ports they need"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
korpis-core = { workspace = true, features = ["accounts", "authz", "identity", "trust"] }
serde_json = "1"
thiserror = { workspace = true }
# An opened data key is wiped when the job that needed it has it.
zeroize = "1"
uuid = { workspace = true }

[dev-dependencies]
# The use cases of accounts are tested against the real schema, with a software authenticator.
korpis-core = { workspace = true, features = ["testing"] }
korpis-store = { path = "../korpis-store", features = ["testing"] }
tokio = { workspace = true }

[lints]
workspace = true
