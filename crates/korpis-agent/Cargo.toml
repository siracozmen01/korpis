[package]
name = "korpis-agent"
description = "Korpis node agent supervisor; dials out, holds no inbound port"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
clap = { version = "4", features = ["derive", "env", "string"] }
crc = "3"
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "client", "client-tls", "server"] }
ed25519-dalek = "2.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
http = "1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
ipnet = "2"
korpis-egress = { workspace = true }
# The node's Container Device Interface spec files (§6.1 of docs/05-scheduling.md).
korpis-cdi = { workspace = true }
# The cores it offers are read from the kernel's topology as a driver reads them.
korpis-topology = { workspace = true }
korpis-core = { workspace = true, features = ["authz", "content", "identity", "mesh"] }
korpis-proto = { workspace = true, features = ["client"] }
korpis-stream = { workspace = true }
# Sealed data keys under tenant custody (§5.5 of docs/06-storage.md).
korpis-extension = { workspace = true }
# A file session's frames, and the verbs the in-memory host serves sessions with.
korpis-files = { path = "../korpis-files" }
# Offloading console streams: the repository format and its S3 client (§4 of docs/14-streams.md).
korpis-backup = { path = "../korpis-backup" }
korpis-tls = { workspace = true }
korpis-wire = { workspace = true }
# Preflight asks which Landlock ABI the kernel speaks, by making rulesets it never applies.
landlock = "0.4"
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls-no-provider"] }
# An install's `fetch`, by URL and hash, into the content store (§4 of docs/09-recipes.md).
# The recipe document's reader, without its registry client, as the driver uses it: the agent
# reads the managed files a recipe declares (reconcile/managed.rs).
korpis-recipe = { path = "../korpis-recipe", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
# inotify on a stream's directory, which wakes a console's followers (data/wake.rs).
rustix = { version = "1", features = ["fs", "net"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde_json = "1"
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }

[dev-dependencies]
korpis-recipe = { workspace = true }
korpis-server = { workspace = true, features = ["testing"] }
korpis-store = { workspace = true, features = ["testing"] }
sqlx = { workspace = true }
korpis-app = { workspace = true }
korpis-backup = { path = "../korpis-backup", features = ["testing"] }
tempfile = "3"
