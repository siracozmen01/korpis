[package]
name = "korpis-driver-oci"
description = "Korpis oci runtime driver over containerd"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
korpis-core = { workspace = true, features = ["content"] }
korpis-driver-kit = { path = "../korpis-driver-kit" }
# The node's Container Device Interface files, which the driver reads itself (devices.rs).
korpis-cdi = { workspace = true }
korpis-containerd = { workspace = true }
korpis-recipe = { path = "../korpis-recipe", default-features = false }
korpis-proto = { workspace = true, features = ["services"] }
korpis-wire = { workspace = true }
base64 = "0.22"
# FIFOs for console input, made and opened without waiting, with no unsafe code of ours.
rustix = { version = "1", features = ["fs"] }
clap = { version = "4", features = ["derive", "env", "string"] }
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "client", "server"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
hyper = { version = "1", features = ["server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
# Each layer extraction is made under a key of its own (containerd/unpack.rs).
uuid = { workspace = true }

[dev-dependencies]
korpis-agent = { path = "../korpis-agent" }
korpis-stream = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tempfile = "3"
