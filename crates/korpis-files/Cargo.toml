[package]
name = "korpis-files"
description = "A workload's files as their owner reaches them: the verbs of a file session, served beneath the worker's root"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "korpis-fsworker"
path = "src/bin/korpis-fsworker/main.rs"

[dependencies]
buffa = { version = "=0.9.2" }
buffa-types = { version = "=0.9.2" }
# The worker's confinement and the root it is confined to, shared with the install worker.
korpis-confine = { workspace = true }
korpis-proto = { workspace = true }
landlock = "0.4"
rustix = { version = "1", features = ["fs", "process", "thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
