[package]
name = "korpis-recipe"
description = "Korpis recipes as OCI artifacts: the document format, the artifact layout, and registry access"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
korpis-app = { workspace = true }
korpis-core = { workspace = true, features = ["trust"] }
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls-no-provider"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
sha2 = "0.10"
thiserror = { workspace = true }

[dev-dependencies]
korpis-core = { workspace = true, features = ["authz", "trust"] }
korpis-store = { workspace = true, features = ["testing"] }
tokio = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
