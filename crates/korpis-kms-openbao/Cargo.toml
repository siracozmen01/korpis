[package]
name = "korpis-kms-openbao"
description = "Korpis's first-party key management provider: a tenant's data keys made and opened by its own OpenBao or Vault Transit engine, bound to their context"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# A first-party extension is built as a third party's would be (§1 of docs/22-first-party.md): the
# SDK and the wire contract, and nothing else of ours. scripts/check-layers.sh holds it to that.
[dependencies]
# Transit carries keys, contexts, and plaintexts in base64.
base64 = "0.22"
korpis-extension = { path = "../korpis-extension" }
korpis-proto = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
