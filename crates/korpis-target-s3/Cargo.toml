[package]
name = "korpis-target-s3"
description = "Korpis's first-party backup target provider for S3-compatible stores: access scoped to one prefix through the store's token service"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# A first-party extension is built as a third party's would be (§1 of docs/22-first-party.md): the
# SDK and the wire contract, and nothing else of ours. scripts/check-layers.sh holds it to that.
[dependencies]
buffa-types = { version = "=0.9.2" }
# Signing the token service's request (SigV4), which the S3 client below does not cover.
hmac = "0.12"
instant-xml = "0.7"
jiff = "0.2"
korpis-extension = { path = "../korpis-extension" }
korpis-proto = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rusty-s3 = "0.10"
serde_json = "1"
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
korpis-backup = { path = "../korpis-backup", features = ["testing"] }
tempfile = "3"
