[package]
name = "korpis-containerd"
description = "containerd's gRPC API, generated with the Korpis protobuf toolchain, for the oci driver"
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
buffa-codegen = "=0.9.2"
connectrpc-build = "=0.9.0"

[dev-dependencies]
http = "1"
tokio = { workspace = true }

[lints]
workspace = true
