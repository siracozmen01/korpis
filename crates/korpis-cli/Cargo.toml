[package]
name = "korpis-cli"
description = "Korpis CLI, the reference client"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "korpis"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
buffa-descriptor = { version = "=0.9.2", features = ["reflect"] }
clap = { version = "4", features = ["derive", "env", "string"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "client", "client-tls"] }
http = "1"
# Reading the times a stream range is given in, a time of day in the local zone among them.
jiff = "0.2"
korpis-core.workspace = true
korpis-proto = { workspace = true, features = ["client"] }
korpis-recipe = { workspace = true }
korpis-wire = { workspace = true }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
# The local terminal in raw mode for `korpis console`, and the lock a session is exchanged
# under, with no unsafe code of ours.
rustix = { version = "1", features = ["fs", "termios"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
# Where `korpis login` keeps a session (§7 of docs/13-surface-cli.md): the system keyring, by
# each platform's own store, behind one interface.
keyring-core = "1"
# Naming a control plane's session file by the digest of its URL.
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
# The Secret Service over D-Bus, in Rust: no system D-Bus library to link.
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[dev-dependencies]
# A browser's passkey, to sign in to the panel that approves `korpis login`.
korpis-core = { workspace = true, features = ["testing"] }
korpis-recipe = { workspace = true }
korpis-server = { workspace = true }
korpis-store = { workspace = true, features = ["testing"] }
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
