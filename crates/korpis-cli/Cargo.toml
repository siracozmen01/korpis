[package]
name = "korpis-cli"
description = "Korpis CLI, the reference client"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "korpis"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
buffa = { version = "=0.9.2", features = ["json"] }
buffa-descriptor = { version = "=0.9.2", features = ["reflect"] }
clap = { version = "4", features = ["derive", "env", "string"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "client", "client-tls"] }
http = "1"
korpis-core.workspace = true
korpis-proto = { workspace = true, features = ["client"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = "1"
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
korpis-server = { workspace = true }
korpis-store = { workspace = true, features = ["testing"] }
tempfile = "3"
