[package]
name = "korpis-proto"
description = "Korpis wire schema: the client API, the agent protocol, and the internal agent protocols"
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The generated Connect service traits and their registration: what a program that serves or
# calls a service needs. Without it the crate is the messages alone, and links no RPC stack, which
# is what the privileged helper takes (§4 of docs/21-stack.md).
services = ["dep:connectrpc"]
# Generated clients for every service.
client = ["services", "connectrpc/client"]

[dependencies]
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
buffa-codegen = "=0.9.2"
connectrpc-build = "=0.9.0"

[lints]
workspace = true
