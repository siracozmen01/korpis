[package]
name = "korpis-proto"
description = "Korpis wire schema: the client API, the agent protocol, and the internal agent protocols"
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Generated clients for every service.
client = ["connectrpc/client"]

[dependencies]
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
connectrpc-build = "=0.9.0"

[lints]
workspace = true
