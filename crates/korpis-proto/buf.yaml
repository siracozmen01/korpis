# The wire schema's lint and breaking-change rules.
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Request and response types are shared where the docs define one message (PowerResponse).
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_STANDARD_NAME
breaking:
  use:
    - WIRE_JSON
