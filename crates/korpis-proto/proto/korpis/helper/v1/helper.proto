// SPDX-License-Identifier: Apache-2.0
//
// The privileged helper (§6 of docs/02-architecture.md): the only component on a node that holds
// root. It serves one structured request at a time over a local socket, from the supervisor
// only, and performs exactly these operations. There is no request that runs a command or takes
// a free-form path: every path it acts on is derived from identifiers it validates.
//
// The transport is not HTTP. The helper is synchronous and single-threaded (§4 of
// docs/21-stack.md), and an HTTP/2 server is the code it should least carry, so the service below
// names the verbs and the envelopes after it carry them: on a Unix stream socket, each message is
// a 4-byte big-endian length followed by that many bytes of one HelperRequest or HelperResponse,
// at most 1 MiB, and a connection carries one request at a time, answered in order.

syntax = "proto3";

package korpis.helper.v1;

import "korpis/backup/v1/backup.proto";
import "korpis/install/v1/install.proto";
import "korpis/v1/common.proto";
import "korpis/v1/placement.proto";
import "korpis/v1/provider.proto";

service HelperService {
  // Create a workload volume in a storage class, with byte and inode quota enforced by the
  // filesystem in the write path where the class can (§3 of docs/06-storage.md). Idempotent by
  // volume.
  rpc EnsureVolume(EnsureVolumeRequest) returns (EnsureVolumeResponse);
  // Remove a volume. Reached only from an approved, irreversible plan step.
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
  // Report a volume's usage as the filesystem accounts it.
  rpc VolumeUsage(VolumeUsageRequest) returns (VolumeUsageResponse);
  // Reserve a uid range for a workload, as its assignment names it, recorded on disk (§4.5 of
  // docs/04-runtimes.md).
  rpc EnsureIdRange(EnsureIdRangeRequest) returns (EnsureIdRangeResponse);
  // The storage classes this node offers, with what each enforces (§2 of docs/06-storage.md).
  rpc DescribeStorage(DescribeStorageRequest) returns (DescribeStorageResponse);
  // Take a read-only snapshot of a volume, in a class that can (§4 of docs/06-storage.md).
  // Idempotent by volume and snapshot.
  rpc SnapshotVolume(SnapshotVolumeRequest) returns (SnapshotVolumeResponse);
  // Make a volume what one of its snapshots holds, keeping its limits. Reached only from an
  // approved, irreversible plan step, with the workload stopped.
  rpc RollbackVolume(RollbackVolumeRequest) returns (RollbackVolumeResponse);
  // Remove one snapshot of a volume. Reached only from an approved, irreversible plan step.
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  // Start, watch, end, and forget a backup or restore job, below.
  rpc StartJob(StartJobRequest) returns (StartJobResponse);
  rpc JobStatus(JobStatusRequest) returns (JobStatusResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc ForgetJob(ForgetJobRequest) returns (ForgetJobResponse);
  // Make a workload's network what the request says (§4.1 of docs/07-networking.md): its own
  // network namespace, the routed link between it and the host, its addresses and routes, and
  // the rules that belong to it, inside the namespace and on the host. Idempotent by workload;
  // what changed is changed, and a network the node lost to a reboot is made again.
  rpc EnsureNetwork(EnsureNetworkRequest) returns (EnsureNetworkResponse);
  // Remove a workload's network: its rules, its link, and its namespace. Idempotent.
  rpc ReleaseNetwork(ReleaseNetworkRequest) returns (ReleaseNetworkResponse);
  // Whether this node can give workloads a network, and what in the host stands in its way.
  rpc DescribeNetwork(DescribeNetworkRequest) returns (DescribeNetworkResponse);
  // Makes the node's uplinks shape what its workloads send (§7 of docs/07-networking.md):
  // each declared uplink an HTB tree of its capacity, and every tree of Korpis's on an
  // interface no longer declared removed.
  rpc EnsureUplinks(EnsureUplinksRequest) returns (EnsureUplinksResponse);
  // What the host's table has counted of every workload's link (§7 of docs/07-networking.md):
  // each named counter, in one listing of the table, which the meter reads at each reading.
  rpc ReadCounters(ReadCountersRequest) returns (ReadCountersResponse);
  // Keeps the workloads' cpusets to the dedicated cores held (§5.2 of docs/05-scheduling.md):
  // under each driver's cgroup parent the request names, each one the helper was configured to
  // keep, its `shared` cgroup on the node's online CPUs less every CPU held, and the CPUs held
  // there written as the exclusive CPUs of that cgroup, the cgroups above it, and its `dedicated`
  // cgroup, which a driver's partitions take theirs from.
  rpc HoldCores(HoldCoresRequest) returns (HoldCoresResponse);
  // Keeps the node's side of the mesh (§9.1 of docs/07-networking.md): its WireGuard interface,
  // made with a key of the helper's own the first time, whose private half never leaves it; the
  // peers the request names, each with its allowed IPs, every other peer removed; and a route to
  // each peer's allowed IPs through the interface. Answers the interface's public key and when
  // each peer last completed a handshake. Added 2026-10-25.
  rpc KeepOverlay(KeepOverlayRequest) returns (KeepOverlayResponse);
  // Replicas (§2.2 of docs/06-storage.md), in a class that can send increments. SendReplica takes
  // a read-only snapshot of a volume kept for replication and starts sending it, whole or from a
  // snapshot sent before, into a pipe whose read end the answer carries; ReceiveReplica starts
  // receiving a volume's replica from a pipe whose write end the answer carries, and
  // ReceiveStatus says whether it ended, and how; ReplicaSnapshots lists what a volume's
  // replication keeps here, ReleaseReplica deletes one of them, and PromoteReplica makes the
  // volume a writable copy of one received; ReplicaVolumes lists every volume whose replication
  // keeps anything here; OpenTransfer opens the TCP socket a node receives replicas on, or sends
  // them from, at its own mesh address in the namespace the helper keeps the mesh in. Added
  // 2026-10-27.
  rpc SendReplica(SendReplicaRequest) returns (SendReplicaResponse);
  rpc ReceiveReplica(ReceiveReplicaRequest) returns (ReceiveReplicaResponse);
  rpc ReceiveStatus(ReceiveStatusRequest) returns (ReceiveStatusResponse);
  rpc ReplicaSnapshots(ReplicaSnapshotsRequest) returns (ReplicaSnapshotsResponse);
  rpc ReleaseReplica(ReleaseReplicaRequest) returns (ReleaseReplicaResponse);
  rpc PromoteReplica(PromoteReplicaRequest) returns (PromoteReplicaResponse);
  rpc ReplicaVolumes(ReplicaVolumesRequest) returns (ReplicaVolumesResponse);
  rpc OpenTransfer(OpenTransferRequest) returns (OpenTransferResponse);
}

// One request, as the transport carries it.
message HelperRequest {
  oneof verb {
    EnsureVolumeRequest ensure_volume = 1;
    DeleteVolumeRequest delete_volume = 2;
    VolumeUsageRequest volume_usage = 3;
    EnsureIdRangeRequest ensure_id_range = 4;
    DescribeStorageRequest describe_storage = 5;
    SnapshotVolumeRequest snapshot_volume = 6;
    RollbackVolumeRequest rollback_volume = 7;
    DeleteSnapshotRequest delete_snapshot = 8;
    StartJobRequest start_job = 9;
    JobStatusRequest job_status = 10;
    CancelJobRequest cancel_job = 11;
    ForgetJobRequest forget_job = 12;
    CommitJobRequest commit_job = 13;
    ListJobsRequest list_jobs = 14;
    EnsureNetworkRequest ensure_network = 15;
    ReleaseNetworkRequest release_network = 16;
    DescribeNetworkRequest describe_network = 17;
    OpenResolverRequest open_resolver = 18;
    OpenIngressRequest open_ingress = 19;
    StartIngressRequest start_ingress = 20;
    StopIngressRequest stop_ingress = 21;
    OpenFilesRequest open_files = 22;
    EnsureUplinksRequest ensure_uplinks = 23;
    ReadCountersRequest read_counters = 24;
    OpenProbeRequest open_probe = 25;
    HoldCoresRequest hold_cores = 26;
    KeepOverlayRequest keep_overlay = 27;
    SendReplicaRequest send_replica = 28;
    ReceiveReplicaRequest receive_replica = 29;
    ReceiveStatusRequest receive_status = 30;
    ReplicaSnapshotsRequest replica_snapshots = 31;
    ReleaseReplicaRequest release_replica = 32;
    PromoteReplicaRequest promote_replica = 33;
    ReplicaVolumesRequest replica_volumes = 34;
    OpenTransferRequest open_transfer = 35;
  }
}

// One answer, as the transport carries it: the verb's response, or why there is none.
message HelperResponse {
  oneof result {
    EnsureVolumeResponse ensure_volume = 1;
    DeleteVolumeResponse delete_volume = 2;
    VolumeUsageResponse volume_usage = 3;
    EnsureIdRangeResponse ensure_id_range = 4;
    DescribeStorageResponse describe_storage = 5;
    SnapshotVolumeResponse snapshot_volume = 6;
    RollbackVolumeResponse rollback_volume = 7;
    DeleteSnapshotResponse delete_snapshot = 8;
    StartJobResponse start_job = 9;
    JobStatusResponse job_status = 10;
    CancelJobResponse cancel_job = 11;
    ForgetJobResponse forget_job = 12;
    CommitJobResponse commit_job = 13;
    ListJobsResponse list_jobs = 14;
    HelperError error = 15;
    EnsureNetworkResponse ensure_network = 16;
    ReleaseNetworkResponse release_network = 17;
    DescribeNetworkResponse describe_network = 18;
    OpenResolverResponse open_resolver = 19;
    OpenIngressResponse open_ingress = 20;
    StartIngressResponse start_ingress = 21;
    StopIngressResponse stop_ingress = 22;
    OpenFilesResponse open_files = 23;
    EnsureUplinksResponse ensure_uplinks = 24;
    ReadCountersResponse read_counters = 25;
    OpenProbeResponse open_probe = 26;
    HoldCoresResponse hold_cores = 27;
    KeepOverlayResponse keep_overlay = 28;
    SendReplicaResponse send_replica = 29;
    ReceiveReplicaResponse receive_replica = 30;
    ReceiveStatusResponse receive_status = 31;
    ReplicaSnapshotsResponse replica_snapshots = 32;
    ReleaseReplicaResponse release_replica = 33;
    PromoteReplicaResponse promote_replica = 34;
    ReplicaVolumesResponse replica_volumes = 35;
    OpenTransferResponse open_transfer = 36;
  }
}

message HelperError {
  HelperErrorCode code = 1;
  string message = 2;
}

enum HelperErrorCode {
  HELPER_ERROR_CODE_UNSPECIFIED = 0;
  // The request is malformed or names something it may not: refused, and logged as such.
  HELPER_ERROR_CODE_REFUSED = 1;
  // The volume or class does not exist.
  HELPER_ERROR_CODE_NOT_FOUND = 2;
  // The verb is not one this helper knows: a newer supervisor talking to an older helper.
  HELPER_ERROR_CODE_UNSUPPORTED = 3;
  // The kernel or the filesystem refused.
  HELPER_ERROR_CODE_FAILED = 4;
}

message EnsureVolumeRequest {
  string volume = 1;
  string workload = 2;
  string storage_class = 3;
  uint64 size_bytes = 4;
  uint64 inodes = 5;
  // Unused, and kept only so the field number is never reused. Files carry workload-relative
  // ids (§4.5 of docs/04-runtimes.md), so the volume root is owned by id 0 as the workload sees
  // it, whatever range the workload holds on this node.
  uint32 uid_base = 6 [deprecated = true];
  // The workload's driver declares its volumes block devices (§3.1 of docs/06-storage.md): the
  // volume holds one image of `size_bytes`, an ext4 the helper makes empty and never mounts,
  // grown when a larger size is asked and never shrunk. A volume of one kind is never made the
  // other.
  bool block_device = 7;
}

message EnsureVolumeResponse {
  // The host path of the volume root, for the driver's mount list; for a block device, the
  // image it holds.
  string host_path = 1;
  bool created = 2;
  // Whether the size and inode limits asked for are enforced in the write path. False on a
  // class that cannot (§2 of docs/06-storage.md), where they are kept nowhere and shown nowhere.
  bool quota_enforced = 3;
  // The class it is in: the one asked for, or the helper's default when none was.
  string storage_class = 4;
}

// A workload's network (§4.1 of docs/07-networking.md): a network namespace owned by a user
// namespace mapped to the workload's uid range, since a container's root may mount its own
// sysfs only in a network it owns, and it holds no capability to change it. The supervisor
// allocates the addresses from the node's pools and the helper applies them; it derives every
// name it makes, the namespaces' directory and the host side of the link, from the workload
// identifier it validates.
message EnsureNetworkRequest {
  string workload = 1;
  // The workload's IPv4 address, in the pool below.
  string ipv4 = 2;
  // The node's IPv4 pool, as a prefix, which the address must be a host address of.
  string ipv4_pool = 3;
  // The workload's IPv6 address, in the pool below; empty for none.
  string ipv6 = 4;
  // The node's IPv6 pool, as a prefix. What leaves the node from a unique local address is
  // translated and what leaves from any other is not, since only a prefix routed to the node
  // gives a workload a global address.
  string ipv6_pool = 5;
  // The uid range the workload holds on this node (§4.5 of docs/04-runtimes.md), which the user
  // namespace that owns its network maps.
  uint32 uid_base = 7;
  uint32 uid_count = 8;
  // The ports inside the workload its declared endpoints listen on, which its own firewall
  // accepts new connections to; every other port is closed to new connections from anywhere.
  repeated Port inbound = 9;
  // The ports of the node forwarded to it (§3 of docs/07-networking.md): each on every address
  // of the node but loopback, to the workload's address and a port inside it.
  repeated Forward forwards = 10;
  // Destinations opened for it past the egress default (§6 of docs/07-networking.md): the
  // control plane's API, for an installed extension's workload, and nothing else today.
  repeated Destination opened = 11;
  // Its own outbound rules, from its intent's egress policy, before the egress default.
  repeated Rule egress = 12;
  // Its own limits on the connections it opens: at most the default's, and zero for the
  // default (§6 of docs/07-networking.md).
  uint32 max_connections = 13;
  uint32 new_per_sec = 14;
  // What it may send and be sent (§7 of docs/07-networking.md); absent shapes nothing.
  Bandwidth bandwidth = 15;
  // The workload's interface is a tap, for a microVM's guest to hold (NETWORK_MODE_TAP, §4.1 of
  // docs/07-networking.md): the addresses are the guest's, set by its own kernel, and the
  // namespace routes between the tap and its link, which the VMM, running as the range's first
  // id, alone may open. A network made for one kind of interface is made anew for the other.
  bool tap = 16;
  // The address of the workload's own it holds, where it holds one (§3.7 of
  // docs/07-networking.md): every new connection to it translated to the workload's IPv4 address,
  // all ports alike, ahead of every other translation on the node; and what the workload sends
  // beyond the node leaving from it. Added 2026-10-26.
  DedicatedAddress dedicated = 17;
}

// A dedicated address as the node holds it.
message DedicatedAddress {
  // The IPv4 address.
  string address = 1;
  // The node's interface it is answered on, as a host address added there and removed when the
  // workload leaves, where its pool's addresses are on the node's link; empty where they are
  // routed to the node. An address the node held already is left to it.
  string interface = 2;
}

// A workload's bandwidth, in bits a second; zero for none of each. A reservation is held on
// every uplink EnsureUplinks made, in a class the helper allocates and keeps for the workload's
// link; the egress limit is held there and on the workload's own link, the ingress limit on the
// host's side of its link.
message Bandwidth {
  uint64 egress_reservation = 1;
  uint64 egress_limit = 2;
  uint64 ingress_limit = 3;
  // Its egress budget is spent (§5.1 of docs/05-scheduling.md): held to `floor` instead of its
  // limit, or with `cut_off` sending nothing beyond the node.
  bool exhausted = 4;
  uint64 floor = 5;
  bool cut_off = 6;
}

// An interface the node's workloads leave by, and the capacity it sells.
message Uplink {
  string interface = 1;
  // Bits a second.
  uint64 capacity = 2;
  // What the node keeps of it for its own traffic, the default class's floor.
  uint64 reserve = 3;
}

message EnsureUplinksRequest {
  // Every uplink, the whole set: one not named loses its tree.
  repeated Uplink uplinks = 1;
}

message EnsureUplinksResponse {
  // The interfaces shaped.
  repeated string shaped = 1;
  // The interfaces whose trees were removed.
  repeated string removed = 2;
}

message ReadCountersRequest {}

message ReadCountersResponse {
  // Every counter of a workload's link: `<link>_egress`, and `<link>_<tcp|udp>_<port>_in` and
  // `_out` for each port whose accounting is on.
  repeated Counter counters = 1;
}

// A named counter of the host's table, cumulative since it was made.
message Counter {
  string name = 1;
  uint64 bytes = 2;
  uint64 packets = 3;
}

// Opens the sockets of a workload's resolver inside its network namespace, on the resolver's
// address and port 53 (§5.1 of docs/07-networking.md), for the supervisor to answer on.
message OpenResolverRequest {
  string workload = 1;
}

// The sockets are attached to this answer's frame as SCM_RIGHTS: UDP first, then TCP, which
// is listening. Each belongs to the workload's namespace, wherever its holder runs.
message OpenResolverResponse {
  uint32 attached = 1;
}

// Opens a socket inside a workload's network namespace for the supervisor's health probes (§5
// of docs/04-runtimes.md): an IPv4 socket of the transport asked for, a stream unless UDP is,
// neither bound nor connected, which the supervisor connects to the workload's address. A connection made from it starts inside the
// namespace, so it reaches the workload as the workload's own loopback or its guest's link
// does, past the rules its endpoints set for connections from elsewhere, and it reaches
// nothing the workload itself could not.
message OpenProbeRequest {
  string workload = 1;
  // TCP when unspecified.
  Transport transport = 2;
}

// The socket is attached to this answer's frame as SCM_RIGHTS.
message OpenProbeResponse {
  uint32 attached = 1;
}

// Opens a file session on a workload's volumes (§3.2 of docs/06-storage.md): the helper starts a
// filesystem worker that sees those volumes and nothing else, confined as an install's worker is,
// and answers with the session's socket.
message OpenFilesRequest {
  // The workload, and the base of the id range it holds, which the worker runs as: the helper
  // refuses a range its ledger does not record for that workload.
  string workload = 1;
  uint32 id_base = 2;
  // Each volume by the absolute path the workload sees it at, as an install names them.
  repeated FileVolume volumes = 3;
  // Whether the session may change what it sees; it only reads otherwise.
  bool write = 4;
}

// One volume of a file session.
message FileVolume {
  // The absolute path the workload sees it at: no '.' or '..' component, none beneath /.korpis,
  // and no two the same.
  string path = 1;
  // The volume, by its identifier.
  string volume = 2;
  // Filled in by the helper for the worker: the directory it is.
  string directory = 3;
  // Mounted read-only in the workload: the session reads it, whatever else it may do.
  bool read_only = 4;
}

// The session's socket is attached to this answer's frame as SCM_RIGHTS: a stream on which each
// korpis.v1.FileRequest is written, and each korpis.v1.FileResponse read, as four bytes of
// little-endian length and then the message. Closing it ends the worker.
message OpenFilesResponse {
  uint32 attached = 1;
}

// What the helper gives the filesystem worker on its standard input; the session is its output.
message FileWorkerSpec {
  // The empty directory its root is built on, in its own mount namespace.
  string root = 1;
  uint32 id_base = 2;
  repeated FileVolume volumes = 3;
  bool write = 4;
  // The cgroup it joins first; empty to stay in the helper's.
  string cgroup = 5;
}

// Opens ports 80 and 443 on each of the node's advertised addresses, for its ingress proxy (§3.2
// of docs/07-networking.md): binding them needs a privilege neither the supervisor nor the proxy
// has. Loopback, unspecified, and multicast addresses are refused.
message OpenIngressRequest {
  repeated string addresses = 1;
}

// The sockets are attached to this answer's frame as SCM_RIGHTS, listening: port 80 of each
// address in the order asked, then port 443 of each.
message OpenIngressResponse {
  uint32 attached = 1;
}

// Starts the ingress proxy, `korpis-ingress --control <control>`, as the user and group that
// asked, with no capability, in a cgroup of its own whose new connections may leave only through
// a workload's link. A proxy the helper started before is stopped first.
message StartIngressRequest {
  // The asker's socket the proxy connects to, an absolute path.
  string control = 1;
}

message StartIngressResponse {
  uint32 pid = 1;
  // Whether the proxy is in its own cgroup, and whether its new connections are confined to the
  // workloads' links; each is false where the node cannot do it, and the asker reports it.
  bool cgroup = 2;
  bool outbound = 3;
}

// Stops the ingress proxy the helper started, if it runs.
message StopIngressRequest {}

message StopIngressResponse {
  bool stopped = 1;
}

// An address and a port, over a transport, opened past the egress default.
message Destination {
  string address = 1;
  uint32 port = 2;
  Transport transport = 3;
  // Why it is opened: a dependency's target (§5 of docs/07-networking.md).
  DestinationReason reason = 4;
}

enum DestinationReason {
  // The control plane's API for an installed extension's workload, until the node relayed it
  // instead (§9.5 of docs/08-identity.md).
  reserved 1;
  reserved "DESTINATION_REASON_CONTROL_PLANE";
  DESTINATION_REASON_UNSPECIFIED = 0;
  DESTINATION_REASON_DEPENDENCY = 2;
  // A dependency's target on another node, opened only through the mesh's interface, so that a
  // node with no route to the target through the mesh sends nothing towards it (§9.1 of
  // docs/07-networking.md).
  DESTINATION_REASON_DEPENDENCY_OVERLAY = 3;
}

// What a forwarded or accepted port is carried over.
enum Transport {
  TRANSPORT_UNSPECIFIED = 0;
  TRANSPORT_TCP = 1;
  TRANSPORT_UDP = 2;
}

message Port {
  Transport transport = 1;
  uint32 port = 2;
  // Who may connect to it, from the endpoint's policy, in order: the first rule that matches
  // decides, and a connection no rule matches is let in. A rule's ports are empty here.
  repeated Rule rules = 3;
  // Connections to it at once, and new ones a second; zero for no limit of its own.
  uint32 max_connections = 4;
  uint32 new_per_sec = 5;
  // What the endpoint may send from its port and be sent to it, in bits a second, each held in
  // a class of its own on the workload's link (§7 of docs/07-networking.md); zero for no limit
  // of its own.
  uint64 egress_limit = 6;
  uint64 ingress_limit = 7;
  // Whether what it carries is counted, in and out, in the host's table.
  bool accounted = 8;
  // Whether it is reached from outside the node at the workload's own address: an endpoint
  // exposed `node_port`, `node_bound`, or `dedicated_ip`. A port that is not is reached from
  // outside only through what the node translates or proxies, and otherwise only by other
  // workloads (§4 of docs/07-networking.md). Added 2026-10-26.
  bool outside = 9;
}

// A rule of a workload's own policy (§6 of docs/07-networking.md), naming an address range.
message Rule {
  // Allow: inbound, let in; outbound, on to the egress default, which decides the rest. Deny:
  // dropped, and counted.
  bool allow = 1;
  // The peer's range, as address/length; empty for a rule naming workloads, which names
  // `addresses` instead.
  string cidr = 2;
  // The peer's ports; empty for any.
  repeated PortSpan ports = 3;
  // Unspecified for any.
  Transport transport = 4;
  // The addresses of the workloads a rule naming workloads names on this node, which the
  // control plane resolved (§6 of docs/07-networking.md); none matches nothing. Added
  // 2026-10-26.
  repeated string addresses = 5;
}

// An inclusive range of ports.
message PortSpan {
  uint32 first = 1;
  uint32 last = 2;
}

message Forward {
  Transport transport = 1;
  // The node's port, which the control plane allocated, unique on the node.
  uint32 node_port = 2;
  // The port inside the workload.
  uint32 container_port = 3;
}

message EnsureNetworkResponse {
  // The directory of the workload's namespaces, `net` and `user`, which the driver joins.
  string namespaces = 1;
  // The host side of the workload's link.
  string host_link = 2;
  // Whether IPv6 was configured: false when the request named none, or the node does not
  // forward IPv6, which the helper logs with the command that enables it and does not run.
  bool ipv6 = 3;
}

message ReleaseNetworkRequest {
  string workload = 1;
}

message ReleaseNetworkResponse {
  // Whether anything was there to remove.
  bool released = 1;
}

message DescribeNetworkRequest {}

message DescribeNetworkResponse {
  // Whether EnsureNetwork can work: nftables answers and IPv4 forwarding is on.
  bool offered = 1;
  // Why not, when it is not, with what the operator can do about it.
  string why_not = 2;
  // Whether IPv6 forwarding is on, which a workload's IPv6 address needs.
  bool ipv6 = 3;
  // The base chains of another firewall on the forward hook that drop what they do not accept,
  // as `family table chain`: each drops the traffic of every workload that leaves the node or
  // reaches it from outside until its operator opens it for Korpis's links, which the helper
  // does not do (§4.1 of docs/07-networking.md).
  repeated string closed_forward = 4;
  // Whether the kernel answers a SYN flood with SYN cookies, which keeps half-open connections
  // from filling the connection table (§6 of docs/07-networking.md).
  bool syn_cookies = 5;
  // Whether the node can shape bandwidth: `tc` answers and makes an HTB qdisc (§7 of
  // docs/07-networking.md); and why not, when it cannot.
  bool shapes = 6;
  string why_not_shapes = 7;
}

message SnapshotVolumeRequest {
  string volume = 1;
  // The snapshot's identifier, unique within the volume.
  string snapshot = 2;
}

message SnapshotVolumeResponse {
  bool created = 1;
}

message RollbackVolumeRequest {
  string volume = 1;
  string snapshot = 2;
}

message RollbackVolumeResponse {}

message DeleteSnapshotRequest {
  string volume = 1;
  string snapshot = 2;
}

message DeleteSnapshotResponse {
  bool deleted = 1;
}

message SendReplicaRequest {
  // The volume, in the class holding it.
  string volume = 1;
  // The snapshot taken for this send, kept for replication: an identifier; taken again it is
  // the one already taken.
  string snapshot = 2;
  // A snapshot sent before, which the receiver holds: only what differs from it is sent. Empty
  // to send the whole volume.
  string parent = 3;
}

message SendReplicaResponse {
  // The descriptors the answer carries: one, the pipe's read end, at the stream's end once the
  // whole snapshot was written into it, or early if sending failed.
  uint32 attached = 1;
}

message ReceiveReplicaRequest {
  // The volume whose replica this is, which is not on this node.
  string volume = 1;
  // The class it is received into: one that can send increments.
  string storage_class = 2;
  // The snapshot the stream carries.
  string snapshot = 3;
}

message ReceiveReplicaResponse {
  // The descriptors the answer carries: one, the pipe's write end; none when the snapshot is
  // already held here whole.
  uint32 attached = 1;
  bool held = 2;
}

message ReceiveStatusRequest {
  string volume = 1;
  string storage_class = 2;
  string snapshot = 3;
}

message ReceiveStatusResponse {
  ReceiveState state = 1;
  // Why it failed, as the receiver said.
  string detail = 2;
}

enum ReceiveState {
  RECEIVE_STATE_UNSPECIFIED = 0;
  // Still reading the stream.
  RECEIVE_STATE_RUNNING = 1;
  // The snapshot is held here whole and read-only.
  RECEIVE_STATE_HELD = 2;
  // The stream ended short or was refused; nothing of it is kept.
  RECEIVE_STATE_FAILED = 3;
  // Nothing is being received, nor held: a helper restarted since, or never asked.
  RECEIVE_STATE_UNKNOWN = 4;
}

message ReplicaSnapshotsRequest {
  string volume = 1;
  // The class to look in; empty for every class.
  string storage_class = 2;
}

message ReplicaSnapshotsResponse {
  // The snapshots held whole here for the volume's replication, by name.
  repeated string snapshots = 1;
}

message ReleaseReplicaRequest {
  string volume = 1;
  string storage_class = 2;
  string snapshot = 3;
}

message ReleaseReplicaResponse {
  bool released = 1;
}

message PromoteReplicaRequest {
  // The volume whose replica it is, as the control plane names it.
  string volume = 1;
  string storage_class = 2;
  // A snapshot received whole, which becomes the volume.
  string snapshot = 3;
  // The helper's identifier the volume takes here, which no volume here may have: never the one
  // it had on its own node, which a copy left here by an earlier failover may still hold. The
  // replica's snapshot stays, and is released as any other once nothing keeps it.
  string into = 4;
}

message ReplicaVolumesRequest {}

message ReplicaVolumesResponse {
  // Each volume whose replication keeps a snapshot here, in each class: on a volume's node the
  // snapshots it sent, named by the helper's identifier of the volume; on a replica's node those
  // it received, named by the volume as the control plane names it.
  repeated ReplicaHeld held = 1;
}

// A TCP socket at the node's own mesh address: listening on `port` when `listen`, and otherwise
// bound to the address alone, for connecting from, so what it sends leaves from that address.
message OpenTransferRequest {
  // The node's own mesh address, which must be on this machine.
  string mesh_address = 1;
  // Unprivileged: 1024 or above.
  uint32 port = 2;
  bool listen = 3;
}

// The socket is attached to this answer's frame as SCM_RIGHTS.
message OpenTransferResponse {
  uint32 attached = 1;
}

message ReplicaHeld {
  string storage_class = 1;
  string volume = 2;
  // By name.
  repeated string snapshots = 3;
}

message PromoteReplicaResponse {
  // The volume's path, as EnsureVolume would answer it.
  string host_path = 1;
}

message DeleteVolumeRequest {
  string volume = 1;
}

message DeleteVolumeResponse {
  bool deleted = 1;
}

message VolumeUsageRequest {
  string volume = 1;
}

message VolumeUsageResponse {
  uint64 used_bytes = 1;
  uint64 used_inodes = 2;
  uint64 limit_bytes = 3;
  uint64 limit_inodes = 4;
  // Whether the filesystem accounts the volume at all. A class without quota accounting answers
  // false and zeros: usage is read, never computed by walking the tree (§3 of
  // docs/06-storage.md).
  bool accounted = 5;
  // The volume is a block device, and its bytes are the blocks its image has allocated, which
  // grow as its guest writes and do not shrink when it deletes: not what the guest's filesystem
  // holds (§3.1 of docs/06-storage.md).
  bool allocated = 6;
}

message EnsureIdRangeRequest {
  string workload = 1;
  uint32 uid_base = 2;
  uint32 uid_count = 3;
}

message EnsureIdRangeResponse {}

message DescribeStorageRequest {}

message DescribeStorageResponse {
  repeated korpis.v1.StorageClassInfo classes = 1;
}

// Starts a backup or restore job (§5.5 of docs/06-storage.md), or an install job (§4 of
// docs/09-recipes.md), as a process of its own, in a cgroup of its own, holding only the
// capabilities its work needs and confined by Landlock to what it works in. The helper names
// every directory from the identifiers below; a backup or restore job receives the data key and
// the store's access on its standard input. Idempotent by job: a job already started is not
// started again.
message StartJobRequest {
  // The job's identifier: letters, digits, '-', '_', '.', at most 128.
  string job = 1;
  oneof work {
    BackupVolume backup = 2;
    RestoreVolume restore = 3;
    InstallWork install = 7;
  }
  bytes data_key = 4;
  korpis.v1.S3Access store = 5;
  uint32 concurrency = 6;
  // Access to the repository's recipe content, kept once per repository (§5.2 of
  // docs/06-storage.md): written by a backup, read by a restore. Absent where none was granted.
  korpis.v1.S3Access content_store = 8;
}

message BackupVolume {
  string volume = 1;
  // The snapshot to read, taken for the job; empty to read the live volume, which is then
  // recorded as possibly inconsistent.
  string snapshot = 2;
  string backup = 3;
  string parent = 4;
  repeated korpis.backup.v1.RecipeContent content = 5;
  // Snapshot the volume for the job, in a class that can, and read that: a single point in
  // time. ForgetJob releases the snapshot. Ignored when `snapshot` names one already taken.
  bool take_snapshot = 6;
}

message RestoreVolume {
  // The volume restored into. For a whole volume it must be empty.
  string volume = 1;
  string backup = 2;
  // One path in the backup; empty for the whole volume.
  string path = 3;
  // For one path: a directory created at the volume's root to restore it into, which must not
  // exist; empty for the whole volume.
  string into = 4;
  // Restore the whole backup into a staging place beside the volume, which CommitJob makes the
  // volume and ForgetJob otherwise discards; `path` and `into` are then empty. The volume is not
  // touched until the commit, so the workload may run while the job does.
  bool replace = 5;
  // Restore the whole backup of a block device into a staging place of the job's own beside the
  // volume, for its image to be read in a service guest (§5.4 of docs/06-storage.md), never made
  // the volume: CommitJob refuses it, and ForgetJob discards it. `path`, `into`, and `replace`
  // are then unset.
  bool reading = 6;
}

// A recipe's install actions, run beneath a workload's volumes by a worker that sees nothing else
// (§4 of docs/09-recipes.md).
message InstallWork {
  // As korpis.install.v1.InstallSpec carries them.
  repeated korpis.v1.Value actions = 1;
  uint32 from = 2;
  // Each volume by the absolute path the workload sees it at: no '.' or '..' component, none
  // beneath /.korpis, and no two the same.
  repeated korpis.install.v1.InstallVolume volumes = 3;
  map<string, string> files = 4;
  // The workload installed into, and the base of the id range it holds, which the worker runs
  // as: the helper refuses a range its ledger does not record for that workload.
  string workload = 5;
  uint32 id_base = 6;
}

message StartJobResponse {
  bool started = 1;
}

message JobStatusRequest {
  string job = 1;
}

message JobStatusResponse {
  JobState state = 1;
  // Once a backup or restore job finished.
  korpis.backup.v1.JobResult result = 2;
  // Once an install job finished.
  korpis.install.v1.InstallResult install = 3;
  // For an install job however it stands: how many of its actions have run, counting from the
  // start of the install, as it last recorded. A job lost part way resumes here.
  uint32 progress = 4;
  // For a reading restore however it stands: the image it restores into,
  // `<volume root>/<staging place>/block.ext4`, which a driver's file session reads once the job
  // has finished whole.
  string image = 5;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_RUNNING = 1;
  JOB_STATE_FINISHED = 2;
  // It ended without writing a result: killed, or the node went down under it.
  JOB_STATE_LOST = 3;
  // No job of that identifier is known.
  JOB_STATE_UNKNOWN = 4;
}

// Ends a running job. What it wrote stays: a backup's objects are reused by the next, and a
// restore's directory is the caller's to remove.
message CancelJobRequest {
  string job = 1;
}

message CancelJobResponse {
  bool cancelled = 1;
}

// Removes what the helper keeps of a job that ended: its result and its cgroup, the snapshot it
// took, and the staging place of a replacing restore never committed. Refused while it runs.
message ForgetJobRequest {
  string job = 1;
}

message ForgetJobResponse {}

// Makes a replacing restore that finished whole and verified the volume: the staging place and
// the volume are exchanged in one rename, the old data removed, and the volume's limit kept.
// Doing it again after it was done changes nothing.
message CommitJobRequest {
  string job = 1;
}

message CommitJobResponse {}

// The jobs the helper keeps, for whoever forgets the ones nothing names any more.
message ListJobsRequest {}

message ListJobsResponse {
  repeated JobSummary jobs = 1;
}

message JobSummary {
  string job = 1;
  JobState state = 2;
}

// The logical CPUs of every core the node's objects hold, by the cgroup parent of the driver whose
// objects hold them, in full each time: every parent the node's drivers declare is named, one
// whose objects hold none with no CPUs.
message HoldCoresRequest {
  repeated HeldCores parents = 1;
}

// The CPUs held under one driver's cgroup parent.
message HeldCores {
  // From the unified hierarchy's root: `/korpis`.
  string parent = 1;
  repeated uint32 cpus = 2;
}

// What the shared cgroups were left on.
message HoldCoresResponse {
  repeated uint32 shared = 1;
}

// The node's side of the mesh, in full each time: the port its interface listens on, and every
// peer it is to have.
message KeepOverlayRequest {
  uint32 port = 1;
  repeated OverlayPeer peers = 2;
  // What another node's workload may reach of this node's through the mesh: a dependent's
  // address, to a port of its dependency's endpoint (§9.1 of docs/07-networking.md). Nothing
  // else arriving on the interface reaches a workload.
  repeated OverlayAdmitted admitted = 3;
  // This node's own address in the mesh, the last of its IPv4 pool, which no workload is given:
  // put on the interface, and the local end of every GRE link to and from an edge (§3.1 of
  // docs/07-networking.md). Empty for none, and then no links are kept. Added 2026-10-26.
  string mesh_address = 4;
  // What this node forwards and holds as a member of edge groups, and what edges forward to it.
  EdgeTable edges = 5;
  // This node's own IPv6 address in the mesh, the last of its unique local prefix: put on the
  // interface beside `mesh_address`, at which the node answers the probe of an IPv6 address an
  // edge forwards to it. Empty for none. Added 2026-10-26.
  string mesh_address_v6 = 6;
  // The mesh addresses of the nodes that send this node's replicas their volumes (§2.2 of
  // docs/06-storage.md): each admitted to `mesh_address`, on TCP port `transfer_port`, and
  // nothing else of them beyond what the rest admits. Added 2026-10-27.
  repeated string transfer_sources = 7;
  uint32 transfer_port = 8;
}

// The node's part in edge groups (§3.1 of docs/07-networking.md), kept whole by every call.
message EdgeTable {
  // The other end of every GRE link kept, by its mesh address: each node this member forwards
  // to, and each edge forwarding to this node. Every other link is removed.
  repeated string tunnels = 1;
  // As a member: each address, transport, and port translated.
  repeated EdgeTranslation translations = 2;
  // As a member: each address this node holds now, IPv4 or IPv6, put on its interface and
  // announced; every packet to one of them that no translation takes is refused, but for the
  // neighbour discovery of an IPv6 one.
  repeated EdgeHold holds = 3;
  // As a node behind edges: what each may reach here through its link.
  repeated EdgeAdmit admits = 4;
}

// One address, transport, and port a member translates.
message EdgeTranslation {
  string address = 1;
  uint32 port = 2;
  Transport transport = 3;
  // The mesh address of the node it is carried to, whose GRE link it enters; empty where it is
  // this node's own workload.
  string via = 4;
  // The workload's address and port; empty, and the port refused, where it runs nowhere.
  string to_address = 5;
  uint32 to_port = 6;
}

// An address a member holds.
message EdgeHold {
  string address = 1;
  // The interface it is put on and answered for, where its pool is on a link the members share;
  // empty where a router sends it here, when it is put on the loopback.
  string interface = 2;
}

// What one edge may reach of this node through its GRE link.
message EdgeAdmit {
  // The edge's mesh address, the other end of the link.
  string source = 1;
  // A workload's address on this node, or this node's mesh address for the probe.
  string destination = 2;
  uint32 port = 3;
  Transport transport = 4;
}

// One dependent on another node, admitted to one endpoint of a workload on this node.
message OverlayAdmitted {
  // The dependent's address.
  string source = 1;
  // The workload's address on this node.
  string destination = 2;
  // The endpoint's container port.
  uint32 port = 3;
  Transport transport = 4;
}

// Another node of the mesh.
message OverlayPeer {
  // Its WireGuard public key, 32 bytes.
  bytes public_key = 1;
  // Where it is reached, as `address:port`; empty for a peer that advertises no address, which
  // is reached once it has reached this node.
  string endpoint = 2;
  // Its workload pools, as CIDR text: where packets to it are routed, and the only sources
  // accepted from it.
  repeated string allowed_ips = 3;
}

message KeepOverlayResponse {
  // The interface's public key, 32 bytes.
  bytes public_key = 1;
  repeated PeerHandshake handshakes = 2;
}

// When a peer last completed a handshake with this node.
message PeerHandshake {
  bytes public_key = 1;
  // Seconds since the Unix epoch; zero for never.
  int64 latest_unix_seconds = 2;
}
