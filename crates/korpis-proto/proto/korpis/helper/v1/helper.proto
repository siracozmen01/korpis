// SPDX-License-Identifier: Apache-2.0
//
// The privileged helper (§6 of docs/02-architecture.md): the only component on a node that holds
// root. It serves one structured request at a time over a local socket, from the supervisor
// only, and performs exactly these operations. There is no request that runs a command or takes
// a free-form path: every path it acts on is derived from identifiers it validates.
//
// The transport is not HTTP. The helper is synchronous and single-threaded (§4 of
// docs/21-stack.md), and an HTTP/2 server is the code it should least carry, so the service below
// names the verbs and the envelopes after it carry them: on a Unix stream socket, each message is
// a 4-byte big-endian length followed by that many bytes of one HelperRequest or HelperResponse,
// at most 1 MiB, and a connection carries one request at a time, answered in order.

syntax = "proto3";

package korpis.helper.v1;

import "korpis/backup/v1/backup.proto";
import "korpis/install/v1/install.proto";
import "korpis/v1/common.proto";
import "korpis/v1/placement.proto";
import "korpis/v1/provider.proto";

service HelperService {
  // Create a workload volume in a storage class, with byte and inode quota enforced by the
  // filesystem in the write path where the class can (§3 of docs/06-storage.md). Idempotent by
  // volume.
  rpc EnsureVolume(EnsureVolumeRequest) returns (EnsureVolumeResponse);
  // Remove a volume. Reached only from an approved, irreversible plan step.
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
  // Report a volume's usage as the filesystem accounts it.
  rpc VolumeUsage(VolumeUsageRequest) returns (VolumeUsageResponse);
  // Reserve a uid range for a workload, as its assignment names it, recorded on disk (§4.5 of
  // docs/04-runtimes.md).
  rpc EnsureIdRange(EnsureIdRangeRequest) returns (EnsureIdRangeResponse);
  // The storage classes this node offers, with what each enforces (§2 of docs/06-storage.md).
  rpc DescribeStorage(DescribeStorageRequest) returns (DescribeStorageResponse);
  // Take a read-only snapshot of a volume, in a class that can (§4 of docs/06-storage.md).
  // Idempotent by volume and snapshot.
  rpc SnapshotVolume(SnapshotVolumeRequest) returns (SnapshotVolumeResponse);
  // Make a volume what one of its snapshots holds, keeping its limits. Reached only from an
  // approved, irreversible plan step, with the workload stopped.
  rpc RollbackVolume(RollbackVolumeRequest) returns (RollbackVolumeResponse);
  // Remove one snapshot of a volume. Reached only from an approved, irreversible plan step.
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  // Start, watch, end, and forget a backup or restore job, below.
  rpc StartJob(StartJobRequest) returns (StartJobResponse);
  rpc JobStatus(JobStatusRequest) returns (JobStatusResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc ForgetJob(ForgetJobRequest) returns (ForgetJobResponse);
}

// One request, as the transport carries it.
message HelperRequest {
  oneof verb {
    EnsureVolumeRequest ensure_volume = 1;
    DeleteVolumeRequest delete_volume = 2;
    VolumeUsageRequest volume_usage = 3;
    EnsureIdRangeRequest ensure_id_range = 4;
    DescribeStorageRequest describe_storage = 5;
    SnapshotVolumeRequest snapshot_volume = 6;
    RollbackVolumeRequest rollback_volume = 7;
    DeleteSnapshotRequest delete_snapshot = 8;
    StartJobRequest start_job = 9;
    JobStatusRequest job_status = 10;
    CancelJobRequest cancel_job = 11;
    ForgetJobRequest forget_job = 12;
    CommitJobRequest commit_job = 13;
    ListJobsRequest list_jobs = 14;
  }
}

// One answer, as the transport carries it: the verb's response, or why there is none.
message HelperResponse {
  oneof result {
    EnsureVolumeResponse ensure_volume = 1;
    DeleteVolumeResponse delete_volume = 2;
    VolumeUsageResponse volume_usage = 3;
    EnsureIdRangeResponse ensure_id_range = 4;
    DescribeStorageResponse describe_storage = 5;
    SnapshotVolumeResponse snapshot_volume = 6;
    RollbackVolumeResponse rollback_volume = 7;
    DeleteSnapshotResponse delete_snapshot = 8;
    StartJobResponse start_job = 9;
    JobStatusResponse job_status = 10;
    CancelJobResponse cancel_job = 11;
    ForgetJobResponse forget_job = 12;
    CommitJobResponse commit_job = 13;
    ListJobsResponse list_jobs = 14;
    HelperError error = 15;
  }
}

message HelperError {
  HelperErrorCode code = 1;
  string message = 2;
}

enum HelperErrorCode {
  HELPER_ERROR_CODE_UNSPECIFIED = 0;
  // The request is malformed or names something it may not: refused, and logged as such.
  HELPER_ERROR_CODE_REFUSED = 1;
  // The volume or class does not exist.
  HELPER_ERROR_CODE_NOT_FOUND = 2;
  // The verb is not one this helper knows: a newer supervisor talking to an older helper.
  HELPER_ERROR_CODE_UNSUPPORTED = 3;
  // The kernel or the filesystem refused.
  HELPER_ERROR_CODE_FAILED = 4;
}

message EnsureVolumeRequest {
  string volume = 1;
  string workload = 2;
  string storage_class = 3;
  uint64 size_bytes = 4;
  uint64 inodes = 5;
  // Unused, and kept only so the field number is never reused. Files carry workload-relative
  // ids (§4.5 of docs/04-runtimes.md), so the volume root is owned by id 0 as the workload sees
  // it, whatever range the workload holds on this node.
  uint32 uid_base = 6 [deprecated = true];
}

message EnsureVolumeResponse {
  // The host path of the volume root, for the driver's mount list.
  string host_path = 1;
  bool created = 2;
  // Whether the size and inode limits asked for are enforced in the write path. False on a
  // class that cannot (§2 of docs/06-storage.md), where they are kept nowhere and shown nowhere.
  bool quota_enforced = 3;
  // The class it is in: the one asked for, or the helper's default when none was.
  string storage_class = 4;
}

message SnapshotVolumeRequest {
  string volume = 1;
  // The snapshot's identifier, unique within the volume.
  string snapshot = 2;
}

message SnapshotVolumeResponse {
  bool created = 1;
}

message RollbackVolumeRequest {
  string volume = 1;
  string snapshot = 2;
}

message RollbackVolumeResponse {}

message DeleteSnapshotRequest {
  string volume = 1;
  string snapshot = 2;
}

message DeleteSnapshotResponse {
  bool deleted = 1;
}

message DeleteVolumeRequest {
  string volume = 1;
}

message DeleteVolumeResponse {
  bool deleted = 1;
}

message VolumeUsageRequest {
  string volume = 1;
}

message VolumeUsageResponse {
  uint64 used_bytes = 1;
  uint64 used_inodes = 2;
  uint64 limit_bytes = 3;
  uint64 limit_inodes = 4;
  // Whether the filesystem accounts the volume at all. A class without quota accounting answers
  // false and zeros: usage is read, never computed by walking the tree (§3 of
  // docs/06-storage.md).
  bool accounted = 5;
}

message EnsureIdRangeRequest {
  string workload = 1;
  uint32 uid_base = 2;
  uint32 uid_count = 3;
}

message EnsureIdRangeResponse {}

message DescribeStorageRequest {}

message DescribeStorageResponse {
  repeated korpis.v1.StorageClassInfo classes = 1;
}

// Starts a backup or restore job (§5.5 of docs/06-storage.md), or an install job (§4 of
// docs/09-recipes.md), as a process of its own, in a cgroup of its own, holding only the
// capabilities its work needs and confined by Landlock to what it works in. The helper names
// every directory from the identifiers below; a backup or restore job receives the data key and
// the store's access on its standard input. Idempotent by job: a job already started is not
// started again.
message StartJobRequest {
  // The job's identifier: letters, digits, '-', '_', '.', at most 128.
  string job = 1;
  oneof work {
    BackupVolume backup = 2;
    RestoreVolume restore = 3;
    InstallWork install = 7;
  }
  bytes data_key = 4;
  korpis.v1.S3Access store = 5;
  uint32 concurrency = 6;
  // Access to the repository's recipe content, kept once per repository (§5.2 of
  // docs/06-storage.md): written by a backup, read by a restore. Absent where none was granted.
  korpis.v1.S3Access content_store = 8;
}

message BackupVolume {
  string volume = 1;
  // The snapshot to read, taken for the job; empty to read the live volume, which is then
  // recorded as possibly inconsistent.
  string snapshot = 2;
  string backup = 3;
  string parent = 4;
  repeated korpis.backup.v1.RecipeContent content = 5;
  // Snapshot the volume for the job, in a class that can, and read that: a single point in
  // time. ForgetJob releases the snapshot. Ignored when `snapshot` names one already taken.
  bool take_snapshot = 6;
}

message RestoreVolume {
  // The volume restored into. For a whole volume it must be empty.
  string volume = 1;
  string backup = 2;
  // One path in the backup; empty for the whole volume.
  string path = 3;
  // For one path: a directory created at the volume's root to restore it into, which must not
  // exist; empty for the whole volume.
  string into = 4;
  // Restore the whole backup into a staging place beside the volume, which CommitJob makes the
  // volume and ForgetJob otherwise discards; `path` and `into` are then empty. The volume is not
  // touched until the commit, so the workload may run while the job does.
  bool replace = 5;
}

// A recipe's install actions, run beneath a workload's volumes by a worker that sees nothing else
// (§4 of docs/09-recipes.md).
message InstallWork {
  // As korpis.install.v1.InstallSpec carries them.
  repeated korpis.v1.Value actions = 1;
  uint32 from = 2;
  // Each volume by the absolute path the workload sees it at: no '.' or '..' component, none
  // beneath /.korpis, and no two the same.
  repeated korpis.install.v1.InstallVolume volumes = 3;
  map<string, string> files = 4;
  // The workload installed into, and the base of the id range it holds, which the worker runs
  // as: the helper refuses a range its ledger does not record for that workload.
  string workload = 5;
  uint32 id_base = 6;
}

message StartJobResponse {
  bool started = 1;
}

message JobStatusRequest {
  string job = 1;
}

message JobStatusResponse {
  JobState state = 1;
  // Once a backup or restore job finished.
  korpis.backup.v1.JobResult result = 2;
  // Once an install job finished.
  korpis.install.v1.InstallResult install = 3;
  // For an install job however it stands: how many of its actions have run, counting from the
  // start of the install, as it last recorded. A job lost part way resumes here.
  uint32 progress = 4;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_RUNNING = 1;
  JOB_STATE_FINISHED = 2;
  // It ended without writing a result: killed, or the node went down under it.
  JOB_STATE_LOST = 3;
  // No job of that identifier is known.
  JOB_STATE_UNKNOWN = 4;
}

// Ends a running job. What it wrote stays: a backup's objects are reused by the next, and a
// restore's directory is the caller's to remove.
message CancelJobRequest {
  string job = 1;
}

message CancelJobResponse {
  bool cancelled = 1;
}

// Removes what the helper keeps of a job that ended: its result and its cgroup, the snapshot it
// took, and the staging place of a replacing restore never committed. Refused while it runs.
message ForgetJobRequest {
  string job = 1;
}

message ForgetJobResponse {}

// Makes a replacing restore that finished whole and verified the volume: the staging place and
// the volume are exchanged in one rename, the old data removed, and the volume's limit kept.
// Doing it again after it was done changes nothing.
message CommitJobRequest {
  string job = 1;
}

message CommitJobResponse {}

// The jobs the helper keeps, for whoever forgets the ones nothing names any more.
message ListJobsRequest {}

message ListJobsResponse {
  repeated JobSummary jobs = 1;
}

message JobSummary {
  string job = 1;
  JobState state = 2;
}
