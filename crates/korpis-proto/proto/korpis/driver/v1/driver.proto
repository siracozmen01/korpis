// SPDX-License-Identifier: Apache-2.0
//
// The runtime driver interface (§4 of docs/04-runtimes.md). A driver is a separate process
// serving this over a local socket to the agent supervisor. It validates every spec it receives
// against its tier's invariants (§6.1 of docs/02-architecture.md): a spec the supervisor could
// not have produced from an honest assignment is refused and reported as a security event.

syntax = "proto3";

package korpis.driver.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "korpis/v1/placement.proto";
import "korpis/v1/workload.proto";
import "korpis/v1/workload_spec.proto";

service DriverService {
  // Declared capabilities. Asked, never inferred.
  rpc Describe(DescribeRequest) returns (DescribeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Pure: validates and resolves; no side effects, ever.
  rpc Prepare(PrepareRequest) returns (PrepareResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Allocate, mount, attach; nothing executes yet. Idempotent by workload and intent.
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Start(StartRequest) returns (StartResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc Kill(KillRequest) returns (KillResponse);
  // Release every resource the runtime object holds.
  rpc Destroy(DestroyRequest) returns (DestroyResponse);
  // Enumerate every runtime object this driver created, with its labels, for adoption.
  rpc Recover(RecoverRequest) returns (RecoverResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc Inspect(InspectRequest) returns (InspectResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc Stats(StatsRequest) returns (StatsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Server-streaming lifecycle events (exits, OOM kills) for every object this driver holds.
  rpc Events(EventsRequest) returns (stream EventsResponse);
  rpc Signal(SignalRequest) returns (SignalResponse);
  // Input to an interactive console (§6 of docs/14-streams.md): recorded in the stream with who
  // sent it, then handed to the workload. Capability-gated: a console mode that takes input.
  rpc ConsoleInput(ConsoleInputRequest) returns (ConsoleInputResponse);
  // The terminal of an interactive console was resized; recorded as a control record.
  rpc ResizeConsole(ResizeConsoleRequest) returns (ResizeConsoleResponse);
  // Runs a command inside a running object, in its namespaces and its cgroup, as its own user
  // (§4.2 of docs/04-runtimes.md): what an `exec` probe runs. Capability-gated: a driver that
  // declares `exec`. Its output is sent as it is written, at most `output_limit` bytes of it, and
  // the last message is how the command ended.
  rpc Exec(ExecRequest) returns (stream ExecResponse);
  // Whether the agent inside a guest answers, within `timeout`: what a `guest_agent` probe asks
  // (§5 of docs/04-runtimes.md). Capability-gated: a driver that declares `guest_agent`. An
  // object that does not run is an error, not a guest that did not answer.
  rpc PingGuest(PingGuestRequest) returns (PingGuestResponse);
}

message DescribeRequest {}

message DescribeResponse {
  korpis.v1.DriverInfo info = 1;
}

message PrepareRequest {
  string workload = 1;
  korpis.v1.Intent intent = 2;
  bytes recipe_manifest = 3;
}

message PrepareResponse {
  oneof result {
    PreparedSpec prepared = 1;
    Rejection rejection = 2;
  }
}

// A resolved, driver-validated description of what Create will build.
message PreparedSpec {
  string workload = 1;
  string intent = 2;
  // The image or rootfs, by digest.
  string rootfs = 3;
  repeated string command = 4;
  repeated string args = 5;
  map<string, string> env = 6;
  string working_dir = 7;
  korpis.v1.ResourceSpec resources = 8;
  repeated Mount mounts = 9;
  korpis.v1.IsolationTier tier = 10;
  // Every runtime object is labelled so that adoption can match it (§4.4 of
  // docs/02-architecture.md).
  RuntimeLabels labels = 11;
  // The uid range allocated to the workload (§4.5 of docs/04-runtimes.md).
  uint32 uid_base = 12;
  uint32 uid_count = 13;
  repeated PortMapping ports = 14;
  // The directory holding the workload's identity socket, which the agent made for it alone:
  // mounted read-only at /run/korpis inside the workload (§9.5 of docs/08-identity.md). Empty
  // when the node gives the workload no identity.
  string identity_dir = 15;
  // Where the workload's console stream is written, and how; absent when its console mode is
  // none (§4 of docs/14-streams.md).
  StreamCapture stream = 16;
  // The directory holding the namespaces the agent had the helper make for the workload, which
  // the runtime joins rather than making its own (§4.1 of docs/07-networking.md): `net`, its
  // network, and `user`, the user namespace that owns it, mapped to the uid range above. Empty
  // for a workload with no network beyond loopback, as on a node that offers none.
  string namespaces = 17;
  // The driver that prepared it, by the name it describes itself with: a node with several
  // drivers hands the spec's Create to that one (§3 of docs/04-runtimes.md).
  string driver = 18;
  // The workload's addresses on its network, each as address/prefix, for a driver whose
  // workload holds its own interface: a microVM's guest sets them on its `eth0`, routed through
  // the gateways every workload has (§4.1 of docs/07-networking.md). Empty without `namespaces`.
  repeated string addresses = 19;
}

// The console stream of a workload: its limits and the secret values it redacts, from Prepare;
// its directory, from the agent before Create. The driver hands all of it to the stream writer
// the task's stdio names.
message StreamCapture {
  // A host path prepared by the privileged helper, under quota; the driver never chooses one.
  string dir = 1;
  uint64 rate_bytes_per_sec = 2;
  uint64 burst_bytes = 3;
  // One of the two is set.
  uint64 retention_bytes = 4;
  uint64 retention_seconds = 5;
  repeated StreamSecret secrets = 6;
  // The console takes input: the task runs with a terminal, and its stdin is the writer's to
  // hold and to feed (§6 of docs/14-streams.md).
  bool input = 7;
}

message StreamSecret {
  // The configuration field.
  string name = 1;
  // Its value, as the software reads it.
  string value = 2;
}

message Mount {
  // A host path prepared by the privileged helper; the driver never chooses one.
  string source = 1;
  string destination = 2;
  bool read_only = 3;
  string volume = 4;
}

message PortMapping {
  uint32 container_port = 1;
  uint32 host_port = 2;
  korpis.v1.EndpointProtocol protocol = 3;
  string host_ip = 4;
}

message RuntimeLabels {
  string workload = 1;
  string intent = 2;
  uint64 assignment_generation = 3;
  uint64 power_cycle = 4;
  uint64 lease_epoch = 5;
  // The run this object executes, for a task or scheduled workload, each run its own object
  // (§4.2 of docs/05-scheduling.md); empty for a persistent workload's one object.
  string run = 6;
}

message Rejection {
  korpis.v1.UnsatisfiableReason reason = 1;
  string detail = 2;
}

message CreateRequest {
  PreparedSpec spec = 1;
}

message CreateResponse {
  string runtime_id = 1;
}

message StartRequest {
  string runtime_id = 1;
}

message StartResponse {}

message StopRequest {
  string runtime_id = 1;
  // A driver-defined signal name; empty means the driver's graceful default.
  string signal = 2;
  google.protobuf.Duration grace = 3;
}

message StopResponse {}

message KillRequest {
  string runtime_id = 1;
}

message KillResponse {}

message DestroyRequest {
  string runtime_id = 1;
}

message DestroyResponse {}

message RecoverRequest {}

message RecoverResponse {
  repeated RuntimeObject objects = 1;
}

message RuntimeObject {
  string runtime_id = 1;
  RuntimeLabels labels = 2;
  RuntimeStatus status = 3;
}

message InspectRequest {
  string runtime_id = 1;
}

message InspectResponse {
  RuntimeStatus status = 1;
}

message RuntimeStatus {
  RuntimeState state = 1;
  optional int32 exit_code = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  // e.g. "oom_killed".
  string reason = 5;
  uint32 pid = 6;
}

enum RuntimeState {
  RUNTIME_STATE_UNSPECIFIED = 0;
  RUNTIME_STATE_CREATED = 1;
  RUNTIME_STATE_RUNNING = 2;
  RUNTIME_STATE_STOPPED = 3;
  RUNTIME_STATE_PAUSED = 4;
  RUNTIME_STATE_UNKNOWN = 5;
}

message StatsRequest {
  string runtime_id = 1;
}

message StatsResponse {
  // What it uses now: a rate over the time since it was last asked, and memory in use.
  korpis.v1.ResourceUsage usage = 1;
  // Its counters since it was made, what metering sums (§2 of docs/15-observability.md).
  ObjectCounters counters = 2;
}

// A runtime object's cumulative counters, as its kernel keeps them. Each is absent where the
// driver cannot read it: a quantity not measured, never a zero.
message ObjectCounters {
  // CPU time, and the time it was throttled, in microseconds.
  optional uint64 cpu_usec = 1;
  optional uint64 cpu_throttled_usec = 2;
  // Bytes read from and written to block devices.
  optional uint64 io_read_bytes = 3;
  optional uint64 io_write_bytes = 4;
  // Memory in use now, and the most it has used.
  optional uint64 memory_bytes = 5;
  optional uint64 memory_peak_bytes = 6;
}

message EventsRequest {}

message EventsResponse {
  string runtime_id = 1;
  RuntimeStatus status = 2;
  google.protobuf.Timestamp at = 3;
}

message SignalRequest {
  string runtime_id = 1;
  string signal = 2;
}

message SignalResponse {}

message ConsoleInputRequest {
  string runtime_id = 1;
  // Who sent it: the session token's subject.
  string by = 2;
  // The data-path session it came on.
  string session = 3;
  bytes data = 4;
}

message ConsoleInputResponse {}

message ResizeConsoleRequest {
  string runtime_id = 1;
  string by = 2;
  string session = 3;
  uint32 cols = 4;
  uint32 rows = 5;
}

message ResizeConsoleResponse {}

message ExecRequest {
  string runtime_id = 1;
  // The command and its arguments; the first is resolved as the object's own process would
  // resolve it.
  repeated string command = 2;
  // How long it may run before it is killed, which its exit then says; at most ten minutes.
  google.protobuf.Duration timeout = 3;
  // The most of its output sent, stdout and stderr together; what it writes beyond is read
  // and dropped, so it never blocks on a full pipe. At most 64 KiB.
  uint32 output_limit = 4;
}

message ExecResponse {
  oneof event {
    // What it wrote, stdout and stderr interleaved as written.
    bytes output = 1;
    // How it ended; the last message.
    ExecExit exit = 2;
  }
}

message ExecExit {
  // Its exit status, as a shell reports it: 128 and the signal's number for one a signal ended.
  uint32 status = 1;
  // Killed for outliving its timeout.
  bool timed_out = 2;
  // Output beyond `output_limit` was dropped.
  bool truncated = 3;
}

message PingGuestRequest {
  string runtime_id = 1;
  // How long the agent is given; at most a minute.
  google.protobuf.Duration timeout = 2;
}

message PingGuestResponse {
  // It answered, in the driver's protocol.
  bool answered = 1;
  // Why it did not, for the node's log.
  string detail = 2;
}
