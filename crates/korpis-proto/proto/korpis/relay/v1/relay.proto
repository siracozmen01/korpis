// SPDX-License-Identifier: Apache-2.0
//
// What a relay running as its own process asks of the control plane (§3.1 of
// docs/02-architecture.md). It joins once with an enrollment token an operator created, and is
// given an identity and a certificate under the installation's authority, which agents and
// clients already trust.

syntax = "proto3";

package korpis.relay.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "korpis/agent/v1/agent.proto";

service RelayControlService {
  // Redeems an enrollment token. Asking again with the same token and identity key returns the
  // same relay with a fresh certificate; another key is refused.
  rpc Join(JoinRequest) returns (JoinResponse);
  // What a joined relay verifies by, for as long as it runs: the terms, the token keys, the
  // signed revocation list, and the nodes' identity keys, each sent whole when the relay
  // connects and again whenever it changes, and a heartbeat when nothing else was sent for a
  // while, so a relay can tell a quiet feed from a lost one. The stream ends when the relay is
  // removed.
  rpc Feed(FeedRequest) returns (stream FeedUpdate);
  // A fresh certificate for a new TLS key, issued as Join issued the first: for the relay's URL's
  // host, under the installation's authority, as long-lived as the relay's certificates are. A
  // relay asks at about two thirds of its certificate's life (§7 of docs/18-operations.md).
  rpc Renew(RenewRequest) returns (RenewResponse);
  // A file token for an SFTP client the relay serves (§9.9 of docs/08-identity.md): the relay has
  // checked that the client holds `key`, and the control plane believes it, mints for the
  // account the key is registered to what that account's grants allow on the workload from the
  // client's address, writing or else reading, and records the first under the relay's name.
  // Refused as unauthenticated for a key no account holds.
  rpc AuthorizeFiles(AuthorizeFilesRequest) returns (AuthorizeFilesResponse);
}

message AuthorizeFilesRequest {
  string relay = 1;
  // The relay identity key's Ed25519 signature over
  // "korpis.relay.v1.AuthorizeFiles|<relay>|<seconds>.<nanos, nine digits>|<nonce in lowercase hex>|<digest in lowercase hex>",
  // where the digest is SHA-256 over each of key, the workload's sixteen bytes, client, and
  // renews, each preceded by its length as eight big-endian bytes; fresh and never replayed.
  korpis.agent.v1.NodeAuth auth = 2;
  // The client's SSH public key, in SSH's wire form (RFC 4253 §6.6).
  bytes key = 3;
  // The workload the client named, `wkl_…`.
  string workload = 4;
  // The client's address, as the relay saw it or a PROXY header it believes named it.
  string client = 5;
  // The token this one renews, for a session already open; no use of a use-limited grant is
  // spent renewing.
  string renews = 6;
}

message AuthorizeFilesResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  // The route the relay opens the session by (§3.1 of docs/02-architecture.md).
  string route = 3;
  // `workload.file.write`, or `workload.file.read` where reading alone is allowed.
  string action = 4;
}

message RenewRequest {
  string relay = 1;
  // The relay identity key's Ed25519 signature over
  // "korpis.relay.v1.Renew|<relay>|<seconds>.<nanos, nine digits>|<nonce in lowercase hex>|<tls_key in lowercase hex>",
  // fresh and never replayed, as a FeedRequest's.
  korpis.agent.v1.NodeAuth auth = 2;
  // The new TLS key's public half: an uncompressed P-256 point, 65 bytes.
  bytes tls_key = 3;
}

message RenewResponse {
  // The relay's new certificate, PEM, followed by the authority's.
  string certificate_chain_pem = 1;
  google.protobuf.Timestamp certificate_expires_at = 2;
}

message FeedRequest {
  string relay = 1;
  // The relay identity key's Ed25519 signature over
  // "korpis.relay.v1.Feed|<relay>|<seconds>.<nanos, nine digits>|<nonce in lowercase hex>",
  // the timestamp within the control plane's auth skew window and the nonce never seen before
  // from this relay.
  korpis.agent.v1.NodeAuth auth = 2;
}

message FeedUpdate {
  oneof message {
    TokenKeys token_keys = 1;
    korpis.agent.v1.RevocationList revocation_list = 2;
    NodeKeys node_keys = 3;
    FeedTerms terms = 4;
    Heartbeat heartbeat = 5;
    PortalOrigins portal_origins = 6;
  }
}

// The origin of every portal (§3.6 of docs/07-networking.md), whose panels open console and file
// sessions here: sent when the feed opens and whenever they change, and answered beside the
// relay's own --web-origin for its sessions alone.
message PortalOrigins {
  repeated string origins = 1;
}

// What the relay judges a node's DataHello by, as the control plane judges a Hello.
message FeedTerms {
  // The window either side of the relay's clock a DataHello's timestamp must fall in.
  google.protobuf.Duration auth_skew = 1;
  // The longest the control plane goes without sending anything on the feed; a relay that
  // hears nothing for three of these takes the feed for lost and opens another.
  google.protobuf.Duration heartbeat_interval = 2;
}

message Heartbeat {
  // The control plane's clock when it sent this; informational.
  google.protobuf.Timestamp sent_at = 1;
}

// Every key that ever signed a capability token.
message TokenKeys {
  repeated korpis.agent.v1.SigningKey keys = 1;
  // The route key of each token key, by the same epoch: what the relay opens a session's route
  // with to learn its node (§3.1 of docs/02-architecture.md).
  repeated RouteKey route_keys = 2;
}

message RouteKey {
  uint32 key_id = 1;
  // 32 bytes.
  bytes key = 2;
}

// The identity key of every node not decommissioned, which a node's DataHello is verified with.
message NodeKeys {
  repeated NodeKey nodes = 1;
}

message NodeKey {
  string node = 1;
  // Ed25519, raw 32 bytes.
  bytes public_key = 2;
}

message JoinRequest {
  string enrollment_token = 1;
  // The relay identity key's public half: Ed25519, raw 32 bytes. The private half never leaves
  // the relay; it signs the relay's requests to the control plane.
  bytes identity_key = 2;
  // The relay TLS key's public half: an uncompressed P-256 point, 65 bytes.
  bytes tls_key = 3;
}

message JoinResponse {
  string relay = 1;
  string name = 2;
  string url = 3;
  // The relay's certificate, PEM, followed by the authority's.
  string certificate_chain_pem = 4;
  google.protobuf.Timestamp certificate_expires_at = 5;
  // The installation's authority, PEM: what the relay trusts the control plane by.
  string authority_pem = 6;
  // Every key that ever signed a capability token.
  repeated korpis.agent.v1.SigningKey token_keys = 7;
}
