//
// Runs, the executions of a task or scheduled workload (§4 of docs/05-scheduling.md). The control
// plane makes every run; one is requested by restarting the workload (WorkloadService.Restart),
// since a higher power cycle is what requests one, and no call here makes one. A run needs no
// action of its own (§5 of docs/10-api.md): it is read under workload.read on its workload and
// cancelled under workload.stop.

syntax = "proto3";

package korpis.v1;

import "korpis/v1/api.proto";
import "korpis/v1/workload.proto";

service RunService {
  rpc GetRun(GetRunRequest) returns (GetRunResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // A workload's runs, newest first.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Cancels an active run, cause `cancelled`; its node stops it when its assignment no longer
  // names it. A run that has ended is refused CONFLICT `run.ended`.
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
}

message GetRunRequest {
  string id = 1;
}

message GetRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  string workload = 1;
  PageRequest page = 2;
}

message ListRunsResponse {
  repeated Run runs = 1;
  PageResponse page = 2;
}

message CancelRunRequest {
  Mutation mutation = 1;
  string run = 2;
}

message CancelRunResponse {
  Run run = 1;
}
