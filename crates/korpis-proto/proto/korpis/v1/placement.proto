//
// Nodes, driver capabilities, placement, and explanations (§3.4 of docs/01-model.md, §4.1 of
// docs/04-runtimes.md, §2 of docs/05-scheduling.md).

syntax = "proto3";

package korpis.v1;

import "google/protobuf/timestamp.proto";
import "korpis/v1/common.proto";
import "korpis/v1/workload_spec.proto";

message Node {
  string id = 1;
  string name = 2;
  // region, rack, arch, os, gpu, storage-class, ...: there is no Location object.
  map<string, string> labels = 3;
  repeated Taint taints = 4;
  Resources capacity = 5;
  // Capacity minus system reserve.
  Resources allocatable = 6;
  // Sum of placed reservations.
  Resources allocated = 7;
  repeated DriverInfo drivers = 8;
  NodeStatus status = 9;
  string agent_version = 10;
  google.protobuf.Timestamp last_seen = 11;
  repeated StorageClassInfo storage_classes = 12;
  // Whether the node can be reached for inbound traffic (§9 of docs/07-networking.md).
  Reachability reachability = 13;
  // The organization it was enrolled into. It serves that organization and every organization
  // below it, and a grant over the organization covers it.
  string organization = 14;
  // What the operator decided. `status` is derived from this and `connectivity`, a
  // connectivity problem outranking the decision (§3.4 of docs/01-model.md).
  NodeAdmin admin = 15;
  NodeConnectivity connectivity = 16;
  // Whether the node is in the WireGuard mesh other nodes reach it through, as measured (§9 of
  // docs/07-networking.md). A workload with a dependency or dependent on another node is placed
  // only where it is available.
  Overlay overlay = 17;
  // The addresses the node advertises for inbound traffic, and the inclusive range its endpoints'
  // ports are allocated from (§9 of docs/07-networking.md).
  repeated string addresses = 18;
  uint32 first_port = 19;
  uint32 last_port = 20;
  // When its reachability was last measured; absent if never since its addresses last changed.
  google.protobuf.Timestamp probed_at = 21;
  // Whether it serves the ingress, holding ports 80 and 443 of its addresses (§3.2 of
  // docs/07-networking.md); a workload with an ingress endpoint is placed only where it does.
  bool ingress = 22;
  // The devices its agent found described, and those it does not offer (§6.1 of
  // docs/05-scheduling.md). Added 2026-10-25.
  repeated Device devices = 23;
  repeated UnofferedDevice unoffered_devices = 24;
}

message Taint {
  string key = 1;
  string value = 2;
}

enum NodeAdmin {
  NODE_ADMIN_UNSPECIFIED = 0;
  NODE_ADMIN_ACTIVE = 1;
  NODE_ADMIN_CORDONED = 2;
  NODE_ADMIN_DRAINING = 3;
  NODE_ADMIN_DECOMMISSIONED = 4;
}

enum NodeConnectivity {
  NODE_CONNECTIVITY_UNSPECIFIED = 0;
  NODE_CONNECTIVITY_REGISTERING = 1;
  NODE_CONNECTIVITY_CONNECTED = 2;
  NODE_CONNECTIVITY_UNREACHABLE = 3;
  NODE_CONNECTIVITY_UNKNOWN = 4;
}

// Derived from `NodeAdmin` and `NodeConnectivity`; never stored.
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_REGISTERING = 1;
  NODE_STATUS_READY = 2;
  NODE_STATUS_CORDONED = 3;
  NODE_STATUS_DRAINING = 4;
  NODE_STATUS_UNREACHABLE = 5;
  NODE_STATUS_UNKNOWN = 6;
  NODE_STATUS_DECOMMISSIONED = 7;
}

enum Overlay {
  OVERLAY_UNSPECIFIED = 0;
  OVERLAY_AVAILABLE = 1;
  // Not in the mesh: no overlay is built yet, or its peers cannot reach it.
  OVERLAY_UNAVAILABLE = 2;
}

enum Reachability {
  REACHABILITY_UNSPECIFIED = 0;
  // A public address on the node itself.
  REACHABILITY_PUBLIC = 1;
  // Behind NAT; inbound only through an edge.
  REACHABILITY_EDGE_ONLY = 2;
}

message DriverInfo {
  // e.g. "oci".
  string name = 1;
  string version = 2;
  // The driver protocol version it speaks.
  string protocol = 3;
  Capabilities capabilities = 4;
  bool healthy = 5;
}

// Declared, never inferred (§4.1 of docs/04-runtimes.md).
message Capabilities {
  repeated IsolationTier tiers = 1;
  repeated ConsoleMode console = 2;
  bool exec = 3;
  repeated string signals = 4;
  repeated string hot_resize = 5;
  bool hot_volume_attach = 6;
  // Absent if execution-state snapshots are not supported.
  SnapshotCaps runtime_snapshot = 7;
  bool live_migrate = 8;
  // The modes it gives devices of the classes in `devices` in; none gives none (§6.2 of
  // docs/05-scheduling.md). Was `gpu`, for GPUs alone: corrected 2026-10-25.
  repeated DeviceMode device_modes = 9;
  repeated DeviceClass devices = 10;
  repeated RootfsSource rootfs_sources = 11;
  repeated NetworkMode network_modes = 12;
  // Keyed by resource kind: "memory", "cpu", "disk", "io", "pids", "egress".
  map<string, EnforcementDecl> enforcement = 13;
  VolumeSemantics volume_semantics = 14;
  FileAccess file_access = 15;
  IdMapCaps id_mapping = 16;
  // A JSON Schema document, driver-specific configuration.
  string config_schema = 17;
  // Per tier, the plan step actions it makes disruptive there: the driver's layer of the
  // classification chain (§3.3 of docs/01-model.md), which may only add to the vocabulary's floor.
  repeated TierDisruption disruption = 18;
  // Whether it gives each workload the directory its node serves it, at /run/korpis: the
  // identity socket, the API relay, and the managed and dependency files (§6 of
  // docs/02-architecture.md). A heartbeat probe needs it (§5 of docs/04-runtimes.md).
  bool identity_dir = 19;
  // Whether it can ask a guest's own agent whether it answers, which a `guest_agent` probe
  // needs (§5 of docs/04-runtimes.md).
  bool guest_agent = 20;
  // For a driver whose volumes are block devices: the filesystems its guests mount a volume as,
  // which are those a block device's backup can be browsed and restored by path from, in a
  // service guest (§4.4 of docs/04-runtimes.md, §5.4 of docs/06-storage.md). Any other offers
  // whole-image restore only.
  repeated string guest_filesystems = 21;
}

// What a driver makes disruptive on one tier: `stop` on a `vm` costs a boot.
message TierDisruption {
  IsolationTier tier = 1;
  // Step action names, as in Step.action.
  repeated string actions = 2;
}

message SnapshotCaps {
  string cpu_template = 1;
  string hypervisor_version = 2;
  string kernel_min = 3;
  string kernel_max = 4;
}


// A device of a node, as the Container Device Interface's files on it describe it (§6.1 of
// docs/05-scheduling.md).
message Device {
  // Its CDI name, vendor.com/kind=name; unique on its node.
  string id = 1;
  DeviceClass class = 2;
  // The CDI file's and the device's annotations, which a request's selector matches.
  map<string, string> attributes = 3;
  // The host device nodes its own edits give: a device whose nodes contain another's is the same
  // hardware.
  repeated string host_nodes = 4;
  // How many workloads may hold it at once in timeslice; 0 offers passthrough alone.
  uint32 shares = 5;
}

// A device a node's files describe and the node does not offer, and why: a kind of no class, an
// aggregate of smaller devices, no node of its own, or a file not root's alone.
message UnofferedDevice {
  string id = 1;
  string reason = 2;
}

// A device a placement holds, and how.
message DeviceHold {
  // Device.id, on the placement's node.
  string device = 1;
  DeviceMode mode = 2;
}


enum RootfsSource {
  ROOTFS_SOURCE_UNSPECIFIED = 0;
  ROOTFS_SOURCE_OCI_IMAGE = 1;
  ROOTFS_SOURCE_DIRECTORY = 2;
  ROOTFS_SOURCE_DISK_IMAGE = 3;
  ROOTFS_SOURCE_ISO = 4;
}

enum NetworkMode {
  NETWORK_MODE_UNSPECIFIED = 0;
  NETWORK_MODE_VETH = 1;
  NETWORK_MODE_TAP = 2;
  NETWORK_MODE_HOST = 3;
  NETWORK_MODE_NONE = 4;
}

message EnforcementDecl {
  bool enforced = 1;
  // e.g. "cgroup v2 memory.max".
  string mechanism = 2;
  string granularity = 3;
}

enum VolumeSemantics {
  VOLUME_SEMANTICS_UNSPECIFIED = 0;
  VOLUME_SEMANTICS_FILESYSTEM = 1;
  VOLUME_SEMANTICS_BLOCK_DEVICE = 2;
}

enum FileAccess {
  FILE_ACCESS_UNSPECIFIED = 0;
  FILE_ACCESS_HOST_WORKER = 1;
  FILE_ACCESS_GUEST_WORKER = 2;
  FILE_ACCESS_NONE = 3;
}

// How workload uids reach the disk (§4.5 of docs/04-runtimes.md).
message IdMapCaps {
  bool idmapped_mounts = 1;
  bool user_namespaces = 2;
}

// A storage class as offered on a node (§2 of docs/06-storage.md).
message StorageClassInfo {
  string name = 1;
  StorageBackend backend = 2;
  StorageCapabilities capabilities = 3;
  uint64 capacity_bytes = 4;
  uint64 free_bytes = 5;
}

enum StorageBackend {
  STORAGE_BACKEND_UNSPECIFIED = 0;
  STORAGE_BACKEND_ZFS = 1;
  STORAGE_BACKEND_BTRFS = 2;
  STORAGE_BACKEND_LVM_THIN = 3;
  STORAGE_BACKEND_XFS_PROJECT = 4;
  STORAGE_BACKEND_EXT4_PROJECT = 5;
  STORAGE_BACKEND_NETWORK = 6;
  // A directory on a filesystem with no project quota: nothing is enforced, and every capability
  // says so (§2 of docs/06-storage.md).
  STORAGE_BACKEND_DIRECTORY = 7;
}

message StorageCapabilities {
  bool snapshot = 1;
  bool snapshot_atomic = 2;
  bool incremental_send = 3;
  // The kernel fails the write, not a monitor.
  bool quota_enforced = 4;
  bool quota_capacity = 5;
  bool quota_inodes = 6;
  bool thin_provision = 7;
  bool online_grow = 8;
  bool online_shrink = 9;
  bool reflink_copy = 10;
  bool compression = 11;
  bool encryption_at_rest = 12;
  bool shared_access = 13;
  bool multi_node_attach = 14;
  Fencing fencing = 15;
}

enum Fencing {
  FENCING_UNSPECIFIED = 0;
  FENCING_NONE = 1;
  FENCING_LEASE_ONLY = 2;
  FENCING_STORAGE_ENFORCED = 3;
}

// The binding of a workload to a node, and why, as the caller may see it (§8 of
// docs/08-identity.md).
message Placement {
  string workload = 1;
  // Empty when the caller may not read the node.
  string node = 2;
  google.protobuf.Timestamp bound_at = 3;
  BoundBy bound_by = 4;
  string reason = 5;
  Explanation explanation = 6;
  // During migration two placements coexist; exactly one is authoritative.
  bool authoritative = 7;
  // The node's `region` label, which every reader of the workload sees.
  string region = 8;
  IsolationTier tier = 9;
  // The approved intent the placement was bound for.
  string intent = 10;
  // What it holds on the node: that intent's reservations (§5.2 of docs/05-scheduling.md). A
  // node's allocated is the sum of these over its placements, authoritative or not.
  Resources reserved = 11;
  // When a restore held it: its node presented its assignments without it, so nothing is sent
  // for it until an operator confirms it or it is retired (§8 of docs/03-state.md).
  google.protobuf.Timestamp held_at = 12;
  // The node's devices it holds, chosen when it was bound (§6.3 of docs/05-scheduling.md).
  repeated DeviceHold devices = 13;
}

// Why no node took a workload's approved target, from the newest attempt.
message Unplaced {
  string intent = 1;
  // Since when this has been the reason: a retry that reaches the same explanation changes
  // nothing.
  google.protobuf.Timestamp since = 2;
  Explanation explanation = 3;
}

enum BoundBy {
  BOUND_BY_UNSPECIFIED = 0;
  BOUND_BY_SCHEDULER = 1;
  BOUND_BY_OPERATOR = 2;
  BOUND_BY_MIGRATION = 3;
  // A restore, to the node that presented the workload's assignment (§8 of docs/03-state.md).
  BOUND_BY_RECOVERY = 4;
}

// Every rejection with its reason, every score with its weight (§2.3 of
// docs/05-scheduling.md). Filtered per viewer (§8 of docs/08-identity.md): rejections, scores,
// and the chosen node only for nodes the caller may read; counts only for the tenant; the
// policy only for a caller who may read every node it names.
message Explanation {
  optional uint32 candidates = 1;
  repeated FilterResult filtered = 2;
  repeated ScoreResult scored = 3;
  string chosen = 4;
  optional string runner_up = 5;
  PlacementPolicy policy = 6;
  // Per failing check, how many nodes failed it.
  repeated CheckCount rejected = 7;
  // The policy each candidate's owner scored its nodes by: its strategy and weights (§2.2 of
  // docs/05-scheduling.md). `policy` is the workload's, its spread and affinity. Both are shown
  // only to a viewer who may read every node the explanation names.
  repeated OwnerPolicy owner_policies = 8;
}

// The policy one owner's nodes were scored by.
message OwnerPolicy {
  // The organization the nodes were enrolled into, as `org_…`.
  string organization = 1;
  PlacementPolicy policy = 2;
}

message CheckCount {
  string check = 1;
  optional uint32 nodes = 2;
}

message FilterResult {
  string node = 1;
  string check = 2;
  string detail = 3;
}

message ScoreResult {
  string node = 1;
  string signal = 2;
  double value = 3;
  double weight = 4;
}

message PlacementPolicy {
  PlacementStrategy strategy = 1;
  repeated SpreadConstraint spread = 2;
  repeated AffinityRule affinity = 3;
  map<string, double> weights = 4;
}

enum PlacementStrategy {
  PLACEMENT_STRATEGY_UNSPECIFIED = 0;
  PLACEMENT_STRATEGY_PACKED = 1;
  PLACEMENT_STRATEGY_DISTRIBUTED = 2;
  PLACEMENT_STRATEGY_BALANCED = 3;
}

message SpreadConstraint {
  string topology_key = 1;
  uint32 max_skew = 2;
  // With SPREAD_SCOPE_SELECTOR: the workloads of the placed workload's organization it matches.
  LabelSelector selector = 3;
  SpreadScope scope = 4;
}

// Which workloads a spread constraint counts, always within the placed workload's own
// organization (§2.2 of docs/05-scheduling.md).
enum SpreadScope {
  SPREAD_SCOPE_UNSPECIFIED = 0;
  SPREAD_SCOPE_PROJECT = 1;
  SPREAD_SCOPE_ORGANIZATION = 2;
  SPREAD_SCOPE_SELECTOR = 3;
}
