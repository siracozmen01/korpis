//
// Operations: one approval over many items, each item's plan generated as the operation proceeds.

syntax = "proto3";

package korpis.v1;

import "google/protobuf/timestamp.proto";
import "korpis/v1/api.proto";
import "korpis/v1/common.proto";
import "korpis/v1/tenancy.proto";

// Proposed and decided under the action that governs the operation's kind: node.drain or
// node.evacuate on its node, grant.read on its template's organization for a rollout. Read under
// node.read on its node, or grant.read on its template's organization.
service OperationService {
  // Finds and keeps every item the operation will touch; nothing changes until it is approved. A
  // node is under one operation that has not ended at a time.
  rpc ProposeOperation(ProposeOperationRequest) returns (ProposeOperationResponse);
  // By a person acting directly, outside a portal: the control plane begins each item later as
  // them, under their grant, read again as the item begins. A drain or an evacuation puts its node
  // out of placement here.
  rpc ApproveOperation(ApproveOperationRequest) returns (ApproveOperationResponse);
  // Begins nothing more until resumed; what applies goes on.
  rpc PauseOperation(PauseOperationRequest) returns (PauseOperationResponse);
  rpc ResumeOperation(ResumeOperationRequest) returns (ResumeOperationResponse);
  // Ends it: what applies goes on, the rest is skipped, and its node is left cordoned.
  rpc AbortOperation(AbortOperationRequest) returns (AbortOperationResponse);
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Newest first.
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  // Moves every workload off a node that takes part, each by a migration.
  OPERATION_KIND_DRAIN = 1;
  // Places every workload of an unreachable node again elsewhere, each volume from where another
  // node reaches it, its freshest replica, its latest backup, or empty, as its item says.
  OPERATION_KIND_EVACUATE = 2;
  // Gives every live grant issued from a template at an earlier version what the version adds.
  OPERATION_KIND_TEMPLATE_ROLLOUT = 3;
}

enum OperationStatus {
  OPERATION_STATUS_UNSPECIFIED = 0;
  OPERATION_STATUS_PROPOSED = 1;
  // Approved, waiting for the time it was approved to start at.
  OPERATION_STATUS_APPROVED = 2;
  OPERATION_STATUS_RUNNING = 3;
  OPERATION_STATUS_PAUSED = 4;
  OPERATION_STATUS_COMPLETED = 5;
  OPERATION_STATUS_FAILED = 6;
  OPERATION_STATUS_ABORTED = 7;
}

enum OnFailure {
  ON_FAILURE_UNSPECIFIED = 0;
  // The default: begins nothing more until a person resumes it.
  ON_FAILURE_PAUSE = 1;
  ON_FAILURE_CONTINUE = 2;
  // Fails the operation.
  ON_FAILURE_ABORT = 3;
}

enum OperationItemState {
  OPERATION_ITEM_STATE_UNSPECIFIED = 0;
  OPERATION_ITEM_STATE_WAITING = 1;
  // Its plan applies.
  OPERATION_ITEM_STATE_APPLYING = 2;
  // Its workload moved, and is not yet reported running, or stopped as its power says, where it
  // now is. Counted unavailable.
  OPERATION_ITEM_STATE_SETTLING = 3;
  OPERATION_ITEM_STATE_DONE = 4;
  OPERATION_ITEM_STATE_FAILED = 5;
  // Deleted, or moved off the node, meanwhile.
  OPERATION_ITEM_STATE_SKIPPED = 6;
}

message OperationPolicy {
  // The most items applying at once, from 1 to 64; 0 for 1.
  uint32 concurrency = 1;
  // The most items applying or settling at once, at least 1; 0 for 1.
  uint32 max_unavailable = 2;
  OnFailure on_failure = 3;
}

message OperationProgress {
  uint32 total = 1;
  uint32 waiting = 2;
  uint32 applying = 3;
  uint32 settling = 4;
  uint32 done = 5;
  uint32 failed = 6;
  uint32 skipped = 7;
}

message OperationItem {
  // A workload for a drain or an evacuation, a grant for a rollout.
  string subject = 1;
  OperationItemState state = 2;
  // The plan generated for a workload.
  optional string plan = 3;
  // The grant issued for a grant.
  optional string issued = 4;
  // What it was found to need: a workload's name; per volume where its data comes from and since
  // when what was written is lost, and whether it may still be running on the node; a grant's
  // holder and the actions it is given.
  map<string, Value> detail = 5;
  // Why it failed or was skipped.
  string reason = 6;
  google.protobuf.Timestamp begun_at = 7;
  google.protobuf.Timestamp ended_at = 8;
}

message Operation {
  string id = 1;
  OperationKind kind = 2;
  // For a drain or an evacuation.
  optional string node = 3;
  // For a rollout: the template and the version whose additions it gives.
  optional string template = 4;
  uint64 template_version = 5;
  OperationPolicy policy = 6;
  OperationStatus status = 7;
  // Why it paused, failed, or was aborted.
  string reason = 8;
  Subject proposed_by = 9;
  google.protobuf.Timestamp proposed_at = 10;
  Subject approved_by = 11;
  google.protobuf.Timestamp approved_at = 12;
  // The grant every item is carried out under.
  string approved_under = 13;
  google.protobuf.Timestamp start_after = 14;
  google.protobuf.Timestamp ended_at = 15;
  OperationProgress progress = 16;
  // In the order they begin in; empty in a list.
  repeated OperationItem items = 17;
}

message ProposeOperationRequest {
  Mutation mutation = 1;
  OperationKind kind = 2;
  // For a drain or an evacuation.
  string node = 3;
  // For a rollout.
  string template = 4;
  uint64 template_version = 5;
  OperationPolicy policy = 6;
}

message ProposeOperationResponse {
  Operation operation = 1;
}

message ApproveOperationRequest {
  Mutation mutation = 1;
  string operation = 2;
  // Absent for at once.
  google.protobuf.Timestamp start_after = 3;
  // For a rollout: a grant the approver holds, which every grant it issues is attenuated from.
  string parent = 4;
}

message ApproveOperationResponse {
  Operation operation = 1;
}

message PauseOperationRequest {
  Mutation mutation = 1;
  string operation = 2;
}

message PauseOperationResponse {
  Operation operation = 1;
}

message ResumeOperationRequest {
  Mutation mutation = 1;
  string operation = 2;
}

message ResumeOperationResponse {
  Operation operation = 1;
}

message AbortOperationRequest {
  Mutation mutation = 1;
  string operation = 2;
  string reason = 3;
}

message AbortOperationResponse {
  Operation operation = 1;
}

message GetOperationRequest {
  string id = 1;
}

message GetOperationResponse {
  Operation operation = 1;
}

message ListOperationsRequest {
  PageRequest page = 1;
  // Only those over this node.
  string node = 2;
}

message ListOperationsResponse {
  repeated Operation operations = 1;
  PageResponse page = 2;
}
