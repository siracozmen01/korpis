// Types shared by every Korpis surface. Identifiers are opaque strings with a type prefix
// ("wl_", "org_", ...); they are immutable and never reused (§5 of docs/01-model.md).

syntax = "proto3";

package korpis.v1;

import "google/protobuf/duration.proto";

// A label selector. An empty selector matches everything.
message LabelSelector {
  // Every pair must be present with exactly this value.
  map<string, string> match_labels = 1;
  // Every expression must hold.
  repeated LabelExpression match_expressions = 2;
}

message LabelExpression {
  string key = 1;
  LabelOperator operator = 2;
  repeated string values = 3;
}

enum LabelOperator {
  LABEL_OPERATOR_UNSPECIFIED = 0;
  LABEL_OPERATOR_IN = 1;
  LABEL_OPERATOR_NOT_IN = 2;
  LABEL_OPERATOR_EXISTS = 3;
  LABEL_OPERATOR_DOES_NOT_EXIST = 4;
}

// A reference to any object, by kind and identifier.
message ObjectRef {
  ObjectKind kind = 1;
  string id = 2;
}

enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED = 0;
  OBJECT_KIND_ORGANIZATION = 1;
  OBJECT_KIND_PROJECT = 2;
  OBJECT_KIND_WORKLOAD = 3;
  OBJECT_KIND_VOLUME = 4;
  OBJECT_KIND_ENDPOINT = 5;
  OBJECT_KIND_STREAM = 6;
  OBJECT_KIND_NODE = 7;
  OBJECT_KIND_GRANT = 8;
  OBJECT_KIND_PLAN = 9;
  OBJECT_KIND_OPERATION = 10;
  OBJECT_KIND_EXTENSION = 11;
  OBJECT_KIND_REPOSITORY = 12;
  OBJECT_KIND_BACKUP = 13;
  OBJECT_KIND_INTENT = 14;
  OBJECT_KIND_DOMAIN = 15;
  OBJECT_KIND_CERTIFICATE = 16;
  OBJECT_KIND_PORTAL = 17;
}

// A dynamically typed value, for recipe configuration and plan step detail. Typed by the schema
// that governs it (the recipe's config schema, a driver's config schema), never by convention.
message Value {
  oneof kind {
    bool bool_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    string string_value = 4;
    bytes bytes_value = 5;
    ValueList list_value = 6;
    ValueMap map_value = 7;
    // Present and explicitly null.
    NullValue null_value = 8;
  }
}

message ValueList {
  repeated Value values = 1;
}

message ValueMap {
  map<string, Value> fields = 1;
}

enum NullValue {
  NULL_VALUE_UNSPECIFIED = 0;
}

// A structured, machine-readable error (§8 of docs/10-api.md). Clients branch on `code` and
// `reason`, never on a message string.
message Error {
  ErrorCode code = 1;
  // Stable identifier, e.g. "quota.memory.exceeded".
  string reason = 2;
  // Field path, for validation errors.
  string field = 3;
  map<string, Value> detail = 4;
  bool retryable = 5;
  google.protobuf.Duration retry_after = 6;
  // Human-readable, for display only.
  string message = 7;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_DENIED = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_UNSATISFIABLE = 6;
  ERROR_CODE_QUOTA_EXCEEDED = 7;
  ERROR_CODE_OVERFLOW = 8;
  ERROR_CODE_UNAVAILABLE = 9;
  ERROR_CODE_INTERNAL = 10;
  // A rate limit bucket is empty (§10 of docs/10-api.md): retryable, after retry_after.
  ERROR_CODE_RATE_LIMITED = 11;
}

// Resource quantities, used for capacity, allocation, quota, and usage.
message Resources {
  // Millicores.
  uint64 cpu_millis = 1;
  uint64 memory_bytes = 2;
  uint64 disk_bytes = 3;
  uint64 disk_read_bytes_per_sec = 4;
  uint64 disk_write_bytes_per_sec = 5;
  uint64 disk_read_ops_per_sec = 6;
  uint64 disk_write_ops_per_sec = 7;
  // Per metering period.
  uint64 egress_bytes = 8;
  uint64 bandwidth_bits_per_sec = 9;
  uint64 workloads = 10;
  uint64 volumes = 11;
  uint64 endpoints = 12;
  uint64 dedicated_ipv4 = 13;
  uint64 pids = 14;
  // Ports of a node held by node_port and node_bound endpoints (§3 of docs/07-networking.md).
  uint64 node_ports = 15;
  // Devices held, one each, a timeslice share counting one (§6.4 of docs/05-scheduling.md).
  uint64 devices_gpu = 16;
  uint64 devices_usb = 17;
  uint64 devices_pci = 18;
  uint64 devices_tpm = 19;
  uint64 devices_serial = 20;
}

// The kinds of thing Korpis calls out to an extension for (§5 of docs/16-extensions.md). Here
// rather than beside the extension messages, so that a recipe reference can name one.
enum ProviderType {
  PROVIDER_TYPE_UNSPECIFIED = 0;
  PROVIDER_TYPE_DNS = 1;
  PROVIDER_TYPE_BACKUP_TARGET = 2;
  PROVIDER_TYPE_STEP = 3;
  PROVIDER_TYPE_HEALTH = 4;
  PROVIDER_TYPE_CONSOLE = 5;
  PROVIDER_TYPE_IDENTITY = 6;
  PROVIDER_TYPE_EDGE_ROUTER = 7;
  PROVIDER_TYPE_CHAT_ADAPTER = 8;
  // A key management service holding a repository's key-encryption key for its tenant (§5.5 of
  // docs/06-storage.md).
  PROVIDER_TYPE_KEY_MANAGEMENT = 9;
  // A router moving a cluster pool's addresses to the node holding each (§3.7 of
  // docs/07-networking.md). Added 2026-10-26.
  PROVIDER_TYPE_ADDRESS_ROUTER = 10;
}

// A class of device a driver can give a workload (§6 of docs/05-scheduling.md).
enum DeviceClass {
  DEVICE_CLASS_UNSPECIFIED = 0;
  DEVICE_CLASS_GPU = 1;
  DEVICE_CLASS_USB = 2;
  DEVICE_CLASS_PCI = 3;
  DEVICE_CLASS_TPM = 4;
  DEVICE_CLASS_SERIAL = 5;
}

// How a workload holds a device (§6.2 of docs/05-scheduling.md). Was `GpuMode`, whose `NONE` an
// empty list now says.
enum DeviceMode {
  reserved 1;
  reserved "GPU_MODE_NONE";
  DEVICE_MODE_UNSPECIFIED = 0;
  // The device, alone, while the workload is placed.
  DEVICE_MODE_PASSTHROUGH = 2;
  // A virtual device a hypervisor partitions it into.
  DEVICE_MODE_MEDIATED = 3;
  // The same device as up to its shares of other holders.
  DEVICE_MODE_TIMESLICE = 4;
}
