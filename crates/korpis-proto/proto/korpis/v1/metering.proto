//
// Reading metering (§2 of docs/15-observability.md): what each interval of a workload used, as
// measured from its node's samples, where nothing was heard, and which days have closed. Read
// under metering.read over a workload, a project, or an organization, which a parent holds over
// its children as it holds every read (§7 of docs/08-identity.md), and which a suspended
// organization keeps (§2.1 there). Every figure says its window, where it came from, and how it
// was measured, since a billable number is never shown without them (§8 of
// docs/11-surface-web.md).

syntax = "proto3";

package korpis.v1;

import "google/protobuf/timestamp.proto";
import "korpis/v1/api.proto";

service MeteringService {
  // The records of what a workload, or every workload of a project or an organization's
  // subtree, used over intervals beginning in a window, in the order they begin.
  rpc ListUsage(ListUsageRequest) returns (ListUsageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The metering days in a window and whether each has closed.
  rpc ListPeriods(ListPeriodsRequest) returns (ListPeriodsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message ListUsageRequest {
  // Exactly one of the three.
  optional string workload = 1;
  optional string project = 2;
  optional string organization = 3;
  // Intervals beginning at or after `from` and before `to`; `to` is now when unset, and `from`
  // a day before `to`.
  google.protobuf.Timestamp from = 4;
  google.protobuf.Timestamp to = 5;
  // Every record, superseded ones included; by default only the current ones: what nothing
  // later replaced.
  bool every_version = 6;
  PageRequest page = 7;
  // Read the window as an invoice sums it: the records of the UTC days beginning from the day
  // `from` falls in and before the day `to` falls in, each record in the day it counts in. A
  // measurement or gap counts in the day its interval begins, and an adjustment in the day it was
  // recorded, which was open then; a record superseded only by an adjustment stays in its closed
  // day. So a closed day reads the same whenever it is read, and a sum of consecutive days counts
  // each use once.
  bool by_period = 8;
}

message ListUsageResponse {
  repeated UsageRecord records = 1;
  PageResponse page = 2;
}

enum UsageKind {
  USAGE_KIND_UNSPECIFIED = 0;
  // What was measured.
  USAGE_KIND_MEASURED = 1;
  // That nothing was heard over it, and why; replaced when a measurement arrives.
  USAGE_KIND_GAP = 2;
  // A measurement that arrived after the day it belongs to closed.
  USAGE_KIND_ADJUSTMENT = 3;
}

// What a workload used over one interval, or over one span of samples lost. Each quantity is
// absent where nothing measured it, never zero for that. CPU, throttled time, and block and
// network bytes are the kernel's own counters, differenced between two samples of the workload
// on its node; memory is integrated by the node from readings every ten seconds; disk is what the
// volumes' filesystem accounted at the interval's end.
message UsageRecord {
  string id = 1;
  string workload = 2;
  // The node that measured it, shown only to a caller who may read that node.
  optional string node = 3;
  uint64 lease_epoch = 4;
  // The window it covers.
  google.protobuf.Timestamp from = 5;
  google.protobuf.Timestamp to = 6;
  UsageKind kind = 7;
  // Why it spans more than an interval, began a count again, or is a gap.
  string cause = 8;
  // The records it replaces.
  repeated string supersedes = 9;
  // When the control plane recorded it: an adjustment's date.
  google.protobuf.Timestamp recorded_at = 10;
  optional uint64 cpu_usec = 11;
  optional uint64 cpu_throttled_usec = 12;
  optional uint64 io_read_bytes = 13;
  optional uint64 io_write_bytes = 14;
  // Received and sent, not split by destination.
  optional uint64 net_rx_bytes = 15;
  optional uint64 net_tx_bytes = 16;
  // KiB-seconds: exact as integers, where byte-seconds would not fit.
  optional uint64 memory_kib_seconds = 17;
  optional uint64 memory_peak_bytes = 18;
  optional uint64 disk_bytes = 19;
  // `disk_bytes` is what the workload's block devices have allocated, which grows as its guest
  // writes and does not shrink when it deletes, not what its filesystems hold: a different
  // number from a container's, and shown as such (§3.1 of docs/06-storage.md).
  bool disk_allocated = 23;
  // What the node could not measure within it.
  repeated UsageLoss losses = 20;
  // Bytes that left the workload's link for anything but another workload's link on its node,
  // counted in the node's host table: what its egress budget is measured in (§5.1 of
  // docs/05-scheduling.md). Traffic to the node's ingress proxy counts; to another workload of
  // the node does not.
  optional uint64 egress_bytes = 21;
  // What each endpoint whose accounting is on carried, by name; none for an endpoint whose
  // accounting is off, which is not counted.
  repeated EndpointUsage endpoints = 22;
}

// One endpoint's bytes and packets over a record's window: sent to its port, and from it.
message EndpointUsage {
  string endpoint = 1;
  uint64 received_bytes = 2;
  uint64 received_packets = 3;
  uint64 sent_bytes = 4;
  uint64 sent_packets = 5;
}

message UsageLoss {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  string cause = 3;
}

message ListPeriodsRequest {
  // The days beginning at or after `from` and before `to`, at most a year of them.
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}

enum PeriodState {
  PERIOD_STATE_UNSPECIFIED = 0;
  // Its day is running.
  PERIOD_STATE_OPEN = 1;
  // Its day ended, and a late sample may still revise it.
  PERIOD_STATE_CLOSING = 2;
  // Closed: a later record of it is an adjustment in the day it arrives.
  PERIOD_STATE_CLOSED = 3;
}

message MeteringPeriod {
  // The UTC day.
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  PeriodState state = 3;
  // When it closed, or when it will close at the lateness window in force.
  google.protobuf.Timestamp closes_at = 4;
}

message ListPeriodsResponse {
  repeated MeteringPeriod periods = 1;
}

// What a workload uses now, as its node reads it: sent by the node at each of its meter's
// readings, every ten seconds, on a session opened under metering.read over the workload (§3.1
// of docs/02-architecture.md), whose params are empty. It is not a record: nothing keeps it, and
// what is billed is the UsageRecord of the interval it falls in. Each rate is over the window
// from the reading before, and absent where either reading did not measure it, or on the first,
// which has no reading before it.
message UsageNow {
  // When the node read it, by the node's clock.
  google.protobuf.Timestamp at = 1;
  // The reading before, which the rates are over; absent on the first.
  google.protobuf.Timestamp since = 2;
  // Memory in use at the reading.
  optional uint64 memory_bytes = 3;
  // CPU time a second of the window, in thousandths of a core.
  optional uint64 cpu_millicores = 4;
  // Of the window, the thousandths the workload's CPU was throttled.
  optional uint64 cpu_throttled_permille = 5;
  optional uint64 io_read_bytes_per_second = 6;
  optional uint64 io_write_bytes_per_second = 7;
  optional uint64 net_rx_bytes_per_second = 8;
  optional uint64 net_tx_bytes_per_second = 9;
}
