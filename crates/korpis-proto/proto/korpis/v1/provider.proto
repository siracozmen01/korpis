//
// How Korpis reaches a provider (§3.3 of docs/16-extensions.md): the extension dials out and
// holds one bidirectional stream, authenticated by its workload credential; it registers what
// it serves, and the control plane sends calls down the stream, each with a deadline. Each
// provider type's calls and results are messages of their own, numbered from 20 in the
// envelopes below (§5 of docs/16-extensions.md).

syntax = "proto3";

package korpis.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "korpis/v1/common.proto";
import "korpis/v1/extension.proto";
import "korpis/v1/tenancy.proto";

service ProviderService {
  // A provider's stream: authenticated as an installed extension, its first message registers
  // one of the provides entries its installation recorded.
  rpc Serve(stream ProviderMessage) returns (stream ProviderControl);
  // The registrations serving in an organization: extension.read over it.
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Calls a provider's Ping as an organization sees it (its own provider shadows its
  // ancestors'), and reports how the call ended: extension.read over the organization.
  rpc PingProvider(PingProviderRequest) returns (PingProviderResponse);
}

// Provider to control plane.
message ProviderMessage {
  oneof message {
    // The first message on a stream, and only the first.
    Register register = 1;
    CallResult result = 2;
  }
}

// Control plane to provider.
message ProviderControl {
  oneof message {
    // The answer to Register: the registration this stream serves.
    Registered registered = 1;
    ProviderCall call = 2;
    // The control plane no longer waits for this call; its result is discarded.
    CancelCall cancel = 3;
  }
}

message Register {
  ProviderType type = 1;
  // One of the provides entries its installation recorded.
  string name = 2;
  // The provider's own version, for the registry and for replacement as a drain (§9 of
  // docs/16-extensions.md, question 1).
  string version = 3;
  // How many calls it accepts at once on this stream; the control plane never sends more.
  uint32 concurrency = 4;
  // identity: it signs people in, answering Authorize (§9.7 of docs/08-identity.md). A provider
  // that registered without it is never asked to.
  bool sign_in = 5;
}

message Registered {
  string registration = 1;
}

message ProviderCall {
  string call = 1;
  // The control plane stops waiting at this time.
  google.protobuf.Timestamp deadline = 2;
  oneof request {
    // A liveness check every provider answers.
    Ping ping = 10;
    // dns: make an owner's records exactly these.
    ApplyRecords apply_records = 20;
    // step: resolve an install step into artifacts.
    RunStep run_step = 21;
    // backup_target: scoped access for one job, and the control plane's listing and pruning.
    GrantAccess grant_access = 22;
    ListObjects list_objects = 23;
    DeleteObjects delete_objects = 24;
    // key_management: a new data key, and one stored key opened, each sealed to its recipient.
    GenerateKey generate_key = 25;
    UnwrapKey unwrap_key = 26;
    // identity: whether a set still is what it was, and which of these people are still in it.
    VerifyMembers verify_members = 27;
    // identity: who presented this evidence, and which sets they are in.
    Assert assert = 28;
    // identity, sign_in: where to send a person to sign in.
    Authorize authorize = 29;
  }
}

message CallResult {
  string call = 1;
  oneof outcome {
    // A failure, with a reason the plan or the observation shows.
    Error error = 2;
    Pong pong = 10;
    RecordsApplied records_applied = 20;
    StepResult step_result = 21;
    ObjectAccess object_access = 22;
    ObjectList object_list = 23;
    ObjectsDeleted objects_deleted = 24;
    KeyMaterial key_material = 25;
    Members members = 26;
    Assertion assertion = 27;
    Authorization authorization = 28;
  }
}

message CancelCall {
  string call = 1;
}

message Ping {
  string nonce = 1;
}

message Pong {
  string nonce = 1;
}

// One open provider stream, registered.
message ProviderRegistration {
  string id = 1;
  // The installation serving.
  string extension = 2;
  string organization = 3;
  ProviderType type = 4;
  string name = 5;
  string version = 6;
  uint32 concurrency = 7;
  google.protobuf.Timestamp connected = 8;
  // When the replica holding its stream last confirmed it open.
  google.protobuf.Timestamp seen = 9;
  // An identity provider's: it signs people in (§9.7 of docs/08-identity.md).
  bool sign_in = 10;
}

message ListProvidersRequest {
  string organization = 1;
}

message ListProvidersResponse {
  repeated ProviderRegistration providers = 1;
  // Every provider the organization's installations serve, registered or not.
  repeated ProviderHealth health = 2;
}

// A provider's circuit breaker and what was last measured of it (§5 of docs/16-extensions.md).
message ProviderHealth {
  ProviderType type = 1;
  string name = 2;
  BreakerState breaker = 3;
  // Open: when it is probed. Half open: when its probe's deadline passes.
  google.protobuf.Timestamp until = 4;
  // Its calls finished in the last five minutes, at most the last twenty.
  uint32 calls = 5;
  uint32 failed = 6;
  google.protobuf.Duration median_latency = 7;
  // The median share of its deadline a call took, in thousandths.
  uint32 median_deadline_permille = 8;
}

enum BreakerState {
  BREAKER_STATE_UNSPECIFIED = 0;
  // Calls go through.
  BREAKER_STATE_CLOSED = 1;
  // Calls fail at once with provider.circuit_open until it is probed.
  BREAKER_STATE_OPEN = 2;
  // One call, the probe, is in flight; the others fail at once.
  BREAKER_STATE_HALF_OPEN = 3;
}

message PingProviderRequest {
  string organization = 1;
  ProviderType type = 2;
  string name = 3;
  // How long to wait; five seconds when unset, never more than five minutes.
  google.protobuf.Duration timeout = 4;
}

message PingProviderResponse {
  string call = 1;
  // The registration the call was sent to, and its version; empty if it was never sent.
  string registration = 2;
  string version = 3;
  google.protobuf.Duration elapsed = 4;
  // Set when the call failed: provider.deadline, provider.stream_ended, provider.unknown,
  // provider.circuit_open (with retry_after), or a reason of the provider's own.
  Error error = 5;
}

// DNS (§3.5 of docs/07-networking.md). The control plane holds what each owner's records should
// be; a provider makes them so in the zones it manages, removing records the owner no longer has
// and leaving every record it does not own alone. A name in no zone it manages fails
// dns.zone_not_found; a name held by a record it does not own fails dns.conflict.
message ApplyRecords {
  // Who the records belong to, e.g. an endpoint, `ep_...`: stable for as long as they exist.
  string owner = 1;
  // Every record the owner should have; empty removes them all.
  repeated DnsRecord records = 2;
}

message DnsRecord {
  // A fully qualified name, lowercase, without the trailing dot.
  string name = 1;
  DnsRecordType type = 2;
  // Seconds, 30 to 86400.
  uint32 ttl = 3;
  // As the type writes them: an address for A and AAAA, a name for CNAME, "priority weight port
  // target" for SRV, the text for TXT.
  repeated string values = 4;
}

enum DnsRecordType {
  DNS_RECORD_TYPE_UNSPECIFIED = 0;
  DNS_RECORD_TYPE_A = 1;
  DNS_RECORD_TYPE_AAAA = 2;
  DNS_RECORD_TYPE_CNAME = 3;
  DNS_RECORD_TYPE_SRV = 4;
  DNS_RECORD_TYPE_TXT = 5;
}

// What applying changed.
message RecordsApplied {
  uint32 created = 1;
  uint32 updated = 2;
  uint32 deleted = 3;
}

// Recipe steps (§4 of docs/09-recipes.md). A step provider resolves a step into content-addressed
// artifacts; the node's content store fetches each by its hash and the workload's own filesystem
// worker writes it, so the provider never touches a tenant's volume and re-running a step
// overwrites the same targets.
message RunStep {
  // The step kind, `<publisher>/<step>`.
  string step = 1;
  map<string, Value> arguments = 2;
  // The workload being installed.
  string workload = 3;
  // The platform of the node that will run it.
  Platform platform = 4;
}

message Platform {
  string os = 1;
  string arch = 2;
}

message StepResult {
  // At most 1000; an application of many files ships as archives.
  repeated StepArtifact artifacts = 1;
  // Whether the request named the content exactly; an unpinned result marks the workload
  // non-reproducible.
  bool pinned = 2;
  // What it resolved to, e.g. the manifest a channel held.
  string resolved = 3;
}

message StepArtifact {
  // Relative to the `to` of the recipe step that asked (§4 of docs/09-recipes.md); never absolute,
  // never through `..`.
  string path = 1;
  // http or https; fetched once per node by the content store.
  string url = 2;
  // Lowercase hex, mandatory.
  string sha256 = 3;
  uint64 size = 4;
  uint32 mode = 5;
  // An archive unpacked at `path` under the `extract` verb's rules.
  bool extract = 6;
}

// Backup targets (§5.6 of docs/06-storage.md). Object bytes never cross this stream: a node writes
// or reads with access scoped to one workload's prefix, which the provider issues per job, and
// the control plane prunes through the provider, which alone holds the target's own credential.
message GrantAccess {
  // A key prefix in the repository, ending in "/", e.g. "workloads/wl_.../".
  string prefix = 1;
  AccessMode mode = 2;
  // How long the access lasts, 900 to 43200 seconds: never longer than asked, since a prune's
  // sweep waits for every access it recorded to end.
  uint32 ttl_seconds = 3;
}

enum AccessMode {
  ACCESS_MODE_UNSPECIFIED = 0;
  // Put, get, and list, under the prefix only; never delete. A backup reads its parent's record
  // and trees.
  ACCESS_MODE_WRITE = 1;
  // Get and list, under the prefix only.
  ACCESS_MODE_READ = 2;
}

// Access the node uses directly. A store that cannot scope access to a prefix is served by its
// provider itself, which mints the access (§5.6 of docs/06-storage.md); a provider that can do
// neither fails backup.unscoped.
message ObjectAccess {
  google.protobuf.Timestamp expires_at = 1;
  oneof protocol {
    S3Access s3 = 10;
  }
}

message S3Access {
  string endpoint = 1;
  string region = 2;
  string bucket = 3;
  // Where the granted prefix lives in the bucket; the node writes beneath it.
  string key_prefix = 4;
  string access_key_id = 5;
  string secret_access_key = 6;
  string session_token = 7;
  // Address the bucket in the path (`endpoint/bucket/key`) rather than in the host name
  // (`bucket.endpoint/key`): what most self-hosted stores need, and what AWS no longer
  // recommends.
  bool path_style = 8;
  // A store its provider serves itself (§5.6 of docs/06-storage.md): the name of the endpoint of
  // the provider's own workload it serves on, in place of `endpoint`. The control plane puts the
  // endpoint's published address in `endpoint`, and clears this, before anything uses the access.
  string served_by = 9;
  // The one certificate, DER, such a store presents: the client trusts it and no other, whatever
  // name or address it reaches the store by. Empty for a store verified against system roots.
  bytes certificate = 10;
}

message ListObjects {
  string prefix = 1;
  // Keys after this one, in key order; empty for the first page.
  string after = 2;
  // At most 1000.
  uint32 limit = 3;
}

message ObjectList {
  repeated StoredObject objects = 1;
  // Whether more follow the last.
  bool more = 2;
}

message StoredObject {
  string key = 1;
  uint64 size = 2;
  google.protobuf.Timestamp modified = 3;
}

message DeleteObjects {
  // At most 1000, each beneath a prefix the control plane manages.
  repeated string keys = 1;
}

message ObjectsDeleted {
  uint32 deleted = 1;
}

// A new data key for one workload in one repository (§5.5 of docs/06-storage.md): made by the
// provider, wrapped by the tenant's key for the control plane to store, and sealed to the
// recipient, never sent in the clear. The provider must refuse a context its policy does not
// name, so a credential taken from it unwraps nothing else.
message GenerateKey {
  // The tenant's key, as the repository names it: opaque to Korpis.
  string key = 1;
  // `<repository>/<workload>`, bound into the wrapping and the sealing.
  bytes context = 2;
  // An X25519 public key, 32 bytes, made for this call alone.
  bytes recipient = 3;
}

// A stored data key opened by the tenant's key and sealed to the recipient.
message UnwrapKey {
  string key = 1;
  bytes context = 2;
  bytes recipient = 3;
  // As GenerateKey answered it.
  bytes wrapped = 4;
}

// A data key, wrapped for storage (GenerateKey only) and sealed to the call's recipient: HPKE,
// RFC 9180, base mode, DHKEM(X25519, HKDF-SHA256), HKDF-SHA256, ChaCha20-Poly1305, info
// `korpis.key.v1`, the call's context as associated data; the encapsulated key, then the
// ciphertext.
message KeyMaterial {
  bytes wrapped = 1;
  bytes sealed = 2;
}

// An identity provider re-verifying what it vouched for (§5.1 of docs/08-identity.md). With a
// set: whether it still exists and is the set it was, and which of `members` are in it and in
// every required set. Without one: which of `members` the provider still knows.
message VerifyMembers {
  ExternalSet set = 1;
  // People at the provider, by their identifier there; at most 256.
  repeated string members = 2;
  // Other sets of the same provider each member must also be in.
  repeated ExternalSet require_membership = 3;
}

message Members {
  // For a set: it exists and is the set it was. Without a set, unread.
  bool set_exists = 1;
  // Those of the members asked about who are confirmed: in the set and every required one, or,
  // without a set, known to the provider.
  repeated string present = 2;
  // Those of the members asked about the provider holds no current evidence of, neither present
  // nor gone: each keeps their last confirmation, to lapse on its own (§5.1 of
  // docs/08-identity.md). Every member named neither here nor in `present` is gone.
  repeated string unknown = 3;
}

// What a person presented to an identity provider's surface, passed on as received: a signed
// chat interaction, an authorization code. Its form is the provider's own; Korpis reads only the
// answer (§5.2 of docs/08-identity.md).
message Assert {
  // At most 64 KiB.
  bytes evidence = 1;
  // How it arrived, where its form says (a signature, a timestamp); at most 32 entries.
  map<string, string> headers = 2;
}

// Who presented the evidence, as the provider vouches.
message Assertion {
  // The person's identifier at the provider.
  string user = 1;
  // The sets of this provider they are in, as the evidence shows; at most 256.
  repeated ExternalSet sets = 2;
  // The provider's identifier for this one presentation (an interaction id, a code's digest),
  // which the control plane accepts once.
  string presentation = 3;
  // When the person presented it, by the provider's evidence.
  google.protobuf.Timestamp at = 4;
}

// A sign-in the control plane began (§9.7 of docs/08-identity.md): the provider answers where to
// send the person, carrying these as its protocol carries them.
message Authorize {
  // Opaque, made by the control plane; returned with the person.
  string state = 1;
  // Opaque, made by the control plane; asserted back inside what the person returns with.
  string nonce = 2;
  // The PKCE challenge, S256 (RFC 7636 §4.2), of a verifier the control plane never sees.
  string code_challenge = 3;
  // Where the person is sent back to: the panel's callback.
  string redirect_uri = 4;
}

message Authorization {
  // An https URL at the identity provider.
  string url = 1;
}
