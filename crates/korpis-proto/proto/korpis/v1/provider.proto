// SPDX-License-Identifier: Apache-2.0
//
// How Korpis reaches a provider (§3.3 of docs/16-extensions.md): the extension dials out and
// holds one bidirectional stream, authenticated by its workload credential; it registers what
// it serves, and the control plane sends calls down the stream, each with a deadline. Each
// provider type's calls and results are messages of their own, numbered from 20 in the
// envelopes below (§5 of docs/16-extensions.md).

syntax = "proto3";

package korpis.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "korpis/v1/common.proto";
import "korpis/v1/extension.proto";

service ProviderService {
  // A provider's stream: authenticated as an installed extension, its first message registers
  // one of the provides entries its installation recorded.
  rpc Serve(stream ProviderMessage) returns (stream ProviderControl);
  // The registrations serving in an organization: extension.read over it.
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Calls a provider's Ping as an organization sees it (its own provider shadows its
  // ancestors'), and reports how the call ended: extension.read over the organization.
  rpc PingProvider(PingProviderRequest) returns (PingProviderResponse);
}

// Provider to control plane.
message ProviderMessage {
  oneof message {
    // The first message on a stream, and only the first.
    Register register = 1;
    CallResult result = 2;
  }
}

// Control plane to provider.
message ProviderControl {
  oneof message {
    // The answer to Register: the registration this stream serves.
    Registered registered = 1;
    ProviderCall call = 2;
    // The control plane no longer waits for this call; its result is discarded.
    CancelCall cancel = 3;
  }
}

message Register {
  ProviderType type = 1;
  // One of the provides entries its installation recorded.
  string name = 2;
  // The provider's own version, for the registry and for replacement as a drain (§9 of
  // docs/16-extensions.md, question 1).
  string version = 3;
  // How many calls it accepts at once on this stream; the control plane never sends more.
  uint32 concurrency = 4;
}

message Registered {
  string registration = 1;
}

message ProviderCall {
  string call = 1;
  // The control plane stops waiting at this time.
  google.protobuf.Timestamp deadline = 2;
  oneof request {
    // A liveness check every provider answers.
    Ping ping = 10;
  }
}

message CallResult {
  string call = 1;
  oneof outcome {
    // A failure, with a reason the plan or the observation shows.
    Error error = 2;
    Pong pong = 10;
  }
}

message CancelCall {
  string call = 1;
}

message Ping {
  string nonce = 1;
}

message Pong {
  string nonce = 1;
}

// One open provider stream, registered.
message ProviderRegistration {
  string id = 1;
  // The installation serving.
  string extension = 2;
  string organization = 3;
  ProviderType type = 4;
  string name = 5;
  string version = 6;
  uint32 concurrency = 7;
  google.protobuf.Timestamp connected = 8;
  // When the replica holding its stream last confirmed it open.
  google.protobuf.Timestamp seen = 9;
}

message ListProvidersRequest {
  string organization = 1;
}

message ListProvidersResponse {
  repeated ProviderRegistration providers = 1;
}

message PingProviderRequest {
  string organization = 1;
  ProviderType type = 2;
  string name = 3;
  // How long to wait; five seconds when unset, never more than five minutes.
  google.protobuf.Duration timeout = 4;
}

message PingProviderResponse {
  string call = 1;
  // The registration the call was sent to, and its version; empty if it was never sent.
  string registration = 2;
  string version = 3;
  google.protobuf.Duration elapsed = 4;
  // Set when the call failed: provider.deadline, provider.stream_ended, provider.unknown, or a
  // reason of the provider's own.
  Error error = 5;
}
