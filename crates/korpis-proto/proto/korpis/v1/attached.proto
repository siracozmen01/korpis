// SPDX-License-Identifier: Apache-2.0
//
// Attached resources: volumes, endpoints, and streams (§3.6 of docs/01-model.md). Extensions
// (§3.7) are in extension.proto.

syntax = "proto3";

package korpis.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "korpis/v1/workload_spec.proto";

// Durable state with a lifecycle independent of the workload using it.
message Volume {
  string id = 1;
  string project = 2;
  string name = 3;
  uint64 size_bytes = 4;
  string storage_class = 5;
  // Absent for network-backed classes.
  optional string node = 6;
  optional string attached_to = 7;
  VolumeMode mode = 8;
  repeated string snapshots = 9;
  google.protobuf.Timestamp created = 10;
  google.protobuf.Timestamp deleted_at = 11;
  // Whether its size is enforced in the write path; size_bytes is zero, and shown nowhere, when
  // it is not (Rule K-3, §2 of docs/06-storage.md).
  bool quota_enforced = 12;
  VolumeKind kind = 13;
  // When the workload it was attached to let go of it; the volume and its data remain.
  google.protobuf.Timestamp detached_at = 14;
  // The workload it was created for.
  string created_by = 15;
}

// A point a volume can be rolled back to, on its node and filesystem (§4 of docs/06-storage.md):
// no protection against losing either, which is what a backup is for.
message Snapshot {
  string id = 1;
  string volume = 2;
  // Unique among the volume's live snapshots.
  string name = 3;
  google.protobuf.Timestamp created = 4;
  google.protobuf.Timestamp deleted_at = 5;
}

enum VolumeKind {
  VOLUME_KIND_UNSPECIFIED = 0;
  // One the workload declared.
  VOLUME_KIND_DECLARED = 1;
  // Its console stream's (§4 of docs/14-streams.md).
  VOLUME_KIND_STREAM = 2;
}

// A way the network reaches a workload. The replacement for the allocation.
message Endpoint {
  string id = 1;
  string workload = 2;
  string name = 3;
  EndpointProtocol protocol = 4;
  uint32 container_port = 5;
  Exposure exposure = 6;
  // Assigned; its shape depends on the exposure.
  Address address = 7;
  ClientAddress client_address = 8;
  repeated string domains = 9;
  TlsSpec tls = 10;
  NetworkPolicy policy = 11;
  bool accounting = 12;
  ShapingSpec shaping = 13;
}

message Address {
  string ip = 1;
  uint32 port = 2;
  // For node_port and node_bound: the node it is bound to.
  string node = 3;
  // For stable: the edge failover group serving it.
  string edge_group = 4;
}

// How the workload sees the client (§3.4 of docs/07-networking.md).
enum ClientAddress {
  CLIENT_ADDRESS_UNSPECIFIED = 0;
  CLIENT_ADDRESS_PRESERVED = 1;
  CLIENT_ADDRESS_TRANSLATED = 2;
  // Delivered by PROXY protocol v2 to a router that requested it.
  CLIENT_ADDRESS_PROXY_PROTOCOL = 3;
}

// A durable, addressable channel of output from a workload.
message Stream {
  string id = 1;
  string workload = 2;
  StreamKind kind = 3;
  oneof retention {
    google.protobuf.Duration retention_duration = 4;
    uint64 retention_bytes = 5;
  }
  // Was `bool indexed`, a field the model gave no meaning: a stream is searched by scanning the
  // node's segment files (§8 of docs/14-streams.md), so there is no index to turn on.
  reserved 6;
  reserved "indexed";
  // Bytes held only on the node, not yet offloaded (§4 of docs/14-streams.md).
  uint64 node_only_bytes = 7;
  // Its segments, oldest first, as the control plane last heard of them.
  repeated StreamSegment segments = 8;
}

// A contiguous run of a stream's records, the unit a node seals, offloads, and migrates (§4 of
// docs/14-streams.md). The agent journals each seal and offload; the control plane holds this
// index, so offloaded segments stay findable when their node is gone.
message StreamSegment {
  // The offset of its first record, and one past its last.
  uint64 first_offset = 1;
  uint64 end_offset = 2;
  // The node-clock times of its first and last records; informational, as offsets order.
  google.protobuf.Timestamp first_at = 3;
  google.protobuf.Timestamp last_at = 4;
  uint64 bytes = 5;
  // sha256: of the sealed content, its address; empty while the segment is still written.
  string digest = 6;
  // Held on the node that wrote it; empty once the node no longer holds it.
  string node = 7;
  // Held by the offload target.
  bool offloaded = 8;
}

enum StreamKind {
  STREAM_KIND_UNSPECIFIED = 0;
  STREAM_KIND_CONSOLE = 1;
  STREAM_KIND_LOG = 2;
  STREAM_KIND_EVENT = 3;
  STREAM_KIND_METRIC = 4;
}

// A place in a backup target that workloads' backups are kept in (§5.3 of docs/06-storage.md).
message Repository {
  string id = 1;
  string organization = 2;
  // The project it serves; the whole organization when unset.
  optional string project = 3;
  // Unique among the organization's live repositories.
  string name = 4;
  // The organization's backup target provider, by name.
  string provider = 5;
  // Its place in the target: a relative prefix ending in '/'.
  string prefix = 6;
  KeyCustody key_custody = 7;
  RetentionPolicy retention = 8;
  google.protobuf.Timestamp created = 9;
}

// Who holds a repository's key-encryption key (§5.5 of docs/06-storage.md).
enum KeyCustody {
  KEY_CUSTODY_UNSPECIFIED = 0;
  // The control plane: the operator can read tenants' backups, through a grant naming the
  // tenant, which the tenant sees.
  KEY_CUSTODY_OPERATOR = 1;
  // A key management service the tenant controls, asked per job: the operator cannot.
  KEY_CUSTODY_TENANT = 2;
}

message RetentionPolicy {
  uint32 keep_last = 1;
  uint32 keep_hourly = 2;
  uint32 keep_daily = 3;
  uint32 keep_weekly = 4;
  uint32 keep_monthly = 5;
  uint32 keep_yearly = 6;
  // How long a failed backup's record is kept.
  google.protobuf.Duration keep_failed = 7;
  // A floor beneath which nothing prunes.
  google.protobuf.Duration min_retention = 8;
}

// One backup of one volume, as the node that ran it reported it (§5 of docs/06-storage.md).
message Backup {
  string id = 1;
  string repository = 2;
  string workload = 3;
  string volume = 4;
  string plan = 5;
  // The volume's backup whose unchanged files it did not read again.
  optional string parent = 6;
  BackupStatus status = 7;
  // Read from a snapshot, a single point in time; false when read live.
  bool consistent = 8;
  uint64 files = 9;
  uint64 directories = 10;
  uint64 bytes = 11;
  uint64 chunks_new = 12;
  uint64 bytes_new = 13;
  uint64 stored_bytes = 14;
  uint64 files_unchanged = 15;
  repeated string skipped = 16;
  string error = 17;
  google.protobuf.Timestamp created = 18;
  google.protobuf.Timestamp finished = 19;
  google.protobuf.Timestamp deleted_at = 20;
}

enum BackupStatus {
  BACKUP_STATUS_UNSPECIFIED = 0;
  BACKUP_STATUS_PENDING = 1;
  BACKUP_STATUS_SUCCEEDED = 2;
  BACKUP_STATUS_FAILED = 3;
}
