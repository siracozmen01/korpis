//
// Attached resources: volumes, endpoints, and streams (§3.6 of docs/01-model.md). Extensions
// (§3.7) are in extension.proto.

syntax = "proto3";

package korpis.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "korpis/v1/workload_spec.proto";

// Durable state with a lifecycle independent of the workload using it.
message Volume {
  string id = 1;
  string project = 2;
  string name = 3;
  uint64 size_bytes = 4;
  string storage_class = 5;
  // Absent for network-backed classes.
  optional string node = 6;
  optional string attached_to = 7;
  VolumeMode mode = 8;
  repeated string snapshots = 9;
  google.protobuf.Timestamp created = 10;
  google.protobuf.Timestamp deleted_at = 11;
  // Whether its size is enforced in the write path; size_bytes is zero, and shown nowhere, when
  // it is not (Rule K-3, §2 of docs/06-storage.md).
  bool quota_enforced = 12;
  VolumeKind kind = 13;
  // When the workload it was attached to let go of it; the volume and its data remain.
  google.protobuf.Timestamp detached_at = 14;
  // The workload it was created for.
  string created_by = 15;
  // The storage a shared class's volume is in, as the nodes offering it read it at their mounts
  // (§2.1 of docs/06-storage.md); empty for a volume on one node's disk, whose node is set.
  string store = 16;
  // The nodes keeping a replica of it, by node, for a volume whose workload asks for replicas
  // (§2.2 of docs/06-storage.md).
  repeated VolumeReplica replicas = 17;
  // The copies of it left on nodes its workload failed over from onto a replica, each holding
  // what was written there after the replica last received (§2.2 of docs/06-storage.md).
  repeated VolumeDivergent divergent = 18;
  // For such a copy, itself a volume, the volume it diverged from.
  optional string divergent_of = 19;
}

// A node keeping a replica of a volume. What the volume would lose, were its workload started
// there, is what was written since received_at: the replica's age.
message VolumeReplica {
  string node = 1;
  // When the control plane chose the node.
  google.protobuf.Timestamp chosen_at = 2;
  // When it received the snapshot it holds; absent until its first one arrives.
  google.protobuf.Timestamp received_at = 3;
  // When it was marked stale, ten intervals without receiving; it is sent whole when it is
  // reached again.
  google.protobuf.Timestamp stale_at = 4;
}

// A copy of a volume left on the node it was on when its workload failed over onto a replica:
// a volume of its own, retained and held by no workload, never collected, and deleted as any
// retained volume is, only by a plan (§7 of docs/06-storage.md).
message VolumeDivergent {
  string node = 1;
  // When the volume left it.
  google.protobuf.Timestamp since = 2;
  // When the replica the volume was made from received what it held; the copy alone holds what
  // was written between then and when the node went silent.
  google.protobuf.Timestamp held_until = 3;
  // The copy, as a volume.
  string volume = 4;
}

// A point a volume can be rolled back to, on its node and filesystem (§4 of docs/06-storage.md):
// no protection against losing either, which is what a backup is for.
message Snapshot {
  string id = 1;
  string volume = 2;
  // Unique among the volume's live snapshots.
  string name = 3;
  google.protobuf.Timestamp created = 4;
  google.protobuf.Timestamp deleted_at = 5;
}

enum VolumeKind {
  VOLUME_KIND_UNSPECIFIED = 0;
  // One the workload declared.
  VOLUME_KIND_DECLARED = 1;
  // Its console stream's (§4 of docs/14-streams.md).
  VOLUME_KIND_STREAM = 2;
}

// A way the network reaches a workload. The replacement for the allocation.
message Endpoint {
  string id = 1;
  string workload = 2;
  string name = 3;
  EndpointProtocol protocol = 4;
  uint32 container_port = 5;
  Exposure exposure = 6;
  // Assigned; its shape depends on the exposure.
  Address address = 7;
  ClientAddress client_address = 8;
  repeated string domains = 9;
  TlsSpec tls = 10;
  NetworkPolicy policy = 11;
  bool accounting = 12;
  ShapingSpec shaping = 13;
  // For an ingress endpoint the proxy terminates: the certificate it is served with, once one
  // with a key is held, and that certificate's revision; its node fetches the certificate again
  // when the revision changes (§3.2 of docs/07-networking.md).
  string certificate = 14;
  int64 certificate_revision = 15;
}

message Address {
  // Every address it is reached at: for node_port and node_bound, each the node advertises,
  // all with the same port.
  repeated string ips = 1;
  uint32 port = 2;
  // For node_port and node_bound: the node it is bound to.
  string node = 3;
  // For stable: the edge failover group serving it.
  string edge_group = 4;
  // For stable: why the control plane does not know it reached now, which its group's probe
  // and its address's lease say; empty where they do not. The workload keeps its state and
  // placement either way (§3.1 of docs/07-networking.md).
  string unreached = 5;
}

// A durable, addressable channel of output from a workload.
message Stream {
  string id = 1;
  string workload = 2;
  StreamKind kind = 3;
  oneof retention {
    google.protobuf.Duration retention_duration = 4;
    uint64 retention_bytes = 5;
  }
  // Was `bool indexed`, a field the model gave no meaning: a stream is searched by scanning the
  // node's segment files (§8 of docs/14-streams.md), so there is no index to turn on.
  reserved 6;
  reserved "indexed";
  // Bytes held only on the node, not yet offloaded (§4 of docs/14-streams.md).
  uint64 node_only_bytes = 7;
  // Its segments, oldest first, as the control plane last heard of them.
  repeated StreamSegment segments = 8;
  // How long an offloaded segment is kept: what the workload declares, raised to the operator's
  // floor where it is lower.
  google.protobuf.Duration offload_retention = 9;
  // The operator's floor, disclosed (§8 of docs/17-security.md); zero when there is none.
  google.protobuf.Duration retention_floor = 10;
  // The run whose console it is, for a task or scheduled workload, each run's its own (§4 of
  // docs/14-streams.md); empty for a persistent workload's.
  string run = 11;
}

// A contiguous run of a stream's records, the unit a node seals, offloads, and migrates (§4 of
// docs/14-streams.md). The agent journals each seal and offload; the control plane holds this
// index, so offloaded segments stay findable when their node is gone.
message StreamSegment {
  // The offset of its first record, and one past its last.
  uint64 first_offset = 1;
  uint64 end_offset = 2;
  // The node-clock times of its first and last records; informational, as offsets order.
  google.protobuf.Timestamp first_at = 3;
  google.protobuf.Timestamp last_at = 4;
  uint64 bytes = 5;
  // sha256: of the sealed content, its address; empty while the segment is still written.
  string digest = 6;
  // Held on the node that wrote it; empty once the node no longer holds it.
  string node = 7;
  // Held by the offload target.
  bool offloaded = 8;
  // The repository holding it once offloaded, `rep_…`: as the grant the node offloaded it with
  // named it, and believed only if the control plane gave that node access to the workload's
  // streams there.
  string repository = 9;
}

enum StreamKind {
  STREAM_KIND_UNSPECIFIED = 0;
  STREAM_KIND_CONSOLE = 1;
  STREAM_KIND_LOG = 2;
  STREAM_KIND_EVENT = 3;
  STREAM_KIND_METRIC = 4;
}

// A place in a backup target that workloads' backups are kept in (§5.3 of docs/06-storage.md).
message Repository {
  string id = 1;
  string organization = 2;
  // The project it serves; the whole organization when unset.
  optional string project = 3;
  // Unique among the organization's live repositories.
  string name = 4;
  // The organization's backup target provider, by name.
  string provider = 5;
  // Its place in the target: a relative prefix ending in '/'.
  string prefix = 6;
  KeyCustody key_custody = 7;
  RetentionPolicy retention = 8;
  google.protobuf.Timestamp created = 9;
  // Whether the console streams of the workloads it serves are offloaded to it (§4 of
  // docs/14-streams.md): at most one repository per organization as a whole and one per
  // project, the project's taken first.
  bool streams = 10;
  // Under tenant custody, the tenant's key that makes and opens its data keys.
  TenantKey kms = 11;
}

// A tenant's key in its own key management service, reached through the organization's
// key_management provider (§5.5 of docs/06-storage.md).
message TenantKey {
  // The provider, by name.
  string provider = 1;
  // The key, as its service names it: opaque to Korpis, at most 1024 bytes.
  string key = 2;
}

// Who holds a repository's key-encryption key (§5.5 of docs/06-storage.md).
enum KeyCustody {
  KEY_CUSTODY_UNSPECIFIED = 0;
  // The control plane: the operator can read tenants' backups, through a grant naming the
  // tenant, which the tenant sees.
  KEY_CUSTODY_OPERATOR = 1;
  // A key management service the tenant controls, through the organization's key_management
  // provider: every opening of a data key is an unwrap it performs and logs, and revoking its key
  // ends them all. It does not keep the operator from a backup while its job runs on the
  // operator's node.
  KEY_CUSTODY_TENANT = 2;
}

message RetentionPolicy {
  uint32 keep_last = 1;
  uint32 keep_hourly = 2;
  uint32 keep_daily = 3;
  uint32 keep_weekly = 4;
  uint32 keep_monthly = 5;
  uint32 keep_yearly = 6;
  // How long a failed backup's record is kept.
  google.protobuf.Duration keep_failed = 7;
  // A floor beneath which nothing prunes.
  google.protobuf.Duration min_retention = 8;
}

// One backup of one volume, as the node that ran it reported it (§5 of docs/06-storage.md).
message Backup {
  string id = 1;
  string repository = 2;
  string workload = 3;
  string volume = 4;
  string plan = 5;
  // The volume's backup whose unchanged files it did not read again.
  optional string parent = 6;
  BackupStatus status = 7;
  // Read from a snapshot, a single point in time; false when read live.
  bool consistent = 8;
  uint64 files = 9;
  uint64 directories = 10;
  uint64 bytes = 11;
  uint64 chunks_new = 12;
  uint64 bytes_new = 13;
  uint64 stored_bytes = 14;
  uint64 files_unchanged = 15;
  repeated string skipped = 16;
  string error = 17;
  google.protobuf.Timestamp created = 18;
  google.protobuf.Timestamp finished = 19;
  google.protobuf.Timestamp deleted_at = 20;
  // For a block device's backup, the filesystem its image holds (`ext4`): the backup is that
  // one image, and its files are browsed and read inside a guest, never by the control plane
  // (§5.4 of docs/06-storage.md). Empty for a volume of files.
  string image_filesystem = 21;
}

enum BackupStatus {
  BACKUP_STATUS_UNSPECIFIED = 0;
  BACKUP_STATUS_PENDING = 1;
  BACKUP_STATUS_SUCCEEDED = 2;
  BACKUP_STATUS_FAILED = 3;
}

// A DNS name an organization holds (§3.2 of docs/07-networking.md, §3.6 of docs/01-model.md): it
// covers itself and every name beneath it, and its organization's endpoints may route the names
// it is the most specific verified domain for.
message Domain {
  string id = 1;
  string organization = 2;
  string name = 3;
  DomainVerification verification = 4;
  // For DOMAIN_VERIFICATION_DNS_TXT: the TXT record to publish, and what it must hold.
  string record = 5;
  string token = 6;
  // For DOMAIN_VERIFICATION_DELEGATED: the domain it lies beneath.
  optional string parent = 7;
  // Unset while pending.
  google.protobuf.Timestamp verified_at = 8;
  google.protobuf.Timestamp created_at = 9;
}

// A certificate an organization holds for the ingress (§3.2 of docs/07-networking.md, §3.6 of
// docs/01-model.md), without its key, which the control plane keeps sealed.
message Certificate {
  string id = 1;
  string organization = 2;
  // The DNS names its leaf names; a wildcard covers one label.
  repeated string names = 3;
  CertificateSource source = 4;
  // PEM, leaf first; empty while pending.
  string chain = 5;
  google.protobuf.Timestamp not_before = 6;
  google.protobuf.Timestamp not_after = 7;
  CertificateState state = 8;
  // Why its issuance or renewal failed, where it did.
  string reason = 9;
  // For CERTIFICATE_SOURCE_ACME: when its renewal begins.
  google.protobuf.Timestamp renew_after = 10;
  // Raised whenever its chain and key change.
  int64 revision = 11;
  google.protobuf.Timestamp created_at = 12;
  // Its key was given to a node later removed as compromised (§9 of docs/17-security.md): an
  // acme certificate is given a new key at once; a provided one waits for its organization to
  // replace it with a chain for another key, which clears this.
  bool exposed = 13;
  // For CERTIFICATE_SOURCE_ACME made for a portal: the portal whose name it is for.
  string portal = 14;
}

// A name the control plane answers under for an organization (§3.6 of docs/07-networking.md,
// §3.6 of docs/01-model.md): its API, its panel in the organization's theme, and its sign-in.
message Portal {
  string id = 1;
  string organization = 2;
  // A lowercase DNS name the organization holds.
  string name = 3;
  // The certificate it is served with: its own acme one, or a provided one.
  string certificate = 4;
  CertificateSource certificate_source = 5;
  CertificateState certificate_state = 6;
  // Why its certificate is not issued, or its renewal failed, where it did.
  string certificate_reason = 7;
  google.protobuf.Timestamp created_at = 8;
}

// An address pool (§3.6 of docs/01-model.md, §3.7 of docs/07-networking.md): addresses an
// organization's nodes hold for the workloads with a `dedicated_ip` endpoint that it and those
// below it run. Added 2026-10-26.
message AddressPool {
  string id = 1;
  string organization = 2;
  // Its addresses, as a network in CIDR notation: IPv4, but for an edge pool.
  string cidr = 3;
  AddressPoolScope scope = 4;
  // For a node pool, the node its addresses are routed to.
  string node = 5;
  // For a cluster pool, the address router that moves each to the node holding it: an extension
  // installation providing the `address_router` kind (§5 of docs/16-extensions.md).
  string router = 6;
  AddressRouting routing = 7;
  // The node's interface its addresses are answered for on, where they are on the node's link;
  // empty where they are routed to the node.
  string interface = 8;
  // How long a released address rests before it is given again; a day where none is asked.
  google.protobuf.Duration quarantine = 9;
  // Addresses of it never given: a link's network, gateway, and broadcast addresses.
  repeated string reserved = 10;
  // How many of its addresses workloads hold now; for an edge pool, how many of its addresses
  // and ports `stable` endpoints hold.
  uint64 held = 11;
  google.protobuf.Timestamp created_at = 12;
  // For an edge pool, the edge group whose members hold its addresses, `egr_...` (§3.1 of
  // docs/07-networking.md); its router, where it names one, is `router`. Added 2026-10-26.
  string group = 13;
}

// Two or more of an organization's nodes holding the stable addresses of its `stable` endpoints,
// and those of the organizations below it, each address on one member at a time (§3.1 of
// docs/07-networking.md, §3.6 of docs/01-model.md). Added 2026-10-26.
message EdgeGroup {
  string id = 1;
  string organization = 2;
  // Lowercase letters, digits, and hyphens; unique within its organization.
  string name = 3;
  // Its members, `nd_...`, nodes of its organization; fewer than two serve nothing.
  repeated string members = 4;
  // The ports given to `stable` endpoints, inclusive; 1024 to 65534 where none is asked.
  uint32 first_port = 5;
  uint32 last_port = 6;
  // The port every member forwards for the control plane's probe; 65535 where none is asked.
  uint32 probe_port = 7;
  // Between two probes of a member; a second where none is asked.
  google.protobuf.Duration probe_interval = 8;
  // Missed in a row before a member is failing; three where none is asked.
  uint32 probe_misses = 9;
  // A member's lease on an address; ten seconds where none is asked, at least three.
  google.protobuf.Duration term = 10;
  google.protobuf.Timestamp created_at = 11;
  // Each member as the control plane last probed it.
  repeated EdgeMemberStatus member_status = 12;
  // Each address of its pools, with the member holding it.
  repeated EdgeHolding holdings = 13;
  // Its ingress addresses, one of each family at most, at which its members' proxies serve the
  // names of the `ingress` endpoints it serves (§3.1 of docs/07-networking.md); none until a
  // placement first needs one.
  repeated string ingress_addresses = 14;
}

message EdgeMemberStatus {
  string node = 1;
  // Whether its own address passes the probe through its forwarding path.
  bool ready = 2;
  google.protobuf.Timestamp last_probe = 3;
  // Why it is not ready; empty where it is.
  string reason = 4;
}

message EdgeHolding {
  string address = 1;
  // The member holding it, `nd_...`; empty where none does.
  string node = 2;
  // The epoch of its lease, raised at every change of holder.
  uint64 epoch = 3;
  // Whether the address answered its last probes through its holder; meaningful once
  // `last_probe` is set.
  bool answering = 4;
  google.protobuf.Timestamp last_probe = 5;
  // The router moving it, by its provider's name; empty where its pool is on a link the members
  // share.
  string router = 6;
  // The member its router last said it routes it to, `nd_...`; empty until it has, and where it
  // routes it nowhere.
  string routed_to = 7;
  // Why the router's last answer was not that it routes it, while it is asked again.
  string route_failure = 8;
}

enum AddressPoolScope {
  ADDRESS_POOL_SCOPE_UNSPECIFIED = 0;
  // Routed to one node.
  ADDRESS_POOL_SCOPE_NODE = 1;
  // Held by an edge of the edge tier.
  ADDRESS_POOL_SCOPE_EDGE = 2;
  // Moved by an address router to whichever of the organization's nodes holds one.
  ADDRESS_POOL_SCOPE_CLUSTER = 3;
}

enum AddressRouting {
  ADDRESS_ROUTING_UNSPECIFIED = 0;
  // The network routes them to one node; a node pool's.
  ADDRESS_ROUTING_STATIC = 1;
  // The router announces each over BGP from the node holding it.
  ADDRESS_ROUTING_BGP = 2;
  // The router moves each through its provider's API.
  ADDRESS_ROUTING_PROVIDER_API = 3;
}

enum CertificateSource {
  CERTIFICATE_SOURCE_UNSPECIFIED = 0;
  // Issued and renewed by the control plane from an ACME directory.
  CERTIFICATE_SOURCE_ACME = 1;
  // Uploaded by its organization.
  CERTIFICATE_SOURCE_PROVIDED = 2;
}

enum CertificateState {
  CERTIFICATE_STATE_UNSPECIFIED = 0;
  CERTIFICATE_STATE_PENDING = 1;
  CERTIFICATE_STATE_ISSUED = 2;
  CERTIFICATE_STATE_FAILED = 3;
}

enum DomainVerification {
  DOMAIN_VERIFICATION_UNSPECIFIED = 0;
  // Its token in a TXT record the control plane resolves.
  DOMAIN_VERIFICATION_DNS_TXT = 1;
  // Beneath a verified domain of an ancestor organization, by that domain's holder.
  DOMAIN_VERIFICATION_DELEGATED = 2;
  // Attested by an operator of the installation.
  DOMAIN_VERIFICATION_OPERATOR = 3;
}
