// SPDX-License-Identifier: Apache-2.0
//
// Tenancy: organizations, projects, and quota (§3.1 of docs/01-model.md, §5.1 of
// docs/05-scheduling.md, §2 of docs/08-identity.md).

syntax = "proto3";

package korpis.v1;

import "google/protobuf/timestamp.proto";
import "korpis/v1/common.proto";

// The root of a tenancy tree. Recursive: a child organization is how reselling exists.
message Organization {
  string id = 1;
  // Unique within the parent.
  string name = 2;
  // Absent for a root organization.
  optional string parent = 3;
  QuotaSet quota = 4;
  OrganizationStatus status = 5;
  // Present while suspended (§2.1 of docs/08-identity.md).
  Suspension suspension = 6;
  google.protobuf.Timestamp created = 7;
  // Compare-and-swap version for updates (§6 of docs/10-api.md).
  uint64 version = 8;
}

enum OrganizationStatus {
  ORGANIZATION_STATUS_UNSPECIFIED = 0;
  ORGANIZATION_STATUS_ACTIVE = 1;
  ORGANIZATION_STATUS_SUSPENDED = 2;
}

// Reversible suspension, set from above only. It is not revocation.
message Suspension {
  Subject by = 1;
  google.protobuf.Timestamp at = 2;
  string reason = 3;
  OnSuspend on_suspend = 4;
}

enum OnSuspend {
  ON_SUSPEND_UNSPECIFIED = 0;
  ON_SUSPEND_KEEP_RUNNING = 1;
  ON_SUSPEND_STOP = 2;
}

// A named grouping of workloads inside an organization; the usual unit of delegation.
message Project {
  string id = 1;
  string organization = 2;
  // Unique within the organization.
  string name = 3;
  // Optional sub-limit within the organization's quota.
  QuotaSet quota = 4;
  map<string, string> labels = 5;
  google.protobuf.Timestamp created = 6;
  uint64 version = 7;
}

// Selector-scoped quota entries, each with reservations and limits (§5.1 of
// docs/05-scheduling.md). Reservations sum against the parent and are never oversubscribed;
// limits may exceed the parent's by the parent's declared overcommit ratio.
message QuotaSet {
  repeated QuotaEntry entries = 1;
  // Per-dimension overcommit ratio this owner permits its children's limits, in percent of its
  // own limit. Absent dimensions permit no overcommit. Memory defaults to none.
  map<string, uint32> child_overcommit_percent = 2;
}

message QuotaEntry {
  // The bounds were `Resources`, whose fields cannot say zero apart from absent, and a bound of
  // zero, which allows none of a dimension, is one a host sets: no dedicated IPv4 for this
  // customer. They are `QuotaBounds` now, under new numbers and names (§4 of docs/10-api.md).
  reserved 2, 3;
  reserved "reservations", "limits";
  // Absent applies to everything the owner contains.
  LabelSelector selector = 1;
  // Participates in the admission compare-and-swap (§5.1 of docs/05-scheduling.md).
  uint64 version = 4;
  // What shaping applies when the egress budget for the month is exhausted (§5.1 of
  // docs/05-scheduling.md). Set exactly when egress_bytes_per_month is: a budget that changes
  // nothing when it is spent is refused, since it would be displayed and not enforced.
  EgressExhaustion egress_exhausted = 5;
  // The bytes a calendar month of UTC days the workloads it counts may send beyond their links,
  // as their nodes count it (§7 of docs/07-networking.md). Not admitted: enforced after use, by
  // shaping, from the month's records as an invoice sums them.
  optional uint64 egress_bytes_per_month = 10;
  // What the workloads it counts sent this month, as last reckoned. Output only; absent for an
  // entry with no budget, or one not yet reckoned.
  EgressSpent egress_spent = 11;
  // The nodes it counts the workloads on, by their labels: set, it counts a workload while it
  // is placed on one of them, by what its placement runs, and is checked when it is bound;
  // absent, it counts the workload from its declaration, wherever it runs ("Where a workload
  // runs", §5.1 of docs/05-scheduling.md).
  LabelSelector nodes = 6;
  // Guaranteed: what the reservations of the workloads it counts may sum to. Sums against the
  // parent's entry of the same shape and is never oversubscribed.
  QuotaBounds reservation_bounds = 7;
  // Sold: what their limits may sum to. May exceed the parent's by the ratio it permits.
  QuotaBounds limit_bounds = 8;
  // What the workloads it counts hold now. Output only; absent until it is first counted.
  QuotaHeld held = 9;
}

// Bounds per quota dimension (§5.1 of docs/05-scheduling.md): a dimension present is bounded
// at its value, zero included, which allows none of it; one absent is not bounded. The numbers
// are those of `Resources` for the same dimension.
message QuotaBounds {
  optional uint64 cpu_millis = 1;
  optional uint64 memory_bytes = 2;
  optional uint64 disk_bytes = 3;
  optional uint64 disk_read_bytes_per_sec = 4;
  optional uint64 disk_write_bytes_per_sec = 5;
  optional uint64 disk_read_ops_per_sec = 6;
  optional uint64 disk_write_ops_per_sec = 7;
  optional uint64 bandwidth_bits_per_sec = 9;
  optional uint64 workloads = 10;
  optional uint64 volumes = 11;
  optional uint64 endpoints = 12;
  optional uint64 dedicated_ipv4 = 13;
  optional uint64 node_ports = 15;
}

// What the workloads a quota entry counts hold together.
message QuotaHeld {
  QuotaBounds reservations = 1;
  // The sums of the limits that are bounded.
  QuotaBounds limits = 2;
  // The dimensions in which some workload holds an unbounded limit, which no finite bound holds.
  repeated string unbounded = 3;
}

// An entry's egress this month.
message EgressSpent {
  // The month, its first instant.
  google.protobuf.Timestamp month = 1;
  uint64 bytes = 2;
  // Whether the budget is spent, and so its workloads held to its egress_exhausted.
  bool exhausted = 3;
  // When it was last reckoned.
  google.protobuf.Timestamp reckoned_at = 4;
}

message EgressExhaustion {
  // A floor rate, not a cut-off, unless `cut_off` is set.
  uint64 floor_bits_per_sec = 1;
  bool cut_off = 2;
}

// Anything that can act (§3.2 of docs/01-model.md).
message Subject {
  oneof kind {
    string user = 1;
    string token = 2;
    ExternalIdentity external = 3;
    string workload = 4;
    string extension = 5;
    // The control plane acting on its own decisions: reconciliation, scheduling.
    SystemActor system = 6;
    // Whoever holds a share link: the bearer of the link-form grant named, which is the grant's
    // own identifier (§6.1 of docs/08-identity.md).
    string link = 7;
    // Whoever presented a credential that opened nothing: the actor of a failed attempt to
    // authenticate, known only by where it came from (§10 of docs/10-api.md). Always true when
    // set; it holds no grant.
    bool anonymous = 8;
  }
}

message ExternalIdentity {
  // The identity provider that verifies it: `org_…/<name>`, the organization it is installed
  // into and its name there, so two providers never vouch for one subject and a provider
  // vouches only at and beneath its organization (§5 of docs/08-identity.md).
  string provider = 1;
  oneof selector {
    // One person.
    string user = 2;
    // A set: a role in a guild, an OIDC group claim, a SAML attribute value.
    ExternalSet set = 3;
  }
}

message ExternalSet {
  // Where the set lives at its provider, never containing ':': a Discord guild id, the OIDC claim
  // or SAML attribute naming the groups. An issuer is the provider's own, so it is not repeated
  // here (§5 of docs/08-identity.md).
  string realm = 1;
  // e.g. role id, claim value.
  string member_of = 2;
}

enum SystemActor {
  SYSTEM_ACTOR_UNSPECIFIED = 0;
  SYSTEM_ACTOR_RECONCILER = 1;
  SYSTEM_ACTOR_SCHEDULER = 2;
  SYSTEM_ACTOR_BOOTSTRAP = 3;
  // The installation's authority, renewing the certificate of a relay it admitted.
  SYSTEM_ACTOR_AUTHORITY = 4;
}

// An organization's brand (§7 of docs/11-surface-web.md): data, applied by the panel to whatever
// it shows of the organization and everything beneath it that sets none of its own. Every field
// is optional; an unset one keeps the panel's own.
message Theme {
  // The name the panel shows for itself: at most 64 characters, one line.
  string product_name = 1;
  Logo logo = 2;
  // The colours for the light scheme, and for the dark.
  ThemeColors light = 3;
  ThemeColors dark = 4;
  // What the sign-in page says above its form: at most 2,000 characters, shown as text.
  string sign_in_text = 5;
  // A stylesheet applied after the panel's own, at most 64 KiB, without @import; the panel's
  // content security policy fences what it may load (§7 of docs/11-surface-web.md).
  string stylesheet = 6;
}

// A logo, carried in the theme so the panel fetches nothing a theme names: PNG, WebP, or SVG,
// at most 256 KiB, shown as an image and never as a document.
message Logo {
  // image/png, image/webp, or image/svg+xml.
  string media_type = 1;
  bytes data = 2;
}

// The panel's colour tokens, each #rrggbb.
message ThemeColors {
  string background = 1;
  string text = 2;
  string muted = 3;
  string line = 4;
  string accent = 5;
  string accent_text = 6;
  string danger = 7;
  string surface = 8;
  string focus = 9;
}

// The theme that applies to an object, and the organization it comes from.
message GoverningTheme {
  // Empty when no organization from the object's up to its root set one: the panel's own.
  Theme theme = 1;
  // The organization that set it. Absent when the panel's own applies.
  optional string set_on = 2;
  // For an organization asked about, the version of its own theme, zero when it has none: what
  // a change must expect.
  uint64 own_version = 3;
}

// A landing screen an organization composes for those it serves (question 2 of §10 of
// docs/11-surface-web.md): the panel's own components in order, each rendered under the viewer's
// own authority, shown to it and to everything beneath it that sets none of its own.
message Layout {
  // The landing screen's heading: at most 64 characters, one line; empty for the panel's own.
  string name = 1;
  // At most 24, the places item exactly once and the quota at most once.
  repeated LayoutItem items = 2;
}

// One component of a layout.
message LayoutItem {
  oneof kind {
    // What the viewer's grants open.
    LayoutPlaces places = 1;
    // The quota of the viewer's top organization, as the viewer reads it.
    LayoutQuota quota = 2;
    // Words from whoever composed the layout, shown as text.
    LayoutNotice notice = 3;
    // A link elsewhere, shown with the host it goes to.
    LayoutLink link = 4;
    // An extension's contribution to a declared slot, by the slot's name: refused until
    // extensions declare slots (§5 of docs/16-extensions.md), since a layout places only what
    // exists.
    string slot = 5;
  }
}

message LayoutPlaces {}

message LayoutQuota {}

message LayoutNotice {
  // 1 to 120 characters, one line.
  string heading = 1;
  // At most 2,000 characters; its line breaks are kept.
  string text = 2;
}

message LayoutLink {
  // 1 to 64 characters, one line.
  string label = 1;
  // An https address with a host and no user information, at most 2,048 bytes.
  string url = 2;
}

// The layout that applies to an object, and the organization it comes from.
message GoverningLayout {
  // Empty when no organization from the object's up to its root set one: the panel's own.
  Layout layout = 1;
  // The organization that set it. Absent when the panel's own applies.
  optional string set_on = 2;
  // For an organization asked about, the version of its own layout, zero when it has none:
  // what a change must expect.
  uint64 own_version = 3;
}
