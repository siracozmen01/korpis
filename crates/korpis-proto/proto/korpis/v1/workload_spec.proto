// SPDX-License-Identifier: Apache-2.0
//
// The parts of a declaration: shape, runtime, resources, volumes, endpoints, health, placement.
// Shape is independent declared fields, not one enum (P7, §2 of docs/01-model.md).

syntax = "proto3";

package korpis.v1;

import "google/protobuf/duration.proto";
import "korpis/v1/common.proto";

enum Lifecycle {
  LIFECYCLE_UNSPECIFIED = 0;
  LIFECYCLE_PERSISTENT = 1;
  LIFECYCLE_TASK = 2;
  LIFECYCLE_SCHEDULED = 3;
}

enum ConsoleMode {
  CONSOLE_MODE_UNSPECIFIED = 0;
  CONSOLE_MODE_NONE = 1;
  CONSOLE_MODE_LOGS = 2;
  CONSOLE_MODE_INTERACTIVE = 3;
  CONSOLE_MODE_SERIAL = 4;
}

enum IsolationTier {
  ISOLATION_TIER_UNSPECIFIED = 0;
  ISOLATION_TIER_PROCESS = 1;
  ISOLATION_TIER_CONTAINER = 2;
  ISOLATION_TIER_MICROVM = 3;
  ISOLATION_TIER_VM = 4;
}

// Driver, tier, and driver-specific configuration validated against the driver's own schema.
// The limits of a workload's console stream (§5 of docs/14-streams.md), enforced where it is
// written. Zero is the default; the stream's retention counts against the workload's disk quota.
message StreamSpec {
  // Bytes a second admitted on average; what exceeds it is dropped and recorded as a gap.
  uint64 rate_bytes_per_sec = 1;
  // Bytes admitted at once after a quiet period; at least one largest record (64 KiB).
  uint64 burst_bytes = 2;
  oneof retention {
    // Sealed segments older than this are pruned.
    google.protobuf.Duration retention_duration = 3;
    // Sealed segments beyond this many bytes are pruned, oldest first.
    uint64 retention_bytes = 4;
  }
  // How long an offloaded segment is kept in the repository that took it, from when it was
  // offloaded (§4 of docs/14-streams.md); 30 days when unset. The operator's disclosed floor
  // raises it where it is lower (§8 of docs/17-security.md).
  google.protobuf.Duration offload_retention = 5;
}

// What a run due while another of the workload's is active does (§4.3 of
// docs/05-scheduling.md). Unspecified is forbid.
enum Concurrency {
  CONCURRENCY_UNSPECIFIED = 0;
  // It is recorded missed, and the active one goes on.
  CONCURRENCY_FORBID = 1;
  // The active one is cancelled, and it is made.
  CONCURRENCY_REPLACE = 2;
  // It is made beside the active one.
  CONCURRENCY_ALLOW = 3;
}

// How a task or scheduled workload's runs are made, ended, and kept (§4 of
// docs/05-scheduling.md). A field left unset is its default.
message RunPolicy {
  Concurrency concurrency = 1;
  // How many times a failed run is tried again; none when unset, at most 100.
  optional uint32 retries = 2;
  // Before the first retry, each later one twice the one before; ten seconds when unset.
  google.protobuf.Duration backoff = 3;
  // How long a run may take before its node stops it; unbounded when unset.
  google.protobuf.Duration timeout = 4;
  // How many succeeded runs are kept; three when unset, at most 1000.
  optional uint32 keep_successful = 5;
  // How many runs that ended any other way are kept; ten when unset, at most 1000.
  optional uint32 keep_failed = 6;
  // Whether occurrences missed while the control plane was down are run, oldest first.
  bool catch_up = 7;
  // The most runs active at once under `allow`, 10 when unset, at most 100; one under `forbid`
  // and `replace`. A run due past it is recorded missed, cause `concurrency` (§4.3 of
  // docs/05-scheduling.md).
  optional uint32 max_active = 8;
}

message RuntimeSpec {
  // e.g. "oci", "firecracker".
  string driver = 1;
  IsolationTier tier = 2;
  map<string, Value> config = 3;
}

// Reservation and limit are different numbers (§5.2 of docs/05-scheduling.md).
message ResourceSpec {
  CpuSpec cpu = 1;
  ReservedLimit memory = 2;
  ReservedLimit disk = 3;
  IoSpec io = 4;
  BandwidthSpec bandwidth = 5;
  PidsSpec pids = 6;
}

message CpuSpec {
  // Millicores.
  uint64 reservation_millis = 1;
  uint64 limit_millis = 2;
  CpuIsolation isolation = 3;
}

enum CpuIsolation {
  CPU_ISOLATION_UNSPECIFIED = 0;
  CPU_ISOLATION_SHARED = 1;
  // Whole cores, excluded from every other workload's cpuset.
  CPU_ISOLATION_DEDICATED_CORES = 2;
}

message ReservedLimit {
  uint64 reservation = 1;
  uint64 limit = 2;
}

// Ceilings and a proportional share; IO has no reservation (§5.2 of docs/05-scheduling.md).
message IoSpec {
  uint64 read_bytes_per_sec = 1;
  uint64 write_bytes_per_sec = 2;
  uint64 read_ops_per_sec = 3;
  uint64 write_ops_per_sec = 4;
  // Relative weight, 1 to 10000.
  uint32 share = 5;
}

message BandwidthSpec {
  // Bits per second.
  ReservedLimit egress = 1;
  // A limit only; no node can guarantee inbound bandwidth.
  uint64 ingress_limit = 2;
}

message PidsSpec {
  uint64 limit = 1;
}

message VolumeSpec {
  string name = 1;
  // Mount path inside the workload.
  string path = 2;
  uint64 size_bytes = 3;
  string storage_class = 4;
  VolumeMode mode = 5;
  // Attach an existing volume instead of creating one.
  optional string existing = 6;
  // Create it holding what this backup held, restored before the workload first runs on it;
  // never with `existing`. Reading the backup takes backup.read on its workload.
  optional string from_backup = 7;
}

enum VolumeMode {
  VOLUME_MODE_UNSPECIFIED = 0;
  VOLUME_MODE_RW = 1;
  VOLUME_MODE_RO = 2;
  VOLUME_MODE_SHARED = 3;
}

enum EndpointProtocol {
  ENDPOINT_PROTOCOL_UNSPECIFIED = 0;
  ENDPOINT_PROTOCOL_TCP = 1;
  ENDPOINT_PROTOCOL_UDP = 2;
  ENDPOINT_PROTOCOL_HTTP = 3;
  ENDPOINT_PROTOCOL_HTTPS = 4;
  ENDPOINT_PROTOCOL_QUIC = 5;
}

// How the network reaches a workload (§3 of docs/07-networking.md).
enum Exposure {
  EXPOSURE_UNSPECIFIED = 0;
  EXPOSURE_NODE_PORT = 1;
  EXPOSURE_NODE_BOUND = 2;
  EXPOSURE_STABLE = 3;
  EXPOSURE_INGRESS = 4;
  EXPOSURE_DEDICATED_IP = 5;
  EXPOSURE_OVERLAY_ONLY = 6;
  EXPOSURE_NONE = 7;
}

message EndpointSpec {
  string name = 1;
  EndpointProtocol protocol = 2;
  uint32 container_port = 3;
  Exposure exposure = 4;
  repeated string domains = 5;
  TlsSpec tls = 6;
  NetworkPolicy policy = 7;
  bool accounting = 8;
  ShapingSpec shaping = 9;
}

message TlsSpec {
  TlsSource source = 1;
  // For TLS_SOURCE_PROVIDED: the secret holding the certificate and key.
  string secret = 2;
}

enum TlsSource {
  TLS_SOURCE_UNSPECIFIED = 0;
  TLS_SOURCE_ACME = 1;
  TLS_SOURCE_PROVIDED = 2;
  TLS_SOURCE_PASSTHROUGH = 3;
}

// An endpoint's network policy: who may connect to it, and how many at once.
message NetworkPolicy {
  // Who may connect, in order; the first rule that matches decides, and a connection no rule
  // matches is let in.
  repeated NetworkRule ingress = 1;
  // Refused when set. Corrected 2026-10-15: a workload's outbound connections leave from no
  // endpoint, so no node could judge a packet by an endpoint's rule; they are IntentBody.egress
  // (§6 of docs/07-networking.md). Kept because the schema is frozen (rule E).
  repeated NetworkRule egress = 2;
  // Limits on the connections made to it.
  ConntrackLimits conntrack = 3;
}

// Where a workload may connect out, beyond the egress default (§6 of docs/07-networking.md).
message EgressPolicy {
  // In order; the first that matches decides. A deny holds anywhere; an allow lets the
  // connection on to the egress default, which decides the rest.
  repeated NetworkRule rules = 1;
  // Limits on the connections it opens; each may lower the default and not raise it.
  ConntrackLimits limits = 2;
}

message NetworkRule {
  NetworkAction action = 1;
  oneof peer {
    string cidr = 2;
    LabelSelector workloads = 3;
    string domain = 4;
  }
  repeated PortRange ports = 5;
  EndpointProtocol protocol = 6;
}

enum NetworkAction {
  NETWORK_ACTION_UNSPECIFIED = 0;
  NETWORK_ACTION_ALLOW = 1;
  NETWORK_ACTION_DENY = 2;
}

message PortRange {
  uint32 first = 1;
  uint32 last = 2;
}

message ConntrackLimits {
  uint32 max_connections = 1;
  uint32 new_per_sec = 2;
  uint32 max_half_open = 3;
}

message ShapingSpec {
  uint64 egress_bits_per_sec = 1;
  uint64 ingress_bits_per_sec = 2;
}

// Health is application-level (Rule K-16, §5 of docs/04-runtimes.md).
message HealthSpec {
  Probe readiness = 1;
  Probe liveness = 2;
}

message Probe {
  oneof kind {
    TcpProbe tcp = 1;
    HttpProbe http = 2;
    QueryProbe query = 3;
    ExecProbe exec = 4;
    GuestAgentProbe guest_agent = 5;
    ExitProbe exit = 6;
    HeartbeatProbe heartbeat = 7;
  }
  google.protobuf.Duration period = 8;
  google.protobuf.Duration timeout = 9;
  uint32 failures = 10;
  google.protobuf.Duration initial_delay = 11;
}

message TcpProbe {
  string endpoint = 1;
}

message HttpProbe {
  string endpoint = 1;
  string path = 2;
  uint32 expect_status = 3;
}

message QueryProbe {
  // The query protocol, provided by an extension, e.g. "minecraft".
  string protocol = 1;
  string endpoint = 2;
}

message ExecProbe {
  repeated string command = 1;
}

message GuestAgentProbe {}

message ExitProbe {
  repeated int32 success_codes = 1;
}

message HeartbeatProbe {
  google.protobuf.Duration max_interval = 1;
}

// Constraints and preferences for placement (§2 of docs/05-scheduling.md).
message PlacementSpec {
  LabelSelector node_selector = 1;
  repeated Toleration tolerations = 2;
  repeated AffinityRule affinity = 3;
  string preferred_region = 4;
}

message Toleration {
  string key = 1;
  string value = 2;
}

message AffinityRule {
  bool anti = 1;
  bool required = 2;
  LabelSelector workloads = 3;
  // e.g. "rack", "region", "host".
  string topology_key = 4;
}

// A dependency declared explicitly, so the graph is visible to the scheduler and to plans (§5
// of docs/07-networking.md). Its current address is injected at start.
message Dependency {
  // Names what is injected: KORPIS_DEP_<NAME>_HOST, _PORT, and _ADDRESSES, and
  // /run/korpis/deps/<name>.json (§5 of docs/07-networking.md).
  // Lowercase letters, digits, and underscores, starting with a letter; unique in the body.
  string name = 1;
  // What it reaches: a workload or an endpoint by identifier, or the workloads a selector
  // matches within the dependent's project.
  oneof target {
    string workload = 2;
    string endpoint = 3;
    LabelSelector selector = 4;
  }
  DependencyInjection inject = 5;
  // Start only once the dependency is healthy.
  bool required = 6;
}

enum DependencyInjection {
  // Both.
  DEPENDENCY_INJECTION_UNSPECIFIED = 0;
  DEPENDENCY_INJECTION_ENV = 1;
  DEPENDENCY_INJECTION_FILE = 2;
  DEPENDENCY_INJECTION_BOTH = 3;
}

// What a workload does when its lease ends and cannot be renewed (§4.5 of
// docs/02-architecture.md).
message ContinuitySpec {
  OnLeaseExpiry on_lease_expiry = 1;
}

enum OnLeaseExpiry {
  // Derived from the attached volumes' storage classes: stop if any is multi-node-attachable.
  ON_LEASE_EXPIRY_UNSPECIFIED = 0;
  ON_LEASE_EXPIRY_KEEP_RUNNING = 1;
  ON_LEASE_EXPIRY_STOP = 2;
}
