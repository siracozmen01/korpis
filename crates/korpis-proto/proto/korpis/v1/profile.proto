syntax = "proto3";

package korpis.v1;

import "google/protobuf/timestamp.proto";
import "korpis/v1/account.proto";
import "korpis/v1/authority.proto";

// The signed-in user's own account (§9.6 of docs/08-identity.md): its factors, read and changed.
// Called with an access token, as any call is, and only by a user signed in to a session; an API
// token is refused. Every change also needs a recent sign-in, the session's sign-in or its last
// re-authentication within ten minutes, or is refused CONFLICT with the reason
// `session.not_recent`, and the client re-authenticates with a factor first. Two rules hold after
// every change, and a change that would break one is refused CONFLICT `account.last_factor`:
// something can still sign in, and a password has a passkey or TOTP beside it. Like the
// ceremonies of AccountService, no change carries an idempotency key (§6 of docs/10-api.md): each
// spends a single-use proof or leaves the account as it found it when retried.
service ProfileService {
  // The caller's account and the factors it holds.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Re-authenticates the session with a passkey's answer to a challenge of
  // AccountService.BeginSignIn; the passkey must be the caller's.
  rpc ReauthenticateWithPasskey(SignInWithPasskeyRequest) returns (ReauthenticateResponse);
  // Re-authenticates the session with the caller's password and a TOTP code or a recovery code
  // beside it; refused and limited as a sign-in is (§10 of docs/10-api.md).
  rpc ReauthenticateWithPassword(ReauthenticateWithPasswordRequest)
      returns (ReauthenticateResponse);
  // Begins registering another passkey: the options of `navigator.credentials.create`.
  rpc BeginAddPasskey(BeginAddPasskeyRequest) returns (BeginAddPasskeyResponse);
  // Adds the passkey the browser registered.
  rpc AddPasskey(AddPasskeyRequest) returns (AddPasskeyResponse);
  // Removes one of the caller's passkeys.
  rpc RemovePasskey(RemovePasskeyRequest) returns (RemovePasskeyResponse);
  // Sets the caller's password, replacing any.
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);
  // Removes the caller's password.
  rpc RemovePassword(RemovePasswordRequest) returns (RemovePasswordResponse);
  // Enrols a TOTP secret AccountService.OfferTotp gave, replacing any, confirmed by a code.
  rpc EnrolTotp(EnrolTotpRequest) returns (EnrolTotpResponse);
  // Removes the caller's TOTP factor.
  rpc RemoveTotp(RemoveTotpRequest) returns (RemoveTotpResponse);
  // Replaces the caller's recovery codes with ten fresh ones, shown once.
  rpc RenewRecoveryCodes(RenewRecoveryCodesRequest) returns (RenewRecoveryCodesResponse);
  // The caller's SSH keys, for SFTP (§9.9 of docs/08-identity.md); a confined session sees those
  // registered confined as it is.
  rpc ListSshKeys(ListSshKeysRequest) returns (ListSshKeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Registers an SSH public key; refused ssh_key.taken where it is registered already.
  rpc AddSshKey(AddSshKeyRequest) returns (AddSshKeyResponse);
  // Removes one of the caller's SSH keys; the sessions it opened end when their tokens renew.
  rpc RemoveSshKey(RemoveSshKeyRequest) returns (RemoveSshKeyResponse);
}

// An SSH key as its holder sees it; its public half, never shown again but by its fingerprint.
message ProfileSshKey {
  // `ssk_…`.
  string id = 1;
  string label = 2;
  // `ssh-ed25519`, `ecdsa-sha2-nistp256`, `ecdsa-sha2-nistp384`, or `ssh-rsa`.
  string kind = 3;
  // As `ssh-keygen -l` prints it: `SHA256:` and the digest in base64.
  string fingerprint = 4;
  google.protobuf.Timestamp added_at = 5;
  // Unset until a file session is first authorized with it.
  google.protobuf.Timestamp last_used_at = 6;
  // The organization the session that registered it was confined beneath, which confines what
  // it opens; absent where it was not.
  optional string within = 7;
}

message ListSshKeysRequest {}

message ListSshKeysResponse {
  repeated ProfileSshKey keys = 1;
}

message AddSshKeyRequest {
  // A line as `ssh-keygen` writes it: the kind, the key in base64, and a comment, which is not
  // kept. Ed25519, ECDSA over P-256 or P-384, or RSA of 3,072 to 16,384 bits.
  string key = 1;
  // At most 64 characters.
  string label = 2;
}

message AddSshKeyResponse {
  ProfileSshKey key = 1;
}

message RemoveSshKeyRequest {
  string id = 1;
}

message RemoveSshKeyResponse {}

message GetProfileRequest {}

message ProfilePasskey {
  bytes credential_id = 1;
  string label = 2;
  google.protobuf.Timestamp created_at = 3;
  // Unset until it first signs in.
  google.protobuf.Timestamp last_used_at = 4;
  // Whether the authenticator may copy it to the holder's other devices.
  bool backup_eligible = 5;
}

message GetProfileResponse {
  // As `usr_…`.
  string account = 1;
  // The sign-in name.
  string name = 2;
  string display_name = 3;
  repeated ProfilePasskey passkeys = 4;
  bool password = 5;
  bool totp = 6;
  // How many recovery codes are unused.
  uint32 recovery_codes = 7;
  // When the session last signed in or re-authenticated; a change needs it within ten minutes.
  google.protobuf.Timestamp authenticated_at = 8;
  // For a person signed in through an identity provider (§9.7 of docs/08-identity.md): their own
  // binding, naming the provider and the subject it vouches for. Every field above but
  // `authenticated_at` is then empty, since such a person holds no account and no factors here.
  IdentityBinding person = 9;
}

message ReauthenticateWithPasswordRequest {
  string password = 1;
  oneof second {
    string totp_code = 2;
    string recovery_code = 3;
  }
}

message ReauthenticateResponse {
  google.protobuf.Timestamp authenticated_at = 1;
}

message BeginAddPasskeyRequest {}

message BeginAddPasskeyResponse {
  PasskeyCreation creation = 1;
}

message AddPasskeyRequest {
  PasskeyRegistration registration = 1;
}

message AddPasskeyResponse {}

message RemovePasskeyRequest {
  bytes credential_id = 1;
}

message RemovePasskeyResponse {}

message SetPasswordRequest {
  // At least 12 characters and at most 1024 bytes.
  string password = 1;
}

message SetPasswordResponse {}

message RemovePasswordRequest {}

message RemovePasswordResponse {}

message EnrolTotpRequest {
  // The secret OfferTotp gave.
  bytes secret = 1;
  // A code the authenticator app shows now.
  string code = 2;
}

message EnrolTotpResponse {}

message RemoveTotpRequest {}

message RemoveTotpResponse {}

message RenewRecoveryCodesRequest {}

message RenewRecoveryCodesResponse {
  // Ten codes, each a second factor once; the ones they replace no longer work.
  repeated string recovery_codes = 1;
}
