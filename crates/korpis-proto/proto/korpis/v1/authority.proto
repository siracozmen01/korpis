// SPDX-License-Identifier: Apache-2.0
//
// Authority: grants, conditions, delegation, templates, and identity bindings (§3.2 of
// docs/01-model.md, §3 to §6 of docs/08-identity.md). There are no roles.

syntax = "proto3";

package korpis.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "korpis/v1/common.proto";
import "korpis/v1/tenancy.proto";

// The only authority primitive. A grant can never exceed its parent (§3.2 of
// docs/08-identity.md), and every authority traces to a root grant.
message Grant {
  string id = 1;
  Subject subject = 2;
  // Action names from the vocabulary of §5 of docs/10-api.md, or "ext.<extension>.<action>".
  repeated string actions = 3;
  Scope scope = 4;
  Conditions conditions = 5;
  // The grant this was attenuated from. Absent only for a root grant.
  optional string parent = 6;
  DelegationPolicy delegation = 7;
  Subject issued_by = 8;
  // Present when issued by a member exercising a set grant (§5.1 of docs/08-identity.md).
  SetMemberIssue via = 9;
  // Provenance only; no authorization decision reads it.
  optional TemplateRef from_template = 10;
  google.protobuf.Timestamp issued_at = 11;
  google.protobuf.Timestamp revoked_at = 12;
  // A link-form grant is redeemed by bearer and can never delegate (§6.1 of
  // docs/08-identity.md).
  bool link_form = 13;
  // State as computed by the control plane; never written by a client.
  GrantState state = 14;
  // What the grant is for, for the people who read it later ("github actions ·
  // korpis-community/servers"). Provenance only; no authorization decision reads it.
  string label = 15;
}

enum GrantState {
  GRANT_STATE_UNSPECIFIED = 0;
  GRANT_STATE_ISSUED = 1;
  GRANT_STATE_EXPIRED = 2;
  GRANT_STATE_EXHAUSTED = 3;
  GRANT_STATE_REVOKED = 4;
  // Rooted in an external binding that failed re-verification (§5.1 of docs/08-identity.md).
  GRANT_STATE_SUSPENDED = 5;
}

message SetMemberIssue {
  ExternalIdentity set = 1;
  ExternalIdentity member = 2;
}

message TemplateRef {
  string template = 1;
  uint64 version = 2;
}

// Where a grant applies. Containment (§3.3 of docs/08-identity.md):
// volume, endpoint, stream ⊑ workload ⊑ project ⊑ organization ⊑ any ancestor organization;
// a selector within P ⊑ P.
message Scope {
  oneof kind {
    string organization = 1;
    string project = 2;
    string workload = 3;
    string volume = 4;
    string endpoint = 5;
    string stream = 6;
    string node = 7;
    SelectorScope selector = 8;
    string repository = 9;
    // A domain an organization holds (§3.2 of docs/07-networking.md).
    string domain = 10;
    // A certificate an organization holds for the ingress (§3.2 of docs/07-networking.md).
    string certificate = 11;
    // A portal, a name the control plane answers under for an organization (§3.6 of
    // docs/07-networking.md).
    string portal = 12;
  }
}

// Every object inside `within` that the selector matches at evaluation time (§3.4 of
// docs/08-identity.md).
message SelectorScope {
  Scope within = 1;
  LabelSelector selector = 2;
}

// Every condition narrows; a child's are at least as restrictive as its parent's.
message Conditions {
  google.protobuf.Timestamp expires_at = 1;
  google.protobuf.Timestamp not_before = 2;
  // Absent means unrestricted. Checked at the gateway and at the relay.
  repeated string source_cidr = 3;
  bool requires_mfa = 4;
  // This grant can propose, not apply; approvers hold plan.approve over a scope containing it
  // (§3.6 of docs/08-identity.md).
  Scope requires_approval_by = 5;
  // Redeemed online (§6.2 of docs/08-identity.md).
  optional uint64 max_uses = 6;
  // Only the records of a workload's stream written in this range, by the node's clock, may be
  // read under it; a grant carrying one permits nothing but workload.console.read (§8 of
  // docs/14-streams.md).
  TimeRange stream_range = 7;
}

// A span of time: from included, to excluded.
message TimeRange {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}

// Whether, how deep, and with which actions a grant may be attenuated into children (§3.2 of
// docs/08-identity.md). Delegating is a property of the grant, not an action.
message DelegationPolicy {
  bool allowed = 1;
  // How many further levels may exist beneath this grant. Absent means unbounded, which only a
  // root grant created at installation may hold.
  optional uint32 max_depth = 2;
  // Which of this grant's actions a child may carry; a subset of the grant's actions.
  repeated string actions = 3;
}

// A named, versioned request for a grant, owned by an organization and offered to its subtree.
// A role in the interface, not in the model (§4 of docs/08-identity.md): applying one attenuates
// a grant the issuer holds, and no authorization decision reads it.
message GrantTemplate {
  reserved 7;
  string id = 1;
  // The owner, to whose subtree it is offered.
  string organization = 2;
  string name = 3;
  // 1 when made, one more at every edit; each version is kept, and a grant issued from the
  // template names the version it came from as provenance, which authorization never reads.
  uint64 version = 4;
  repeated string actions = 5;
  ScopePattern scope_pattern = 6;
  // Required: a template must say whether its grants may delegate.
  DelegationPolicy delegation = 8;
  // Defaults, overridable at issue.
  TemplateConditions conditions = 9;
  // Who made this version, and when.
  Subject updated_by = 10;
  google.protobuf.Timestamp updated_at = 11;
  // Set once retired: offered nowhere, kept for provenance.
  google.protobuf.Timestamp retired_at = 12;
}

// Where a grant from a template applies, given the object it is applied to.
message ScopePattern {
  reserved 1, 2, 3;
  // ORGANIZATION, PROJECT, or WORKLOAD; unspecified for any of the three.
  ObjectKind kind = 4;
  // With an organization or a project: the workloads below it carrying these labels.
  LabelSelector selector = 5;
}

// A template's default conditions, relative because a template outlives any instant.
message TemplateConditions {
  // A grant from it expires this long after it is issued.
  google.protobuf.Duration lifetime = 1;
  repeated string source_cidr = 2;
  bool requires_mfa = 3;
  optional uint64 max_uses = 4;
}

// How an external identity maps to a subject (§5 of docs/08-identity.md, the one definition).
// A binding grants nothing: it says which provider vouches for its subject, how often that is
// re-checked, and, for a set, what its members receive.
message IdentityBinding {
  string id = 1;
  // The identity provider that verifies it: its name among the identity providers installed
  // into `organization`. The subject's provider is `org_…/<name>`, the two together.
  string provider = 2;
  ExternalIdentity subject = 3;
  // A person or a set, as the subject says.
  BindingKind kind = 4;
  BindingOrigin created_by = 5;
  // For a set: the template every grant to it is issued from, at this version (§3.4 of
  // docs/08-identity.md). Without one, a grant to the set may not delegate.
  optional TemplateRef template = 6;
  BindingConstraints constraints = 7;
  // Between one minute and one day; fifteen minutes when not said.
  google.protobuf.Duration reverify_interval = 8;
  // As evaluation finds it when read: unverified once its last confirmation, interval, and grace
  // have passed, though no re-verification has recorded that yet (§5.1 of docs/08-identity.md).
  BindingState state = 9;
  // Absent until its provider first confirms it.
  google.protobuf.Timestamp last_verified_at = 10;
  // The organization its provider is installed into, where it is declared; it vouches only
  // there and beneath.
  string organization = 11;
  // For a set: an operator deliberately let grants to it carry irreversible actions (§5.2 of
  // docs/08-identity.md).
  bool allows_irreversible = 12;
  // 1 when made, one more at every change; an edit names the version it was made against.
  uint64 version = 13;
  Subject made_by = 14;
  google.protobuf.Timestamp made_at = 15;
  // It vouches for nothing since, and its subject may be bound again.
  google.protobuf.Timestamp retired_at = 16;
}

enum BindingKind {
  BINDING_KIND_UNSPECIFIED = 0;
  BINDING_KIND_INDIVIDUAL = 1;
  BINDING_KIND_SET = 2;
}

enum BindingOrigin {
  BINDING_ORIGIN_UNSPECIFIED = 0;
  BINDING_ORIGIN_OPERATOR = 1;
  BINDING_ORIGIN_FIRST_USE = 2;
}

enum BindingState {
  BINDING_STATE_UNSPECIFIED = 0;
  BINDING_STATE_VERIFIED = 1;
  BINDING_STATE_UNVERIFIED = 2;
}

message BindingConstraints {
  // For a set: other sets at the same provider its members must also be in, checked when a
  // member acts through the set against the sets the provider has just asserted they are in
  // (§5.2 of docs/08-identity.md), and asked of the provider at every re-verification.
  repeated ExternalSet require_membership = 1;
  // How long an unreachable provider extends the binding past its interval before its grants
  // are suspended (§5.1 of docs/08-identity.md): at most one hour; fifteen minutes when not
  // said.
  google.protobuf.Duration grace = 2;
}
