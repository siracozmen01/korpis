service PlanService {
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // A plan waiting for authority (proposed under requires_approval_by) needs plan.approve by a
  // subject other than the proposer (§3.6 of docs/08-identity.md). A plan waiting only for
  // confirmation may be confirmed by its proposer (§3.3 of docs/01-model.md).
  rpc ApprovePlan(ApprovePlanRequest) returns (ApprovePlanResponse);
  rpc RejectPlan(RejectPlanRequest) returns (RejectPlanResponse);
  // plan.cancel: lowers `through` on the nodes executing it (§7 of docs/03-state.md).
  rpc CancelPlan(CancelPlanRequest) returns (CancelPlanResponse);
}

message GetPlanRequest {
  string id = 1;
  Consistency consistency = 2;
}

message GetPlanResponse {
  Plan plan = 1;
}

message ListPlansRequest {
  string workload = 1;
  PageRequest page = 2;
}

message ListPlansResponse {
  repeated Plan plans = 1;
  PageResponse page = 2;
}

message ApprovePlanRequest {
  Mutation mutation = 1;
  string plan = 2;
  // Approve now, apply in a window.
  google.protobuf.Timestamp apply_after = 3;
}

message ApprovePlanResponse {
  Plan plan = 1;
  Consistency consistency = 2;
}

message RejectPlanRequest {
  Mutation mutation = 1;
  string plan = 2;
  string reason = 3;
}

message RejectPlanResponse {
  Plan plan = 1;
  Consistency consistency = 2;
}

message CancelPlanRequest {
  Mutation mutation = 1;
  string plan = 2;
}

message CancelPlanResponse {
  Plan plan = 1;
  Consistency consistency = 2;
}

service EffectService {
  // The effect log, filtered to what the caller may read.
  rpc ListEffects(ListEffectsRequest) returns (ListEffectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message ListEffectsRequest {
  // Exactly one of the five: what the effects are about. An organization asks for its whole
  // subtree, and each effect is answered only to a caller who may read its object (§4 of
  // docs/15-observability.md).
  optional string workload = 1;
  optional string plan = 2;
  optional string node = 3;
  optional string organization = 6;
  optional string project = 7;
  google.protobuf.Timestamp since = 4;
  // Only effects whose action begins with this, such as `grant.` or `workload.restart`.
  string action_prefix = 8;
  PageRequest page = 5;
}

message ListEffectsResponse {
  repeated Effect effects = 1;
  PageResponse page = 2;
}

service NodeService {
  // node.enroll over the organization: a one-time token the agent exchanges for its node
  // identity (§3 of docs/18-operations.md). The token is a Token subject holding a grant of
  // node.enroll attenuated from the caller's, with max_uses 1 (§7 of docs/02-architecture.md).
  rpc CreateEnrollmentToken(CreateEnrollmentTokenRequest) returns (CreateEnrollmentTokenResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // node.cordon, both ways.
  rpc CordonNode(CordonNodeRequest) returns (CordonNodeResponse);
  rpc UncordonNode(UncordonNodeRequest) returns (UncordonNodeResponse);
  // node.remove, irreversible: decommissions a node for good, its key opening nothing and its
  // session ended (§3 of docs/18-operations.md). Refused unless it is cordoned and holds no
  // workload and no volume, except as `compromised`, which removes it whatever it holds and
  // places each of its workloads again from its target (§9 of docs/17-security.md).
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
  // node.enroll over the root organization: a one-time token a relay exchanges for its identity
  // and its certificate (§3.1 of docs/02-architecture.md). A relay carries every organization's
  // sessions, so only authority over the root enrolls one.
  rpc CreateRelayEnrollmentToken(CreateRelayEnrollmentTokenRequest)
      returns (CreateRelayEnrollmentTokenResponse);
  // node.read over the root organization: every relay, removed ones included.
  rpc ListRelays(ListRelaysRequest) returns (ListRelaysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // node.enroll over the root organization. A removed relay is named to no node and told
  // nothing more.
  rpc RemoveRelay(RemoveRelayRequest) returns (RemoveRelayResponse);
  // node.enroll over the root organization: a relay a restore held is fed and named to nodes
  // again (§6 of docs/18-operations.md). Refused unless it is held and not removed.
  rpc ReadmitRelay(ReadmitRelayRequest) returns (ReadmitRelayResponse);
}

message CreateRelayEnrollmentTokenRequest {
  Mutation mutation = 1;
  // The root organization.
  string organization = 2;
  // The relay's name, unique in the installation.
  string name = 3;
  // Where clients and nodes will reach it, https://host[:port]; its certificate names the host.
  string url = 4;
  // How long the token may be redeemed; absent is one hour, and at most a day.
  google.protobuf.Duration expires_in = 5;
}

message CreateRelayEnrollmentTokenResponse {
  // Shown once and never stored, as an agent's enrollment token is.
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  // sha256: of the DER of the certificate authority the relay pins when it joins.
  string ca_fingerprint = 3;
}

message ListRelaysRequest {
  string organization = 1;
}

message ListRelaysResponse {
  repeated Relay relays = 1;
}

message RemoveRelayRequest {
  Mutation mutation = 1;
  string organization = 2;
  string relay = 3;
}

message RemoveRelayResponse {
  Relay relay = 1;
}

message ReadmitRelayRequest {
  Mutation mutation = 1;
  string organization = 2;
  string relay = 3;
}

message ReadmitRelayResponse {
  Relay relay = 1;
}

// A relay running as its own process (§3.1 of docs/02-architecture.md).
message Relay {
  string id = 1;
  string name = 2;
  string url = 3;
  google.protobuf.Timestamp joined_at = 4;
  // When the certificate the control plane last issued it expires.
  google.protobuf.Timestamp certificate_expires_at = 5;
  google.protobuf.Timestamp removed_at = 6;
  // When its feed was last served, to within thirty seconds; absent before the first.
  google.protobuf.Timestamp last_seen_at = 7;
  // Whether its feed was served within the last ninety seconds: the relay is running and
  // verifying by what it is sent.
  bool connected = 8;
  // When a restore held it: its feed is answered as unavailable and it is named to no node until
  // it is readmitted or removed (§6 of docs/18-operations.md).
  google.protobuf.Timestamp held_at = 9;
}

message CreateEnrollmentTokenRequest {
  Mutation mutation = 1;
  // The node's name, unique in the installation, and its labels: bound to the token, so the
  // node enrolled with it has them whatever the agent says.
  string node_name = 2;
  map<string, string> labels = 3;
  // The organization the node will belong to and serve, with every organization below it.
  string organization = 4;
  // How long the token may be redeemed; absent is one hour, and at most a day.
  google.protobuf.Duration expires_in = 5;
}

message CreateEnrollmentTokenResponse {
  // Shown once and never stored. A replay of the same mutation returns the response without
  // it: a secret recorded for replay would be a secret stored (§6 of docs/10-api.md).
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  // sha256: of the DER of the certificate authority the agent pins at enrollment (§3 of
  // docs/18-operations.md), so the join command can carry it and the first connection is
  // verified rather than trusted.
  string ca_fingerprint = 3;
}

message GetNodeRequest {
  string id = 1;
}

message GetNodeResponse {
  Node node = 1;
}

// The nodes one organization owns; node.read over it.
message ListNodesRequest {
  LabelSelector selector = 1;
  PageRequest page = 2;
  string organization = 3;
}

message ListNodesResponse {
  repeated Node nodes = 1;
  PageResponse page = 2;
}

message RemoveNodeRequest {
  Mutation mutation = 1;
  string node = 2;
  bool compromised = 3;
}

message RemoveNodeResponse {
  Node node = 1;
}

message CordonNodeRequest {
  Mutation mutation = 1;
  string node = 2;
}

message CordonNodeResponse {
  Node node = 1;
}

message UncordonNodeRequest {
  Mutation mutation = 1;
  string node = 2;
}

message UncordonNodeResponse {
  Node node = 1;
}

service GrantService {
  // Attenuate a grant the caller holds into a child (§3.2 of docs/08-identity.md). Needs no
  // action: only the parent's delegation policy.
  rpc IssueGrant(IssueGrantRequest) returns (IssueGrantResponse);
  // grant.read.
  rpc GetGrant(GetGrantRequest) returns (GetGrantResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // grant.revoke, or the issuer of the grant or an ancestor (§3.5 of docs/08-identity.md).
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);
  // A capability token for a grant the caller holds, attenuated to what the call needs.
  rpc MintToken(MintTokenRequest) returns (MintTokenResponse);
  // template.write on its organization (§4 of docs/08-identity.md).
  rpc CreateGrantTemplate(CreateGrantTemplateRequest) returns (CreateGrantTemplateResponse);
  // template.write on its organization, against the version read: a new version.
  rpc UpdateGrantTemplate(UpdateGrantTemplateRequest) returns (UpdateGrantTemplateResponse);
  // template.write on its organization: offered nowhere since, kept for provenance.
  rpc RetireGrantTemplate(RetireGrantTemplateRequest) returns (RetireGrantTemplateResponse);
  // A template, or one of its versions: org.read on its owner, or, with `at`, reading an object
  // it is offered at.
  rpc GetGrantTemplate(GetGrantTemplateRequest) returns (GetGrantTemplateResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The templates offered at an object, owned by it or any organization above it: reading the
  // object. With `owned`, the templates of one organization, retired ones too: org.read on it.
  rpc ListGrantTemplates(ListGrantTemplatesRequest) returns (ListGrantTemplatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message IssueGrantRequest {
  Mutation mutation = 1;
  // The grant to attenuate; the caller must hold it. Empty: the one grant the caller holds that
  // this attenuation is valid from, refused when there are several (§3.2 of
  // docs/08-identity.md).
  string parent = 2;
  // Who holds it. Absent exactly when `to_new_token` is set.
  Subject subject = 3;
  repeated string actions = 4;
  Scope scope = 5;
  Conditions conditions = 6;
  DelegationPolicy delegation = 7;
  bool link_form = 8;
  // Provenance only; required with `to_new_token`, which it names.
  string label = 9;
  // Issue to an API token created in the same transaction, which exists only to hold this grant
  // and expires with it (§3.7 of docs/08-identity.md).
  bool to_new_token = 10;
  // Issue to an account created in the same transaction, holding this grant and no factor, with
  // an invitation to register its first (§9.6 of docs/08-identity.md). Exclusive with
  // `subject`, `to_new_token`, and `link_form`.
  NewUser to_new_user = 11;
  // Issue from this version of a grant template (§4 of docs/08-identity.md): the template says
  // the actions, the delegation, and the scope, from the object `scope` names, so `actions` and
  // `delegation` are empty; `conditions`, when given, replace the template's defaults. The
  // version is the one the issuer read; a template edited since is a conflict.
  TemplateRef template = 12;
}

// An account to create to hold a grant.
message NewUser {
  // How the account is shown, 1 to 100 characters.
  string display_name = 1;
  // When its invitation stops working: within seven days, and seven days if absent.
  google.protobuf.Timestamp invitation_expires_at = 2;
}

message IssueGrantResponse {
  Grant grant = 1;
  // For link-form grants: the bearer token, shown once.
  string link_token = 2;
  Consistency consistency = 3;
  // With `to_new_token`: the token's secret, shown once and never stored. A replay of the same
  // mutation returns the response without it (§6 of docs/10-api.md).
  string token = 4;
  // With `to_new_user`: the invitation's secret, `korpisiv_` and the rest, shown once and stored
  // only as its digest; a replay returns the response without it.
  string invitation = 5;
}

message GetGrantRequest {
  string id = 1;
}

message GetGrantResponse {
  Grant grant = 1;
  // Parent first, root last.
  repeated Grant chain = 2;
}

message ListGrantsRequest {
  oneof filter {
    Scope scope = 1;
    Subject subject = 2;
    // The grants issued from this template, at any version, that the caller may read under
    // grant.read over their scopes (§3.5 of docs/08-identity.md).
    string template = 4;
  }
  PageRequest page = 3;
}

message ListGrantsResponse {
  repeated Grant grants = 1;
  PageResponse page = 2;
}

message RevokeGrantRequest {
  Mutation mutation = 1;
  string grant = 2;
}

message RevokeGrantResponse {
  Grant grant = 1;
  // How many descendants the revocation cascaded to.
  uint64 cascaded = 2;
  Consistency consistency = 3;
}

message MintTokenRequest {
  string grant = 1;
  repeated string actions = 2;
  Scope scope = 3;
  // Bounded by the grant's own expiry and the server's maximum token lifetime.
  uint32 ttl_seconds = 4;
  // The live session token this one renews: the same holder's, on the same object, through the
  // same chain, carrying no action it did not. A renewal spends no use of a use-limited grant,
  // because the session it keeps alive spent one when it opened (§6.1 of docs/08-identity.md).
  string renews = 5;
}

message MintTokenResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  // For a token on a workload that is placed: the node a relay carries its sessions to, sealed
  // so the holder cannot read it. Passed to RelayService.Open as it is (§3.1 of
  // docs/02-architecture.md).
  string route = 3;
}

// What a template asks for; every field of a version but its identity and history.
message GrantTemplateBody {
  string name = 1;
  repeated string actions = 2;
  ScopePattern scope_pattern = 3;
  // Required.
  DelegationPolicy delegation = 4;
  TemplateConditions conditions = 5;
}

message CreateGrantTemplateRequest {
  Mutation mutation = 1;
  string organization = 2;
  GrantTemplateBody template = 3;
}

message CreateGrantTemplateResponse {
  GrantTemplate template = 1;
}

message UpdateGrantTemplateRequest {
  // `expected_version` is required: the version the edit was made against.
  Mutation mutation = 1;
  string id = 2;
  GrantTemplateBody template = 3;
}

message UpdateGrantTemplateResponse {
  GrantTemplate template = 1;
}

message RetireGrantTemplateRequest {
  Mutation mutation = 1;
  string id = 2;
}

message RetireGrantTemplateResponse {
  GrantTemplate template = 1;
}

message GetGrantTemplateRequest {
  string id = 1;
  // A version it had; the current one when absent.
  optional uint64 version = 2;
  // An object it is offered at, which the caller may read.
  ObjectRef at = 3;
}

message GetGrantTemplateResponse {
  GrantTemplate template = 1;
}

message ListGrantTemplatesRequest {
  oneof of {
    // The live templates offered at this object.
    ObjectRef at = 1;
    // The templates this organization owns, retired ones included.
    string owned = 2;
  }
  PageRequest page = 3;
}

message ListGrantTemplatesResponse {
  repeated GrantTemplate templates = 1;
  PageResponse page = 2;
}

// Identity bindings (§5 of docs/08-identity.md): which identity provider vouches for an external
// person or set, how often that is re-checked, and what a set's members receive. A binding
// grants nothing; a grant to its subject is issued like any other, by attenuation.
service IdentityService {
  // identity.binding.write on the organization its provider is installed into.
  rpc CreateIdentityBinding(CreateIdentityBindingRequest) returns (CreateIdentityBindingResponse);
  // identity.binding.write on its organization, against the version read.
  rpc UpdateIdentityBinding(UpdateIdentityBindingRequest) returns (UpdateIdentityBindingResponse);
  // identity.binding.write on its organization: it vouches for nothing since, and every grant
  // rooted in it is suspended.
  rpc RetireIdentityBinding(RetireIdentityBindingRequest) returns (RetireIdentityBindingResponse);
  // identity.binding.write on its organization: its provider is asked now rather than at its
  // next interval, and the answer recorded (§5.1 of docs/08-identity.md).
  rpc VerifyIdentityBinding(VerifyIdentityBindingRequest) returns (VerifyIdentityBindingResponse);
  // identity.relay on the provider's organization, held by the client relaying what a person
  // presented (§5.2 of docs/08-identity.md). The provider asserts it, the presentation is
  // accepted once, and the client is handed a ticket for the one action on the one object, used
  // beside its own credential within a minute.
  rpc AssertIdentity(AssertIdentityRequest) returns (AssertIdentityResponse);
  // org.read on its organization.
  rpc GetIdentityBinding(GetIdentityBindingRequest) returns (GetIdentityBindingResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // org.read on the organization: the bindings declared there.
  rpc ListIdentityBindings(ListIdentityBindingsRequest) returns (ListIdentityBindingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// What a binding's declarer says and may change.
message IdentityBindingTerms {
  // For a set: the template every grant to it is issued from.
  optional TemplateRef template = 1;
  BindingConstraints constraints = 2;
  // Fifteen minutes when absent.
  google.protobuf.Duration reverify_interval = 3;
  // For a set: let its grants carry irreversible actions, deliberately (§5.2 of
  // docs/08-identity.md).
  bool allows_irreversible = 4;
}

message CreateIdentityBindingRequest {
  Mutation mutation = 1;
  // Where its provider is installed.
  string organization = 2;
  // The provider's name there.
  string provider = 3;
  // An external identity whose provider is `org_…/<provider>`.
  ExternalIdentity subject = 4;
  IdentityBindingTerms terms = 5;
}

message CreateIdentityBindingResponse {
  IdentityBinding binding = 1;
}

message UpdateIdentityBindingRequest {
  // `expected_version` is required: the version the edit was made against.
  Mutation mutation = 1;
  string id = 2;
  IdentityBindingTerms terms = 3;
}

message UpdateIdentityBindingResponse {
  IdentityBinding binding = 1;
}

message RetireIdentityBindingRequest {
  Mutation mutation = 1;
  string id = 2;
}

message RetireIdentityBindingResponse {
  IdentityBinding binding = 1;
}

message VerifyIdentityBindingRequest {
  string id = 1;
}

message VerifyIdentityBindingResponse {
  // As the answer left it.
  IdentityBinding binding = 1;
  // Why the provider gave no answer, when it gave none: `provider.unknown`, `provider.deadline`,
  // or the provider's own reason. Empty when it answered.
  string unanswered = 2;
}

message AssertIdentityRequest {
  // Where the provider is installed.
  string organization = 1;
  // The provider's name there.
  string provider = 2;
  // What the person presented, as the client received it: at most 64 KiB.
  bytes evidence = 3;
  // How it arrived, where its form says: at most 32 entries.
  map<string, string> headers = 4;
  // The one action the person asked for.
  string action = 5;
  // The one object they asked it of; a grant only when the action is grant.revoke, so a
  // person revokes that one grant (§5.2 of docs/08-identity.md).
  ObjectRef object = 6;
}

message AssertIdentityResponse {
  // Shown once; sent as the `korpis-as` header of the one call, beside the client's own
  // credential.
  string ticket = 1;
  // Who the provider says presented it.
  ExternalIdentity subject = 2;
  // The provider's sets the assertion says they are in.
  repeated ExternalSet sets = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message GetIdentityBindingRequest {
  string id = 1;
}

message GetIdentityBindingResponse {
  IdentityBinding binding = 1;
}

message ListIdentityBindingsRequest {
  string organization = 1;
  // Retired bindings too.
  bool retired = 2;
  PageRequest page = 3;
}

message ListIdentityBindingsResponse {
  repeated IdentityBinding bindings = 1;
  PageResponse page = 2;
}

// The delegation ceiling at an organization (§5.1 of docs/08-identity.md).
message DelegationCeiling {
  // The one the organization sets itself; absent when it sets none.
  google.protobuf.Duration own = 1;
  // The one in force there: the lowest along its organizations, seven days when none sets one.
  google.protobuf.Duration effective = 2;
}

message GetDelegationCeilingRequest {
  string organization = 1;
}

message GetDelegationCeilingResponse {
  DelegationCeiling ceiling = 1;
}

message SetDelegationCeilingRequest {
  Mutation mutation = 1;
  string organization = 2;
  // Absent removes the organization's own.
  google.protobuf.Duration ceiling = 3;
}

message SetDelegationCeilingResponse {
  DelegationCeiling ceiling = 1;
}
