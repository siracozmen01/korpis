  }
}

message ListEffectsRequest {
  optional string workload = 1;
  optional string plan = 2;
  optional string node = 3;
  google.protobuf.Timestamp since = 4;
  PageRequest page = 5;
}

message ListEffectsResponse {
  repeated Effect effects = 1;
  PageResponse page = 2;
}

service NodeService {
  // node.enroll over the organization: a one-time token the agent exchanges for its node
  // identity (§3 of docs/18-operations.md). The token is a Token subject holding a grant of
  // node.enroll attenuated from the caller's, with max_uses 1 (§7 of docs/02-architecture.md).
  rpc CreateEnrollmentToken(CreateEnrollmentTokenRequest) returns (CreateEnrollmentTokenResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // node.cordon, both ways.
  rpc CordonNode(CordonNodeRequest) returns (CordonNodeResponse);
  rpc UncordonNode(UncordonNodeRequest) returns (UncordonNodeResponse);
  // node.remove, irreversible: decommissions a node for good, its key opening nothing and its
  // session ended (§3 of docs/18-operations.md). Refused unless it is cordoned and holds no
  // workload and no volume, except as `compromised`, which removes it whatever it holds and
  // places each of its workloads again from its target (§9 of docs/17-security.md).
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
  // node.enroll over the root organization: a one-time token a relay exchanges for its identity
  // and its certificate (§3.1 of docs/02-architecture.md). A relay carries every organization's
  // sessions, so only authority over the root enrolls one.
  rpc CreateRelayEnrollmentToken(CreateRelayEnrollmentTokenRequest)
      returns (CreateRelayEnrollmentTokenResponse);
  // node.read over the root organization: every relay, removed ones included.
  rpc ListRelays(ListRelaysRequest) returns (ListRelaysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // node.enroll over the root organization. A removed relay is named to no node and told
  // nothing more.
  rpc RemoveRelay(RemoveRelayRequest) returns (RemoveRelayResponse);
}

message CreateRelayEnrollmentTokenRequest {
  Mutation mutation = 1;
  // The root organization.
  string organization = 2;
  // The relay's name, unique in the installation.
  string name = 3;
  // Where clients and nodes will reach it, https://host[:port]; its certificate names the host.
  string url = 4;
  // How long the token may be redeemed; absent is one hour, and at most a day.
  google.protobuf.Duration expires_in = 5;
}

message CreateRelayEnrollmentTokenResponse {
  // Shown once and never stored, as an agent's enrollment token is.
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  // sha256: of the DER of the certificate authority the relay pins when it joins.
  string ca_fingerprint = 3;
}

message ListRelaysRequest {
  string organization = 1;
}

message ListRelaysResponse {
  repeated Relay relays = 1;
}

message RemoveRelayRequest {
  Mutation mutation = 1;
  string organization = 2;
  string relay = 3;
}

message RemoveRelayResponse {
  Relay relay = 1;
}

// A relay running as its own process (§3.1 of docs/02-architecture.md).
message Relay {
  string id = 1;
  string name = 2;
  string url = 3;
  google.protobuf.Timestamp joined_at = 4;
  // When the certificate the control plane last issued it expires.
  google.protobuf.Timestamp certificate_expires_at = 5;
  google.protobuf.Timestamp removed_at = 6;
  // When its feed was last served, to within thirty seconds; absent before the first.
  google.protobuf.Timestamp last_seen_at = 7;
  // Whether its feed was served within the last ninety seconds: the relay is running and
  // verifying by what it is sent.
  bool connected = 8;
}

message CreateEnrollmentTokenRequest {
  Mutation mutation = 1;
  // The node's name, unique in the installation, and its labels: bound to the token, so the
  // node enrolled with it has them whatever the agent says.
  string node_name = 2;
  map<string, string> labels = 3;
  // The organization the node will belong to and serve, with every organization below it.
  string organization = 4;
  // How long the token may be redeemed; absent is one hour, and at most a day.
  google.protobuf.Duration expires_in = 5;
}

message CreateEnrollmentTokenResponse {
  // Shown once and never stored. A replay of the same mutation returns the response without
  // it: a secret recorded for replay would be a secret stored (§6 of docs/10-api.md).
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  // sha256: of the DER of the certificate authority the agent pins at enrollment (§3 of
  // docs/18-operations.md), so the join command can carry it and the first connection is
  // verified rather than trusted.
  string ca_fingerprint = 3;
}

message GetNodeRequest {
  string id = 1;
}

message GetNodeResponse {
  Node node = 1;
}

// The nodes one organization owns; node.read over it.
message ListNodesRequest {
  LabelSelector selector = 1;
  PageRequest page = 2;
  string organization = 3;
}

message ListNodesResponse {
  repeated Node nodes = 1;
  PageResponse page = 2;
}

message RemoveNodeRequest {
  Mutation mutation = 1;
  string node = 2;
  bool compromised = 3;
}

message RemoveNodeResponse {
  Node node = 1;
}

message CordonNodeRequest {
  Mutation mutation = 1;
  string node = 2;
}

message CordonNodeResponse {
  Node node = 1;
}

message UncordonNodeRequest {
  Mutation mutation = 1;
  string node = 2;
}

message UncordonNodeResponse {
  Node node = 1;
}

service GrantService {
  // Attenuate a grant the caller holds into a child (§3.2 of docs/08-identity.md). Needs no
  // action: only the parent's delegation policy.
  rpc IssueGrant(IssueGrantRequest) returns (IssueGrantResponse);
  // grant.read.
  rpc GetGrant(GetGrantRequest) returns (GetGrantResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // grant.revoke, or the issuer of the grant or an ancestor (§3.5 of docs/08-identity.md).
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);
  // A capability token for a grant the caller holds, attenuated to what the call needs.
  rpc MintToken(MintTokenRequest) returns (MintTokenResponse);
}

message IssueGrantRequest {
  Mutation mutation = 1;
  // The grant to attenuate; the caller must hold it. Empty: the one grant the caller holds that
  // this attenuation is valid from, refused when there are several (§3.2 of
  // docs/08-identity.md).
  string parent = 2;
  // Who holds it. Absent exactly when `to_new_token` is set.
  Subject subject = 3;
  repeated string actions = 4;
  Scope scope = 5;
  Conditions conditions = 6;
  DelegationPolicy delegation = 7;
  bool link_form = 8;
  // Provenance only; required with `to_new_token`, which it names.
  string label = 9;
  // Issue to an API token created in the same transaction, which exists only to hold this grant
  // and expires with it (§3.7 of docs/08-identity.md).
  bool to_new_token = 10;
}

message IssueGrantResponse {
  Grant grant = 1;
  // For link-form grants: the bearer token, shown once.
  string link_token = 2;
  Consistency consistency = 3;
  // With `to_new_token`: the token's secret, shown once and never stored. A replay of the same
  // mutation returns the response without it (§6 of docs/10-api.md).
  string token = 4;
}

message GetGrantRequest {
  string id = 1;
}

message GetGrantResponse {
  Grant grant = 1;
  // Parent first, root last.
  repeated Grant chain = 2;
}

message ListGrantsRequest {
  oneof filter {
    Scope scope = 1;
    Subject subject = 2;
  }
  PageRequest page = 3;
}

message ListGrantsResponse {
  repeated Grant grants = 1;
  PageResponse page = 2;
}

message RevokeGrantRequest {
  Mutation mutation = 1;
  string grant = 2;
}

message RevokeGrantResponse {
  Grant grant = 1;
  // How many descendants the revocation cascaded to.
  uint64 cascaded = 2;
  Consistency consistency = 3;
}

message MintTokenRequest {
  string grant = 1;
  repeated string actions = 2;
  Scope scope = 3;
  // Bounded by the grant's own expiry and the server's maximum token lifetime.
  uint32 ttl_seconds = 4;
  // The live session token this one renews: the same holder's, on the same object, through the
  // same chain, carrying no action it did not. A renewal spends no use of a use-limited grant,
  // because the session it keeps alive spent one when it opened (§6.1 of docs/08-identity.md).
  string renews = 5;
}

message MintTokenResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  // For a token on a workload that is placed: the node a relay carries its sessions to, sealed
  // so the holder cannot read it. Passed to RelayService.Open as it is (§3.1 of
  // docs/02-architecture.md).
  string route = 3;
}
