// SPDX-License-Identifier: Apache-2.0
//
// The client API (docs/10-api.md). Web, CLI, chat, and integrations are peer clients of exactly
// these services (P2). Every mutation carries an idempotency key and, where it changes a
// versioned object, the expected version; every write returns a consistency token (§6).

syntax = "proto3";

package korpis.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "korpis/v1/attached.proto";
import "korpis/v1/authority.proto";
import "korpis/v1/common.proto";
import "korpis/v1/console.proto";
import "korpis/v1/placement.proto";
import "korpis/v1/recipe.proto";
import "korpis/v1/tenancy.proto";
import "korpis/v1/workload.proto";

// Carried by every mutating request.
message Mutation {
  // Safe retry: a repeat returns the original outcome.
  string idempotency_key = 1;
  // Compare-and-swap against the object's current version; absent only on create.
  optional uint64 expected_version = 2;
}

// Carried by every write response, and passed back on reads for read-your-writes.
message Consistency {
  string token = 1;
}

// Common to list calls.
message PageRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
}

service ServerInfoService {
  // Capabilities of this control plane. Clients ask; they never sniff a version.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetServerInfoRequest {}

message GetServerInfoResponse {
  string version = 1;
  // The exact source revision, and where it is published (§2 of docs/19-governance.md).
  string source_revision = 2;
  string source_url = 3;
  // The capabilities of the extension contract this control plane offers (§6 of
  // docs/16-extensions.md): an extension requiring one not listed is refused at install.
  repeated string capabilities = 4;
  // Agent protocol versions this control plane accepts (§4 of docs/10-api.md).
  repeated string agent_protocols = 5;
  // Extension contract versions this control plane serves, oldest first.
  repeated string extension_contracts = 6;
  // Where a client opens a session with a workload (RelayService, §3.1 of
  // docs/02-architecture.md): the relays running as their own process, each an https URL, as
  // this replica last named them to nodes; any of them reaches every connected node.
  repeated string relays = 7;
  // Whether this control plane serves RelayService itself, at the address the client reached.
  bool control_plane_relay = 8;
}

service OrganizationService {
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // org.quota.write.
  rpc SetQuota(SetQuotaRequest) returns (SetQuotaResponse);
  // org.suspend: reversible, from above only.
  rpc SuspendOrganization(SuspendOrganizationRequest) returns (SuspendOrganizationResponse);
  rpc ResumeOrganization(ResumeOrganizationRequest) returns (ResumeOrganizationResponse);
  // org.read. The recipe trust policy that governs the organization (§7 of
  // docs/09-recipes.md): its own, else its nearest ancestor's, else the default.
  rpc GetTrustPolicy(GetTrustPolicyRequest) returns (GetTrustPolicyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // org.write. Sets or removes the organization's own policy. mutation.expected_version is
  // the own_version GetTrustPolicy returned, absent when the organization has none.
  rpc SetTrustPolicy(SetTrustPolicyRequest) returns (SetTrustPolicyResponse);
}

message CreateOrganizationRequest {
  Mutation mutation = 1;
  string name = 2;
  // Absent creates a root organization, which only the installation's root grant may do.
  optional string parent = 3;
  QuotaSet quota = 4;
}

message CreateOrganizationResponse {
  Organization organization = 1;
  Consistency consistency = 2;
}

message GetOrganizationRequest {
  string id = 1;
  Consistency consistency = 2;
}

message GetOrganizationResponse {
  Organization organization = 1;
}

message ListOrganizationsRequest {
  optional string parent = 1;
  PageRequest page = 2;
  Consistency consistency = 3;
}

message ListOrganizationsResponse {
  repeated Organization organizations = 1;
  PageResponse page = 2;
}

message SetQuotaRequest {
  Mutation mutation = 1;
  string organization = 2;
  QuotaSet quota = 3;
}

message SetQuotaResponse {
  Organization organization = 1;
  Consistency consistency = 2;
}

message SuspendOrganizationRequest {
  Mutation mutation = 1;
  string organization = 2;
  string reason = 3;
  OnSuspend on_suspend = 4;
}

message SuspendOrganizationResponse {
  Organization organization = 1;
  Consistency consistency = 2;
}

message ResumeOrganizationRequest {
  Mutation mutation = 1;
  string organization = 2;
}

message ResumeOrganizationResponse {
  Organization organization = 1;
  Consistency consistency = 2;
}

message GetTrustPolicyRequest {
  string organization = 1;
  Consistency consistency = 2;
}

// The policy that governs an organization, and where it was set.
message GoverningTrustPolicy {
  // Empty, the default, when no organization from this one up to its root has set one.
  TrustPolicy policy = 1;
  // The organization that set it: this one, or an ancestor. Absent when the default governs.
  optional string set_on = 2;
  // Who set it, and when; absent when the default governs.
  Subject set_by = 3;
  google.protobuf.Timestamp set_at = 4;
  // The version of this organization's own policy, zero when it has none.
  uint64 own_version = 5;
}

message GetTrustPolicyResponse {
  GoverningTrustPolicy governing = 1;
}

message SetTrustPolicyRequest {
  Mutation mutation = 1;
  string organization = 2;
  // Absent removes the organization's own policy, so its nearest ancestor's governs again.
  TrustPolicy policy = 3;
}

message SetTrustPolicyResponse {
  GoverningTrustPolicy governing = 1;
  Consistency consistency = 2;
}

service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message CreateProjectRequest {
  Mutation mutation = 1;
  string organization = 2;
  string name = 3;
  map<string, string> labels = 4;
  QuotaSet quota = 5;
}

message CreateProjectResponse {
  Project project = 1;
  Consistency consistency = 2;
}

message GetProjectRequest {
  string id = 1;
  Consistency consistency = 2;
}

message GetProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {
  string organization = 1;
  PageRequest page = 2;
  Consistency consistency = 3;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  PageResponse page = 2;
}

service WorkloadService {
  // workload.create (new workload) or workload.write (new intent). Validates the body against
  // the recipe's config schema and field permissions, holds quota in the same transaction, and
  // computes the plan. `dry_run` computes and returns the plan without persisting anything;
  // `propose` persists the intent and its plan and approves nothing (§4 of
  // docs/13-surface-cli.md).
  rpc DeclareIntent(DeclareIntentRequest) returns (DeclareIntentResponse);
  // workload.start.
  rpc Start(StartRequest) returns (PowerResponse);
  // workload.stop.
  rpc Stop(StopRequest) returns (PowerResponse);
  // workload.restart: a new Power version with a higher cycle.
  rpc Restart(RestartRequest) returns (PowerResponse);
  // workload.delete: a plan of kind retire. Volumes are not deleted by it.
  rpc DeleteWorkload(DeleteWorkloadRequest) returns (DeleteWorkloadResponse);
  // Binds a workload whose approved target has no node to a node an operator chooses, with the
  // operator's reason (§2.3 of docs/05-scheduling.md). The choice overrides the node's cordon
  // and taints, the operator's own decisions about it, and nothing else. node.place on the
  // node, and workload.write on the workload. A placed workload moves only by migration.
  rpc PlaceWorkload(PlaceWorkloadRequest) returns (PlaceWorkloadResponse);
  // Replaces the operator's classification overrides of a workload, under its version, with
  // the operator's reason (§3.3 of docs/01-model.md). workload.classify on the workload. Plans
  // computed after it read the new set; a plan already proposed keeps the classification its
  // proposer saw. An override that would relax the vocabulary's floor is refused.
  rpc SetClassification(SetClassificationRequest) returns (SetClassificationResponse);
  rpc GetWorkload(GetWorkloadRequest) returns (GetWorkloadResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListWorkloads(ListWorkloadsRequest) returns (ListWorkloadsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListIntents(ListIntentsRequest) returns (ListIntentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Server-streaming changes to one workload's status, starting with its current state.
  rpc WatchWorkload(WatchWorkloadRequest) returns (stream WatchWorkloadResponse);
}

message DeclareIntentRequest {
  // expected_version is the workload's current intent version; absent for a new workload.
  Mutation mutation = 1;
  // Exactly one: an existing workload, or a new one.
  oneof target {
    string workload = 2;
    NewWorkload create = 3;
  }
  IntentBody body = 4;
  bool dry_run = 5;
  // Persist the intent and its plan, and leave the plan waiting for confirmation even when
  // default policy would approve it at once, so the plan a person reviews is the one that
  // applies (§3.3 of docs/01-model.md). Not with `dry_run`.
  bool propose = 6;
  // Declare through the set of this name in the workload's project, creating it in advisory
  // mode if it does not exist (§5 and §6 of docs/13-surface-cli.md).
  string set = 7;
  // With `set`, onto a member drifted in an advisory set: discard the out-of-band change, which
  // is recorded with its author.
  bool reconcile = 8;
  // With `set`, onto a workload that belongs to no set: take it into the set.
  bool adopt = 9;
}

message NewWorkload {
  string project = 1;
  string name = 2;
  map<string, string> labels = 3;
  // The initial power declaration; running unless stated.
  PowerState power = 4;
}

message DeclareIntentResponse {
  Workload workload = 1;
  Intent intent = 2;
  Plan plan = 3;
  Consistency consistency = 4;
}

message StartRequest {
  Mutation mutation = 1;
  string workload = 2;
}

message StopRequest {
  Mutation mutation = 1;
  string workload = 2;
}

message RestartRequest {
  Mutation mutation = 1;
  string workload = 2;
}

message PowerResponse {
  Power power = 1;
  Plan plan = 2;
  Consistency consistency = 3;
}

message DeleteWorkloadRequest {
  Mutation mutation = 1;
  string workload = 2;
  // Volumes to delete with it, by the name the workload knows each by (`stream_console` for its
  // console stream's), each one named explicitly; every other volume is retained. Each is deleted
  // by its own irreversible step under `volume.delete` (§7 of docs/06-storage.md).
  repeated string delete_volumes = 3;
}

message PlaceWorkloadRequest {
  Mutation mutation = 1;
  string workload = 2;
  string node = 3;
  // Why, for the record; required.
  string reason = 4;
}

message PlaceWorkloadResponse {
  Placement placement = 1;
}

message SetClassificationRequest {
  // expected_version is the workload's version.
  Mutation mutation = 1;
  string workload = 2;
  // The whole set; empty clears it.
  repeated ClassificationOverride overrides = 3;
  // Why, for the record; required.
  string reason = 4;
}

message SetClassificationResponse {
  Workload workload = 1;
}

message DeleteWorkloadResponse {
  Plan plan = 1;
  Consistency consistency = 2;
}

message GetWorkloadRequest {
  string id = 1;
  Consistency consistency = 2;
}

message GetWorkloadResponse {
  WorkloadStatus status = 1;
}

// Everything a client needs to render one workload honestly (§4.3 of
// docs/02-architecture.md).
message WorkloadStatus {
  Workload workload = 1;
  Intent target = 2;
  Intent head = 3;
  Observation observation = 4;
  Placement placement = 5;
  Convergence convergence = 6;
  // The plan currently proposed, scheduled, or applying, if any.
  Plan active_plan = 7;
  // Why no node took the approved target, if the newest attempt found none.
  Unplaced unplaced = 8;
  // Present when the workload belongs to a set and its head was declared outside it.
  Drift drift = 9;
  // Its endpoints as placed: the exposure each resolved to and where it is reached (§3 of
  // docs/07-networking.md). Empty while it is not placed.
  repeated Endpoint endpoints = 10;
  // The certificate each of its ingress endpoints is served with, as the control plane holds it:
  // its state, its validity, and for one not issued why (§3.2 of docs/07-networking.md). Without
  // its chain. Present once the endpoint's names are routed.
  repeated EndpointCertificate certificates = 11;
  // Each name its ingress endpoints route, in DNS: the addresses it should resolve to, and
  // whether a DNS provider of its organization publishes them, or its holder must (§3.5 of
  // docs/07-networking.md).
  repeated EndpointName names = 12;
}

// A name an ingress endpoint routes, in DNS.
message EndpointName {
  // The endpoint, by name.
  string endpoint = 1;
  string name = 2;
  // What it should resolve to: its node's advertised addresses.
  repeated string addresses = 3;
  EndpointNameState state = 4;
  // The DNS provider publishing it, or last asked to.
  string provider = 5;
  // Why, when it is not published.
  string reason = 6;
}

enum EndpointNameState {
  ENDPOINT_NAME_STATE_UNSPECIFIED = 0;
  // Not yet asked of any provider.
  ENDPOINT_NAME_STATE_PENDING = 1;
  ENDPOINT_NAME_STATE_PUBLISHED = 2;
  // No DNS provider of its organization serves its zone: its holder publishes it.
  ENDPOINT_NAME_STATE_UNMANAGED = 3;
  ENDPOINT_NAME_STATE_FAILED = 4;
}

// An ingress endpoint's certificate.
message EndpointCertificate {
  // The endpoint, by name.
  string endpoint = 1;
  Certificate certificate = 2;
}

enum Convergence {
  CONVERGENCE_UNSPECIFIED = 0;
  CONVERGENCE_CONVERGED = 1;
  CONVERGENCE_APPLYING = 2;
  CONVERGENCE_AWAITING_APPROVAL = 3;
  CONVERGENCE_SCHEDULED = 4;
  // The agent holds the assignment and cannot satisfy it.
  CONVERGENCE_FAILING = 5;
  CONVERGENCE_UNKNOWN = 6;
  CONVERGENCE_UNPLACED = 7;
}

message ListWorkloadsRequest {
  optional string project = 1;
  optional string organization = 2;
  LabelSelector selector = 3;
  PageRequest page = 4;
  Consistency consistency = 5;
  // Only the members of the set of this name; needs `project`.
  optional string set = 6;
}

message ListWorkloadsResponse {
  repeated WorkloadStatus workloads = 1;
  PageResponse page = 2;
}

message ListIntentsRequest {
  string workload = 1;
  PageRequest page = 2;
}

message ListIntentsResponse {
  repeated Intent intents = 1;
  PageResponse page = 2;
}

message WatchWorkloadRequest {
  string workload = 1;
}

message WatchWorkloadResponse {
  WorkloadStatus status = 1;
}

// Declared sets (§3.3 of docs/01-model.md). project.read lists them; project.write changes a
// mode.
// A workload's streams as the control plane knows them (§4 of docs/14-streams.md): the index of
// their segments, never their records, which the node serves over the data path (console.proto).
service StreamService {
  // The stream and its index. Takes workload.console.read: how much a workload wrote, and when,
  // is part of what it wrote. NOT_FOUND for a workload with no stream of that kind.
  rpc GetStream(GetStreamRequest) returns (GetStreamResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The offloaded segments of a stream from an offset, read from the repositories holding them
  // rather than from a node (§4 of docs/14-streams.md): how a stream is read once its node is
  // gone, or its workload retired. Takes workload.console.read, and is recorded as a read. Each
  // segment's digest is checked before a record of it is sent; offsets no offloaded segment holds
  // are sent as missing.
  rpc ReadOffloaded(ReadOffloadedRequest) returns (stream ConsoleChunk);
}

message ReadOffloadedRequest {
  string workload = 1;
  // The console when unspecified.
  StreamKind kind = 2;
  // The first offset wanted.
  uint64 from_offset = 3;
  // Stop once this many records are sent; zero is no limit.
  uint64 limit = 4;
}

message GetStreamRequest {
  string workload = 1;
  // The console when unspecified.
  StreamKind kind = 2;
}

message GetStreamResponse {
  // Its identifier is empty until the first segment is sealed, when the index first hears of it;
  // its retention is the one the intent its node runs declares.
  Stream stream = 1;
  // Offsets held nowhere: pruned from the node before they were offloaded (§3 of
  // docs/14-streams.md).
  repeated OffsetRange lost = 2;
}

// Repositories (§5.3 of docs/06-storage.md): where an organization's backups are kept and under
// whose key. Making one takes repository.write on its project or organization; reading one,
// repository.read.
service RepositoryService {
  rpc CreateRepository(CreateRepositoryRequest) returns (CreateRepositoryResponse);
  rpc GetRepository(GetRepositoryRequest) returns (GetRepositoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // An organization's live repositories, or those serving one project: the project's own and
  // the organization's.
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message CreateRepositoryRequest {
  Mutation mutation = 1;
  string organization = 2;
  optional string project = 3;
  string name = 4;
  string provider = 5;
  string prefix = 6;
  KeyCustody key_custody = 7;
  RetentionPolicy retention = 8;
  // Whether it takes the streams of the workloads it serves; when unset, it does unless another
  // repository already takes them for the same organization or project.
  optional bool streams = 9;
  // Required under KEY_CUSTODY_TENANT, refused under KEY_CUSTODY_OPERATOR.
  TenantKey kms = 10;
}

message CreateRepositoryResponse {
  Repository repository = 1;
}

message GetRepositoryRequest {
  string id = 1;
}

message GetRepositoryResponse {
  Repository repository = 1;
}

message ListRepositoriesRequest {
  string organization = 1;
  optional string project = 2;
  PageRequest page = 3;
}

message ListRepositoriesResponse {
  repeated Repository repositories = 1;
  PageResponse page = 2;
}

// Domains (§3.2 of docs/07-networking.md): asked for under domain.write on the organization that
// will hold them; delegated under domain.write on the parent's holder as well; attested under
// domain.attest on the installation's root organization.
service DomainService {
  rpc CreateDomain(CreateDomainRequest) returns (CreateDomainResponse);
  // Verifies a DOMAIN_VERIFICATION_DNS_TXT domain by its TXT record; a verified domain is
  // answered as it is.
  rpc VerifyDomain(VerifyDomainRequest) returns (VerifyDomainResponse);
  rpc GetDomain(GetDomainRequest) returns (GetDomainResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListDomains(ListDomainsRequest) returns (ListDomainsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Deletes a domain and every domain delegated beneath it.
  rpc DeleteDomain(DeleteDomainRequest) returns (DeleteDomainResponse);
}

message CreateDomainRequest {
  Mutation mutation = 1;
  string organization = 2;
  string name = 3;
  DomainVerification verification = 4;
  // For DOMAIN_VERIFICATION_DELEGATED: the verified domain of an ancestor organization it lies
  // beneath.
  optional string parent = 5;
}

message CreateDomainResponse {
  Domain domain = 1;
}

message VerifyDomainRequest {
  Mutation mutation = 1;
  string id = 2;
}

message VerifyDomainResponse {
  Domain domain = 1;
}

message GetDomainRequest {
  string id = 1;
}

message GetDomainResponse {
  Domain domain = 1;
}

message ListDomainsRequest {
  string organization = 1;
  PageRequest page = 2;
}

message ListDomainsResponse {
  repeated Domain domains = 1;
  PageResponse page = 2;
}

message DeleteDomainRequest {
  Mutation mutation = 1;
  string id = 2;
}

message DeleteDomainResponse {
  // How many went: the domain and those delegated beneath it.
  uint64 deleted = 1;
}

// Certificates the ingress serves with (§3.2 of docs/07-networking.md): uploaded and replaced
// under certificate.write on the organization holding them; read under certificate.read. A
// certificate's key is sent once, when it is uploaded, and never returned.
service CertificateService {
  // Uploads a chain and its key; the chain's leaf must be valid now and the key its own.
  rpc CreateCertificate(CreateCertificateRequest) returns (CreateCertificateResponse);
  // Replaces a provided certificate's chain and key, keeping its identifier, so the endpoints
  // serving with it serve the new one; the new leaf must cover every name they route.
  rpc ReplaceCertificate(ReplaceCertificateRequest) returns (ReplaceCertificateResponse);
  rpc GetCertificate(GetCertificateRequest) returns (GetCertificateResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListCertificates(ListCertificatesRequest) returns (ListCertificatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Deletes a certificate no endpoint serves with.
  rpc DeleteCertificate(DeleteCertificateRequest) returns (DeleteCertificateResponse);
}

message CreateCertificateRequest {
  Mutation mutation = 1;
  string organization = 2;
  // PEM, leaf first.
  string chain = 3;
  // The leaf's private key, PEM: PKCS #8, PKCS #1, or SEC 1.
  string key = 4;
}

message CreateCertificateResponse {
  Certificate certificate = 1;
}

message ReplaceCertificateRequest {
  Mutation mutation = 1;
  string id = 2;
  string chain = 3;
  string key = 4;
}

message ReplaceCertificateResponse {
  Certificate certificate = 1;
}

message GetCertificateRequest {
  string id = 1;
}

message GetCertificateResponse {
  Certificate certificate = 1;
}

message ListCertificatesRequest {
  string organization = 1;
  PageRequest page = 2;
}

message ListCertificatesResponse {
  repeated Certificate certificates = 1;
  PageResponse page = 2;
}

message DeleteCertificateRequest {
  Mutation mutation = 1;
  string id = 2;
}

message DeleteCertificateResponse {}

// Backups (§5 of docs/06-storage.md), authorized on the workload whose volume they are of.
service BackupService {
  // Proposes backing a volume up into a repository, under backup.create on the volume's
  // workload: a plan of one step that changes nothing the workload sees and applies at once.
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse);
  rpc GetBackup(GetBackupRequest) returns (GetBackupResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // A workload's backups, newest first; pruned ones only when asked for.
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Proposes restoring a backup into a volume: into a new directory of it, which loses nothing
  // and applies at once, or replacing it, which loses what it holds and waits for approval.
  // Into the backup's own workload under backup.restore there; into another workload's volume
  // under backup.read on the backup's workload and workload.file.write on the other.
  rpc RestoreBackup(RestoreBackupRequest) returns (RestoreBackupResponse);
  // One directory of a whole backup: every name, kind, and size in it, under backup.browse on
  // its workload, which shows no byte of any file. Recorded as a sensitive read.
  rpc BrowseBackup(BrowseBackupRequest) returns (BrowseBackupResponse);
  // One file of a whole backup, its bytes in order with its holes as zeros, under backup.read on
  // its workload, which shows no other name. Recorded as a sensitive read. The stream ends in an
  // error, never quietly, when what was read is not what the backup recorded.
  rpc ReadBackupFile(ReadBackupFileRequest) returns (stream ReadBackupFileResponse);
  // Proposes pruning a workload's backups in a repository under backup.prune on the workload:
  // a plan of one step, always awaiting approval, whose detail names each backup it forgets and
  // why every other one is kept. Applying it forgets them and marks what only they held; that is
  // deleted after a grace period longer than any job's access (§5.5 of docs/06-storage.md).
  rpc PruneBackups(PruneBackupsRequest) returns (PruneBackupsResponse);
}

message PruneBackupsRequest {
  Mutation mutation = 1;
  string workload = 2;
  string repository = 3;
}

message PruneBackupsResponse {
  Plan plan = 1;
}

message CreateBackupRequest {
  Mutation mutation = 1;
  string volume = 2;
  string repository = 3;
}

message CreateBackupResponse {
  Plan plan = 1;
  Backup backup = 2;
}

message RestoreBackupRequest {
  Mutation mutation = 1;
  string backup = 2;
  // The volume restored into; the backup's own when empty.
  string volume = 3;
  // The path in the backup restored, relative; all of it when empty.
  string path = 4;
  oneof target {
    // A new directory at the volume's root, which must not exist.
    string into = 5;
    // The whole volume, replaced by the whole backup.
    bool replace = 6;
  }
}

message RestoreBackupResponse {
  Plan plan = 1;
}

message BrowseBackupRequest {
  string backup = 1;
  // A directory in it, relative; the volume's root when empty.
  string path = 2;
}

message BrowseBackupResponse {
  repeated BackupEntry entries = 1;
}

// One name in a backed-up directory.
message BackupEntry {
  // The name, as the filesystem had it: any bytes but '/' and NUL.
  bytes name = 1;
  BackupEntryKind kind = 2;
  // A file's length, holes included.
  uint64 size = 3;
  // The permission bits, and the set-id and sticky bits.
  uint32 mode = 4;
  google.protobuf.Timestamp modified = 5;
  // A symbolic link's target.
  bytes link_target = 6;
}

enum BackupEntryKind {
  BACKUP_ENTRY_KIND_UNSPECIFIED = 0;
  BACKUP_ENTRY_KIND_FILE = 1;
  BACKUP_ENTRY_KIND_DIRECTORY = 2;
  BACKUP_ENTRY_KIND_SYMLINK = 3;
  // A pipe, a device node, or a socket.
  BACKUP_ENTRY_KIND_SPECIAL = 4;
}

message ReadBackupFileRequest {
  string backup = 1;
  // A file in it, relative.
  string path = 2;
}

message ReadBackupFileResponse {
  // The next bytes of the file.
  bytes data = 1;
  // The file's length, on the first message.
  uint64 size = 2;
}

message GetBackupRequest {
  string id = 1;
}

message GetBackupResponse {
  Backup backup = 1;
}

message ListBackupsRequest {
  string workload = 1;
  bool include_deleted = 2;
  PageRequest page = 3;
}

message ListBackupsResponse {
  repeated Backup backups = 1;
  PageResponse page = 2;
}

// Volumes as the control plane knows them (§7 of docs/06-storage.md): kept from what nodes
// report, outliving the workloads they were made for. Reading one takes volume.read.
service VolumeService {
  rpc GetVolume(GetVolumeRequest) returns (GetVolumeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // A project's volumes, or one workload's; deleted ones only when asked for.
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Proposes deleting a retained volume no workload holds: a plan of one irreversible step,
  // which always waits for a person (§7 of docs/06-storage.md).
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
  // Proposes taking a snapshot of a volume, in a class that can, under volume.snapshot.create.
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  // A volume's snapshots; deleted ones only when asked for.
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Proposes making a volume what a snapshot holds, under volume.snapshot.rollback: what was
  // written since is lost, so the plan always waits for a person.
  rpc RollbackVolume(RollbackVolumeRequest) returns (RollbackVolumeResponse);
  // Proposes deleting a snapshot, under volume.snapshot.delete; it always waits for a person.
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
}

message CreateSnapshotRequest {
  Mutation mutation = 1;
  string volume = 2;
  string name = 3;
}

message CreateSnapshotResponse {
  Plan plan = 1;
  // The snapshot the plan takes, by the identifier it will have.
  string snapshot = 2;
}

message ListSnapshotsRequest {
  string volume = 1;
  bool include_deleted = 2;
}

message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
}

message RollbackVolumeRequest {
  Mutation mutation = 1;
  string snapshot = 2;
}

message RollbackVolumeResponse {
  Plan plan = 1;
}

message DeleteSnapshotRequest {
  Mutation mutation = 1;
  string id = 2;
}

message DeleteSnapshotResponse {
  Plan plan = 1;
}

message DeleteVolumeRequest {
  Mutation mutation = 1;
  string id = 2;
}

message DeleteVolumeResponse {
  Plan plan = 1;
}

message GetVolumeRequest {
  string id = 1;
}

message GetVolumeResponse {
  Volume volume = 1;
}

message ListVolumesRequest {
  string project = 1;
  // Only those created for, or attached to, this workload.
  optional string workload = 2;
  bool include_deleted = 3;
  PageRequest page = 4;
}

message ListVolumesResponse {
  repeated Volume volumes = 1;
  PageResponse page = 2;
}

service DeclaredSetService {
  rpc ListDeclaredSets(ListDeclaredSetsRequest) returns (ListDeclaredSetsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SetDeclaredSetMode(SetDeclaredSetModeRequest) returns (SetDeclaredSetModeResponse);
}

message ListDeclaredSetsRequest {
  string project = 1;
  PageRequest page = 2;
}

message ListDeclaredSetsResponse {
  repeated DeclaredSet sets = 1;
  PageResponse page = 2;
}

message SetDeclaredSetModeRequest {
  // expected_version is the set's current version.
  Mutation mutation = 1;
  string project = 2;
  string name = 3;
  DriftMode mode = 4;
}

message SetDeclaredSetModeResponse {
