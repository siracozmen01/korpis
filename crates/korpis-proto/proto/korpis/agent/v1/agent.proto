// SPDX-License-Identifier: Apache-2.0
//
// The agent protocol (§4 of docs/02-architecture.md). The agent dials out and holds one
// bidirectional stream carrying decisions and facts, never bulk data. It is level-triggered:
// the control plane sends the complete set of assignments, and nothing in it is an instruction
// that is lost if a message is lost. A third party can implement a conforming agent from this
// file and docs/02-architecture.md alone (Rule K-7).

syntax = "proto3";

package korpis.agent.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "korpis/agent/v1/replica.proto";
import "korpis/backup/v1/backup.proto";
import "korpis/v1/attached.proto";
import "korpis/v1/common.proto";
import "korpis/v1/metering.proto";
import "korpis/v1/placement.proto";
import "korpis/v1/provider.proto";
import "korpis/v1/tenancy.proto";
import "korpis/v1/workload.proto";
import "korpis/v1/workload_spec.proto";

service AgentService {
  // Exchange a one-time enrollment token for a node identity (§3 of docs/18-operations.md).
  // The node identity is distinct from the grant signing key (finding 16).
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // The control stream. The first agent message is Hello.
  rpc Session(stream AgentMessage) returns (stream ControlMessage);
}

// Retrying with the same token and the same public key returns the same node, so an agent
// whose response was lost can ask again; a different key is refused.
message EnrollRequest {
  string enrollment_token = 1;
  // The node's public key (Ed25519, raw 32 bytes); the private key never leaves the node.
  bytes node_public_key = 2;
  // Informational: recorded in the enrollment effect. The node's name is the token's.
  string hostname = 3;
}

message EnrollResponse {
  string node = 1;
  // The control plane's assignment-signing public keys, current and historical, verify-only
  // (§6 of docs/18-operations.md).
  repeated SigningKey assignment_keys = 2;
  // The capability-token verification keys (§6 of docs/08-identity.md).
  repeated SigningKey token_keys = 3;
  // The pool the node's workloads take IPv4 addresses from, a /22 of the installation's range
  // no other node holds, as CIDR text; empty for a node enrolled before pools were given, or
  // once the range is full. The agent keeps it with its identity and uses it unless its
  // operator names another (§9.1 of docs/07-networking.md). Added 2026-10-25.
  string workload_ipv4 = 4;
}

// The token keys in force, sent once every session opens, before anything signed with them:
// what the agent verifies capability tokens and revocation lists with, replacing the set it
// held, which a restore's rotation retired (§8 of docs/03-state.md). It arrives over the session
// the agent pinned to the installation's authority at enrollment, as Enrolled.token_keys did.
// Added 2026-10-18.
message TokenKeys {
  repeated SigningKey keys = 1;
}

message SigningKey {
  string key_id = 1;
  // Ed25519 public key, raw 32 bytes.
  bytes public_key = 2;
  google.protobuf.Timestamp not_before = 3;
  google.protobuf.Timestamp not_after = 4;
}

// Agent to control plane.
message AgentMessage {
  oneof message {
    Hello hello = 1;
    korpis.v1.Observation observation = 2;
    NodeStatus node_status = 3;
    JournalRecords journal = 4;
    LeaseRequest lease_request = 5;
    LeaseReleased lease_released = 6;
    FeasibilityResult feasibility_result = 7;
    ContentStatus content_status = 8;
    Ack ack = 9;
    ProbeReply probe_reply = 10;
    CredentialRequest credential_request = 11;
    ProbeListening probe_listening = 12;
    JobAccessRequest job_access_request = 13;
    StepRequest step_request = 14;
    CertificateRequest certificate_request = 15;
    Presented presented = 16;
    HealthQuery health_query = 17;
    EdgeLeaseRequest edge_lease_request = 18;
    EdgeLeaseReleased edge_lease_released = 19;
    EdgeChallengesHeld edge_challenges_held = 20;
  }
}

// Control plane to agent.
message ControlMessage {
  oneof message {
    AssignmentSet assignment_set = 1;
    AssignmentDelta assignment_delta = 2;
    // The agent's set digest matches; nothing to send (§9 of docs/10-api.md).
    InSync in_sync = 3;
    LeaseGrant lease_grant = 4;
    LeaseRefusal lease_refusal = 5;
    LeaseRevoke lease_revoke = 6;
    RevocationList revocation_list = 7;
    JournalAck journal_ack = 8;
    FeasibilityQuery feasibility_query = 9;
    ContentHint content_hint = 10;
    Probe probe = 11;
    Welcome welcome = 12;
    WorkloadCredential workload_credential = 13;
    ReachabilityProbe reachability_probe = 14;
    Relays relays = 15;
    JobAccess job_access = 16;
    StepResolution step_resolution = 17;
    CertificateKey certificate_key = 18;
    TokenKeys token_keys = 19;
    HealthAnswer health_answer = 20;
    Peers peers = 21;
    Edges edges = 22;
    EdgeLeaseGrant edge_lease_grant = 23;
    EdgeLeaseRefusal edge_lease_refusal = 24;
    Replicas replicas = 25;
  }
}

// The relays the node keeps one data connection to each of (§3.1 of docs/02-architecture.md):
// sent when the session opens and whenever they change. Connections to relays no longer named
// are closed.
message Relays {
  // The relays running as their own process, each an https URL.
  repeated string urls = 1;
  // Whether the control plane serves the relay role itself, at the address the agent dials it
  // by.
  bool control_plane = 2;
}

// A node executing a backup or restore step asks for what its job needs (§5.5 of
// docs/06-storage.md): the workload's data key, and access to the workload's prefix in the
// repository's store. The control plane answers only a node holding the workload's lease whose
// assignment carries that step.
message JobAccessRequest {
  // Echoed in the answer.
  string request = 1;
  string plan = 2;
  uint32 step = 3;
  // Set instead of the plan and step: the workload whose console stream the node offloads (§4 of
  // docs/14-streams.md). Answered to a node that held its lease, with write access to its stream
  // prefix in the repository that takes its streams, or refused `offload.none` where none does.
  string offload = 4;
  // A one-time X25519 public key the job made: under tenant custody the data key is sealed to it
  // (§5.5 of docs/06-storage.md) and the answer's sealed_data_key set instead of data_key.
  bytes recipient = 5;
  // Set instead of the plan and step: a `backup.browse` or `backup.read` session the node
  // accepted on a block device's backup (§5.4 of docs/06-storage.md). Answered to a node holding
  // the lease of the session's workload, once the control plane has verified the session's token
  // again and recorded the read under it, with read access to the workload's prefix and the
  // volume the image is staged beside; refused where the backup is not the workload's, or holds
  // no image a guest of this node reads.
  BackupRead backup_read = 6;
}

// A session reading a block device's backup, as the node accepted it.
message BackupRead {
  // The backup, `bkp_…`.
  string backup = 1;
  // The session's token, as its client presented it.
  string token = 2;
  // The session's action: `backup.browse` or `backup.read`.
  string action = 3;
  // The workload the session is on, `wl_…`.
  string workload = 4;
}

message JobAccess {
  string request = 1;
  oneof outcome {
    JobGrant grant = 2;
    korpis.v1.Error refused = 3;
  }
}

// An ACME HTTP-01 challenge: the key authorization answered at
// /.well-known/acme-challenge/<token>.
message AcmeChallenge {
  string token = 1;
  string key_authorization = 2;
}

// An ACME TLS-ALPN-01 challenge (RFC 8737): a connection to the name offering only acme-tls/1 is
// answered with a certificate made for the name, carrying the digest in its acmeIdentifier
// extension.
message AlpnChallenge {
  string name = 1;
  // The SHA-256 digest of the key authorization, 32 bytes.
  bytes digest = 2;
}

// A node whose proxy is to serve an endpoint with a certificate asks for its chain and key (§3.2
// of docs/07-networking.md). The control plane answers only a node an endpoint served with the
// certificate is placed on, and only once it holds a key.
message CertificateRequest {
  // Echoed in the answer.
  string request = 1;
  string certificate = 2;
}

message CertificateKey {
  string request = 1;
  oneof outcome {
    ServedCertificate certificate = 2;
    korpis.v1.Error refused = 3;
  }
}

// A certificate as its node serves it: the chain, leaf first, and the leaf's private key, in PEM.
message ServedCertificate {
  string id = 1;
  int64 revision = 2;
  string chain = 3;
  string key = 4;
}

// A node running an install asks for one of its provider steps to be resolved (§4 of
// docs/09-recipes.md). The control plane calls the step provider the workload's intent pinned
// (§4.1 of docs/16-extensions.md) and answers what the step resolved to. It answers only the node
// the workload is placed on, for an install step of a plan still open.
message StepRequest {
  // Echoed in the answer.
  string request = 1;
  string plan = 2;
  uint32 step = 3;
  // The provider step, by its index among the actions the install step's detail lists.
  uint32 action = 4;
  // The node's, since what a step resolves to may differ per platform.
  korpis.v1.Platform platform = 5;
}

message StepResolution {
  string request = 1;
  oneof outcome {
    // Every artifact's path is relative to the step's `to`, and was checked to stay beneath it.
    korpis.v1.StepResult result = 2;
    korpis.v1.Error refused = 3;
  }
}

// A node running a workload's query probe asks for its next round, or its verdict (§5 of
// docs/04-runtimes.md). The control plane calls the health provider the workload's intent pinned
// (§4.1 of docs/16-extensions.md) with the rounds run so far, and answers only the node the
// workload is placed on, for a query probe of the intent the node names.
message HealthQuery {
  // Echoed in the answer.
  string request = 1;
  string workload = 2;
  // The intent the workload's runtime object was built from, whose probe this is.
  string intent = 3;
  ProbeRole probe = 4;
  repeated korpis.v1.HealthRound rounds = 5;
  // How long the node waits for the answer: the provider is given no longer.
  google.protobuf.Duration within = 6;
}

enum ProbeRole {
  PROBE_ROLE_UNSPECIFIED = 0;
  PROBE_ROLE_READINESS = 1;
  PROBE_ROLE_LIVENESS = 2;
}

message HealthAnswer {
  string request = 1;
  oneof outcome {
    korpis.v1.HealthNext next = 2;
    // The probe was not judged this time: its provider failed or is broken off, or answers no
    // longer for what the intent pinned. Its health is unknown, never unhealthy (§5 of
    // docs/16-extensions.md).
    korpis.v1.Error unjudged = 3;
  }
}

// What one job may use, for as long as the access lasts. The agent hands it to the helper, which
// hands it to the job, and none of them keeps it.
message JobGrant {
  // 32 bytes.
  bytes data_key = 1;
  korpis.v1.S3Access store = 2;
  google.protobuf.Timestamp expires_at = 3;
  // The repository it reaches, `rep_…`: named back when an offloaded segment is journaled, so the
  // index knows where it went.
  string repository = 4;
  // Under tenant custody, the data key sealed to the request's recipient, for the context
  // `<repository>/<workload>`; data_key is then empty.
  bytes sealed_data_key = 5;
  // The workload whose key it is, `wl_…`: the context's second half.
  string workload = 6;
  // Access to the repository's recipe content beneath its content/ prefix, for as long as
  // `store`: write for a backup, read for a restore (§5.2 of docs/06-storage.md). Absent for an
  // offload.
  korpis.v1.S3Access content_store = 7;
  // For a backup read: the volume its image is staged beside, by the helper's identifier.
  string volume = 8;
  // For a backup read: the filesystem its image holds, as the backup records it.
  string image_filesystem = 9;
}

// A backup job ended on the node: what its result says.
message BackupEvent {
  string workload = 1;
  string backup = 2;
  korpis.backup.v1.JobResult result = 3;
}

// A workload asked its identity socket for a credential (§9.5 of docs/08-identity.md). The
// workload is the one the socket was created for; nothing in the request is the workload's
// claim about itself.
message CredentialRequest {
  // Echoed in the answer, so the agent can match it to the waiting socket call.
  string request = 1;
  string workload = 2;
}

// A dependency as its node is told it: what the control plane resolved it to.
message ResolvedDependency {
  string name = 1;
  korpis.v1.DependencyInjection inject = 2;
  bool required = 3;
  // In the order of the targets' workload names.
  repeated DependencyEndpoint targets = 4;
}

// One endpoint a dependency reaches.
message DependencyEndpoint {
  string workload = 1;
  string endpoint = 2;
  uint32 container_port = 3;
  korpis.v1.EndpointProtocol protocol = 4;
  // Where its workload is on another node of the mesh: its address there, as that node
  // observed it, and whether it is ready; empty and false where it is on this node, which knows
  // both, or where no address is observed yet (§9.1 of docs/07-networking.md).
  string address = 5;
  bool ready = 6;
}

// A dependent on another node of the mesh, which this workload's node admits from the mesh to
// one of its endpoints (§9.1 of docs/07-networking.md).
message OverlayDependent {
  string workload = 1;
  // The dependent's address on its node, as that node observed it.
  string address = 2;
  // This workload's address on this node, as this node observed it.
  string target_address = 3;
  uint32 container_port = 4;
  korpis.v1.EndpointProtocol protocol = 5;
}

// The answer to a CredentialRequest: a credential, or why there is none.
message WorkloadCredential {
  string request = 1;
  oneof outcome {
    Credential credential = 2;
    korpis.v1.Error refused = 3;
  }
}

// A workload's credential: a bearer secret the API authenticates as the workload, or as the
// extension the workload runs (§9.5 of docs/08-identity.md).
message Credential {
  string secret = 1;
  google.protobuf.Timestamp expires_at = 2;
  // The subject it authenticates as.
  korpis.v1.Subject subject = 3;
}

// The control plane's first message on a session, once the Hello is verified: what it accepted
// and the intervals the agent keeps. Added 2026-10-13, from the implementation: the heartbeat
// interval was declared (question 6 of §10 of docs/02-architecture.md) and nothing carried the
// declaration to the agent.
message Welcome {
  // The protocol the session speaks, one the agent offered.
  string protocol = 1;
  // How often the agent sends NodeStatus. Three missed heartbeats make the node unreachable.
  google.protobuf.Duration heartbeat_interval = 2;
  // The control plane's clock when it sent this; informational, for an agent to notice skew
  // before its next Hello is refused for it.
  google.protobuf.Timestamp server_time = 3;
  // The window either side of server_time a NodeAuth timestamp must fall in.
  google.protobuf.Duration auth_skew = 4;
  // The relays were named here once; they change while a session is open, so a Relays message
  // names them instead.
  reserved 5;
  reserved "relays";
  // Set while a restored control plane is settling (§8 of docs/03-state.md): the agent answers
  // with Presented, every assignment it holds, signed as it received them. Added 2026-10-18.
  bool present_assignments = 6;
  // The installation's metering interval: the node samples every workload it holds at the end
  // of each, by its own clock (§2 of docs/15-observability.md). Added 2026-10-21.
  google.protobuf.Duration metering_interval = 7;
}

// The assignments an agent holds, as the control plane that issued them signed them, presented
// to a restored control plane while it settles: their lease epochs raise its epoch floor, and
// what they declare is what it recovers (§8 of docs/03-state.md). An assignment whose signature
// does not verify against the assignment keyring is counted and believed in nothing.
message Presented {
  repeated SignedAssignment assignments = 1;
}

message Hello {
  string node = 1;
  string agent_version = 2;
  // The agent protocol version, independent of the release version.
  string protocol = 3;
  repeated korpis.v1.DriverInfo drivers = 4;
  repeated korpis.v1.StorageClassInfo storage_classes = 5;
  korpis.v1.Resources capacity = 6;
  korpis.v1.Resources allocatable = 7;
  // The assignment set digest the agent holds, empty if none.
  string set_digest = 8;
  // The highest journal sequence the agent has written, and the lowest it still holds.
  uint64 journal_head = 9;
  uint64 journal_tail = 10;
  // Informational. A node's labels are the operator's, bound at enrollment (§3 of
  // docs/18-operations.md): a node that could set its own could attract the workloads of
  // anyone whose placement selects on them.
  map<string, string> labels = 11;
  // Proof that the agent holds the node identity key established at enrollment.
  NodeAuth auth = 12;
  // As in NodeStatus.
  Advertised advertised = 13;
  // Whether this agent answers FeasibilityQuery (§2.1 of docs/05-scheduling.md). The control
  // plane asks only an agent that says so: one that does not, built before the query or not
  // running a driver it can ask, is not asked, and the check after a bind covers it, rather than
  // being passed over for a silence that will never end.
  bool answers_feasibility = 14;
  // As in NodeStatus.
  repeated korpis.v1.Device devices = 15;
  repeated korpis.v1.UnofferedDevice unoffered_devices = 16;
  repeated korpis.v1.Core cores = 17;
  // As in NodeStatus.
  OverlayFacts overlay = 18;
}

// The session runs over TLS to a control plane certificate the agent pinned at enrollment; this
// proves the other half, that the agent holds the node key. Ed25519 by the node key over the
// UTF-8 bytes of "korpis.agent.v1.Hello|" + node + "|" + seconds + "." + nanos + "|" +
// hex(nonce), where seconds and nanos are the timestamp's fields in decimal, nanos in exactly
// nine digits, and hex is lowercase. The control plane rejects timestamps outside a declared
// skew window and nonces it has seen within that window.
//
// Corrected 2026-10-13, from the implementation: the timestamp was an RFC 3339 string, which
// does not fix the number of fractional digits or the zone designator, so two conforming
// implementations could sign different strings for the same instant.
message NodeAuth {
  google.protobuf.Timestamp timestamp = 1;
  bytes nonce = 2;
  bytes signature = 3;
}

// The heartbeat: sent every Welcome.heartbeat_interval, and whenever capacity or drivers change.
// Every heartbeat carries the node's full facts: an empty driver list means the node offers no
// driver, not that the drivers are unchanged. Storage classes are reported only in the Hello.
message NodeStatus {
  korpis.v1.Resources capacity = 1;
  korpis.v1.Resources allocatable = 2;
  repeated korpis.v1.DriverInfo drivers = 3;
  // Pressure signals, keyed by resource ("memory", "cpu", "io").
  map<string, double> pressure = 4;
  // How long this node can be cut off before audit and metering have holes (§4.10 of
  // docs/02-architecture.md), measured from the journal's growth rate.
  google.protobuf.Duration journal_horizon = 5;
  uint64 journal_bytes_used = 6;
  uint64 journal_bytes_bound = 7;
  // Over the current observations of the node's workloads: while it matches, every unchanged
  // observation is current without being rewritten (question 6 of §10 of
  // docs/02-architecture.md).
  string observation_digest = 8;
  // The addresses clients reach the node at, and the ports its endpoints are allocated from (§9
  // of docs/07-networking.md); a change of address makes its reachability unmeasured again.
  Advertised advertised = 9;
  // The devices the Container Device Interface's files on the node describe, in full every time,
  // and those it does not offer (§6.1 of docs/05-scheduling.md). Added 2026-10-25.
  repeated korpis.v1.Device devices = 10;
  repeated korpis.v1.UnofferedDevice unoffered_devices = 11;
  // The physical cores it offers for dedication, in full every time (§5.2 of
  // docs/05-scheduling.md). Added 2026-10-25.
  repeated korpis.v1.Core cores = 12;
  // Its side of the mesh (§9.1 of docs/07-networking.md), in full every time; absent on a node
  // whose helper makes no workload networks. Added 2026-10-25.
  OverlayFacts overlay = 13;
}

// What a node reports of its side of the mesh.
message OverlayFacts {
  // Its interface's WireGuard public key, 32 bytes; the private key never leaves the helper.
  bytes public_key = 1;
  // The UDP port the interface listens on.
  uint32 port = 2;
  // Its workloads' pools, as CIDR text.
  repeated string pools = 3;
  // When each peer last completed a handshake with it, as it last read them.
  repeated OverlayHandshake handshakes = 4;
}

message OverlayHandshake {
  bytes public_key = 1;
  // Seconds since the Unix epoch.
  int64 latest_unix_seconds = 2;
}

// Every other member of the mesh, sent when a session opens and whenever the members change
// (§9.1 of docs/07-networking.md); none, and why, to a node outside it. The node keeps them on
// disk, so its mesh runs without the control plane. Added 2026-10-25.
message Peers {
  repeated Peer peers = 1;
  // Why this node is outside the mesh; empty for a member.
  string outside = 2;
}

message Peer {
  string node = 1;
  bytes public_key = 2;
  // `address:port`; empty for a member that advertises no address.
  string endpoint = 3;
  // Its pools, as CIDR text.
  repeated string allowed_ips = 4;
}

// What this node forwards as a member of edge groups, and what it takes from edges as a node they
// forward to (§3.1 of docs/07-networking.md); sent when a session opens and whenever it changes.
// The node keeps it on disk, so forwarding runs without the control plane. Added 2026-10-26.
message Edges {
  // This node's own address in the mesh, the last of its IPv4 pool, from which its GRE links
  // are made; empty for a node outside the mesh, which is told nothing else.
  string mesh_address = 1;
  // Each group this node is a member of.
  repeated EdgeForwarding groups = 2;
  // Each edge that forwards to a workload of this node, with what it may reach there.
  repeated EdgeSource sources = 3;
  // This node's own IPv6 address in the mesh, the last of its unique local prefix, at which it
  // answers the probe of an IPv6 address an edge forwards to it; empty where it has none.
  string mesh_address_v6 = 4;
  // The challenges standing for the certificates of the names its groups serve, which its proxy
  // answers as it answers those of its own workloads' names; it says which it holds with
  // EdgeChallengesHeld.
  repeated AcmeChallenge challenges = 5;
  repeated AlpnChallenge alpn_challenges = 6;
}

// What a member forwards for one group: every address and port of its pools that a `stable`
// endpoint holds, so a member taking an address over has its forwarding in place.
message EdgeForwarding {
  string group = 1;
  // Forwarded over UDP, on the member's own first advertised address of each family and on
  // every address it holds, to `probe_node`, for the control plane's probe.
  uint32 probe_port = 2;
  string probe_node = 3;
  // That node's address in the mesh; empty where it is this node.
  string probe_mesh_address = 4;
  repeated EdgeForward forwards = 5;
  // Each address of the group's pools this member should hold, which it holds once its lease
  // on the address is granted and for as long as it is valid.
  repeated EdgeAddress hold = 6;
  // The probe node's IPv6 address in the mesh, to which the probe of an IPv6 address is
  // forwarded through the same link; empty where it has none, and an IPv6 address is not probed.
  string probe_mesh_address_v6 = 7;
  // The group's ingress addresses, one of each family at most, whose ports 80 and 443 over TCP
  // the member that holds one translates to its own proxy.
  repeated string ingress = 8;
  // Every `ingress` endpoint the group serves, which the member's proxy routes.
  repeated EdgeProxied proxied = 9;
}

// An `ingress` endpoint an edge group serves (§3.1 of docs/07-networking.md): its names and how
// they are served, and where its workload is reached, through the mesh where it runs on another
// node; `workload_address` is empty where it is not running, or on a node outside the mesh, and
// no route is made for it.
message EdgeProxied {
  korpis.v1.Endpoint endpoint = 1;
  string node = 2;
  string workload_address = 3;
}

message EdgeAddress {
  string address = 1;
  // The pool's interface on the members' shared link, which the holder puts the address on and
  // announces it on; empty where the pool's router routes the address to the holder.
  string interface = 2;
}

message EdgeForward {
  string address = 1;
  uint32 port = 2;
  korpis.v1.EndpointProtocol protocol = 3;
  // The node its workload runs on, `nd_...`, and that node's address in the mesh, empty where it
  // is this node; both empty where the workload is not running, and the port is refused.
  string node = 4;
  string mesh_address = 5;
  // The workload's address on that node, as the node observed it, and its port there.
  string workload_address = 6;
  uint32 container_port = 7;
}

// An edge forwarding to this node's workloads: its address in the mesh, and each workload
// address and port it may reach.
message EdgeSource {
  string node = 1;
  string mesh_address = 2;
  repeated EdgeAdmit admits = 3;
  // What its ingress proxy may reach here through the mesh, from its mesh address, for the
  // `ingress` endpoints its groups serve; no GRE link is made for these alone.
  repeated EdgeAdmit proxied = 4;
}

message EdgeAdmit {
  string workload_address = 1;
  uint32 container_port = 2;
  korpis.v1.EndpointProtocol protocol = 3;
}

// What the node offers for inbound traffic, before anything has measured it.
message Advertised {
  // IP addresses, as text; the operator's, or the one the node's traffic leaves from when it is
  // globally routable.
  repeated string addresses = 1;
  // The inclusive range node_port and node_bound endpoints are allocated from.
  uint32 first_port = 2;
  uint32 last_port = 3;
  // Whether the node holds ports 80 and 443 of these addresses for its ingress proxy, as it
  // found at start (§3.2 of docs/07-networking.md).
  bool ingress = 4;
}

// ---------------------------------------------------------------------------------------------
// Assignments (§4.8 of docs/02-architecture.md)

// The complete set of assignments for this node, each signed.
message AssignmentSet {
  repeated SignedAssignment assignments = 1;
  // Over the assignments, canonically: sorted by workload, covering each generation.
  string set_digest = 2;
}

// Optimization only: a mismatch on `base_digest` triggers a full resync.
message AssignmentDelta {
  string base_digest = 1;
  repeated SignedAssignment upserts = 2;
  // Workloads whose assignment left the set.
  repeated string removed = 3;
  string set_digest = 4;
}

message InSync {
  string set_digest = 1;
}

// An assignment and the control plane's signature over its exact bytes, so an agent can prove
// what it was told (§8 of docs/03-state.md).
message SignedAssignment {
  // A serialized Assignment.
  bytes assignment = 1;
  // Ed25519 over `assignment`.
  bytes signature = 2;
  string key_id = 3;
}

// The unit of desired state on a node: one per workload placed there.
message Assignment {
  string workload = 1;
  string project = 2;
  string organization = 3;
  // Monotonic per workload; any change below increments it.
  uint64 generation = 4;
  // The configuration in full that the workload's plans reached, or that `plan` is reaching:
  // never the head, and the approved target only once a plan reaches it (§4.8 of
  // docs/02-architecture.md).
  korpis.v1.Intent target = 5;
  // Likewise for power; stopped at version zero while no plan has brought the workload to any
  // intent, so the node keeps the assignment and runs nothing.
  korpis.v1.Power power = 6;
  // Resolved: never ON_LEASE_EXPIRY_UNSPECIFIED here.
  korpis.v1.OnLeaseExpiry on_lease_expiry = 7;
  Shaping shaping = 8;
  NodePlan plan = 9;
  Retire retire = 10;
  MigrationRole migration = 11;
  // The resolved recipe manifest the node needs to run the target.
  bytes recipe_manifest = 12;
  string node = 13;
  // The lease epoch under which this node may act for the workload.
  uint64 lease_epoch = 14;
  // The host ids the workload's user namespace maps its ids 0 to uid_count - 1 onto, for users
  // and groups alike: allocated by the control plane, unique on this node while the workload is
  // here (§4.5 of docs/04-runtimes.md).
  uint32 uid_base = 15;
  uint32 uid_count = 16;
  // A retired workload's residual assignment, which carries only a plan for what it left on this
  // node, a retained volume to delete (§7 of docs/06-storage.md). Its target and power are the
  // last the workload had, for the record; the node executes the plan's steps and nothing else:
  // it builds, starts, observes, and leases nothing for it.
  bool residual = 17;
  // The privileged helper's identifier of each existing volume the target attaches, by the name
  // the workload mounts it under, as its node reported it (§7 of docs/06-storage.md). A volume
  // the workload creates is named for the workload and the volume, and is not listed.
  map<string, string> volume_ids = 18;
  // The target's endpoints as placed on this node, by name, each with the port of the node it
  // holds where its exposure holds one (§3 of docs/07-networking.md): what the node forwards.
  repeated korpis.v1.Endpoint endpoints = 19;
  // The workload runs an installed extension, or holds a grant in force: the node relays the
  // control plane's API to it on a socket in its own directory, and opens nothing past the
  // egress default for it (§9.5 of docs/08-identity.md). Decided by the control plane, which
  // knows the installations and the grants.
  bool reaches_api = 20;
  // Its dependencies, each resolved to the endpoints it reaches now; where each endpoint's
  // workload is, the node knows (§5 of docs/07-networking.md).
  repeated ResolvedDependency dependencies = 21;
  // The HTTP-01 challenges the node's proxy answers on port 80 for the names of this
  // workload's endpoints while their certificates are ordered (§3.2 of docs/07-networking.md).
  repeated AcmeChallenge challenges = 22;
  // The TLS-ALPN-01 challenges the node's proxy answers on port 443 for the names of this
  // workload's endpoints while their certificates are ordered, which the issuer uses where
  // HTTP-01 failed or a node's proxy last proved the certificate this way (§3.2 of
  // docs/07-networking.md).
  repeated AlpnChallenge alpn_challenges = 27;
  // The workload's name and labels, which the node does not use: a restored control plane that
  // lost the workload recovers it from them (§8 of docs/03-state.md).
  string workload_name = 23;
  map<string, string> workload_labels = 24;
  // The runs of a task or scheduled workload the node is to execute; none for a persistent one.
  // The node starts each it has not started and stops each it started that is no longer named
  // (§4.5 of docs/05-scheduling.md).
  repeated RunRef runs = 25;
  // Every run of it the control plane still holds, in any status (§4.4 of
  // docs/05-scheduling.md): the node keeps each one's console stream, and deletes a run's only
  // once the run is not here, which is the control plane saying retention deleted it (§4 of
  // docs/14-streams.md).
  repeated string kept_runs = 26;
  // The node's devices its placement holds, which the agent gives the driver by name, the
  // driver reading their edits itself (§6.3 of docs/05-scheduling.md, §4.2 of
  // docs/04-runtimes.md). Added 2026-10-25.
  repeated korpis.v1.DeviceHold devices = 28;
  // The node's cores its placement holds, by id, for dedicated cores (§5.2 of
  // docs/05-scheduling.md). Added 2026-10-25.
  repeated uint32 cores = 29;
  // Its dependents on other nodes of the mesh, which the node admits from the mesh to the
  // endpoint each depends on, and nothing else (§9.1 of docs/07-networking.md). Decided by the
  // control plane, which alone sees both nodes. Added 2026-10-25.
  repeated OverlayDependent dependents = 30;
  // The addresses each of its rules naming workloads names on this node (§6 of
  // docs/07-networking.md): resolved by the control plane, which alone sees where every
  // workload of its project runs and at what address. Added 2026-10-26.
  repeated RulePeers peers = 31;
  // The dedicated address it holds, where an endpoint of it is `dedicated_ip` and the address
  // may be held on this node (§3.7 of docs/07-networking.md); unset where it holds none. Added
  // 2026-10-26.
  DedicatedAddress dedicated = 32;
  // The devices of its volumes in block classes, each attached for it to this node at its lease's
  // epoch, with what the helper needs to attach it (§2.1 of docs/06-storage.md); a volume of a
  // block class with none here is not attached yet, and the step making it waits. Added
  // 2026-10-27.
  repeated BlockVolumeAttachment block_attachments = 33;
}

// A block class's device as the node attaches it: the volume it is, by the helper's identifier,
// and what the storage's provider answered for this node.
message BlockVolumeAttachment {
  string helper_id = 1;
  korpis.v1.BlockProtocol protocol = 2;
  string target = 3;
  // What the node presents for the device alone; empty where none is needed.
  string credential = 4;
  // The device is a guest's disk, which the host never mounts, given to a workload whose driver
  // takes block devices (§3.1 of docs/06-storage.md); fixed when the device was made. Added
  // 2026-10-27.
  bool guest = 5;
  // No volume was made of it yet: a guest's disk is formatted by the helper, which never reads one
  // a guest wrote. Added 2026-10-27.
  bool blank = 6;
}

// An address of a workload's own, as its node holds it (§3.7 of docs/07-networking.md): every
// connection to it translated to the workload's address, and what the workload sends beyond the
// node leaving from it.
message DedicatedAddress {
  // The IPv4 address.
  string address = 1;
  // The node's interface the address is answered for on, where its pool's addresses are on the
  // node's link; empty where they are routed to the node.
  string interface = 2;
}

// One rule naming workloads, resolved for the node it is sent to (§6 of docs/07-networking.md).
message RulePeers {
  // The endpoint whose rule it is; empty for the workload's egress.
  string endpoint = 1;
  // Its place among that policy's rules, from zero.
  uint32 rule = 2;
  // The addresses it names; none where it names none now, which matches nothing.
  repeated string addresses = 3;
}

// One run a node is to execute: what it is, and what the node enforces of it. Also what a
// restore that lost the run records it under (§8 of docs/03-state.md).
message RunRef {
  string run = 1;
  uint32 attempt = 2;
  korpis.v1.RunTrigger trigger = 3;
  google.protobuf.Timestamp scheduled_for = 4;
  // How long it may take before the node stops it; unbounded when unset.
  google.protobuf.Duration timeout = 5;
  // The intent it was made under, whose exit probe judges it, and for a manual run the power
  // cycle that requested it: signed with the rest, so a restored control plane that lost the run
  // records it as it was made (§8 of docs/03-state.md).
  string intent = 6;
  optional uint64 cycle = 7;
}

// Quota-imposed state, decided centrally and applied locally (§3.1 of docs/01-model.md).
message Shaping {
  bool egress_exhausted = 1;
  uint64 egress_floor_bits_per_sec = 2;
  bool egress_cut_off = 3;
}

message NodePlan {
  string plan = 1;
  // The steps this node executes, in order, each with its index.
  repeated korpis.v1.Step steps = 2;
  // The last step index the node may execute. Cancelling a plan is lowering this.
  uint32 through = 3;
  // The plan in full, its status and progress left out, which the node does not use: what a
  // restored control plane that lost it recovers it from (§8 of docs/03-state.md).
  korpis.v1.Plan whole = 4;
}

message Retire {
  // The plan of kind retire this belongs to.
  string plan = 1;
}

message MigrationRole {
  MigrationSide role = 1;
  MigrationPhase phase = 2;
  string peer = 3;
  string plan = 4;
  // The migration (`mig_…`), which the node's reports name (§8.1 of docs/05-scheduling.md).
  string migration = 5;
  // Each volume the target attaches: how it crosses, and the helper's identifier for it on the
  // source.
  repeated MigrationVolumeRole volumes = 6;
  // From cutover, on the destination: each stream's watermark as the source reported it.
  repeated StreamWatermark watermarks = 7;
  // When the source deletes its copies, unless the workload is rolled back first; set as the
  // migration enters release.
  google.protobuf.Timestamp hold_until = 8;
}

message MigrationVolumeRole {
  // The volume's name in the workload's declaration.
  string name = 1;
  // The helper's identifier for it on the source.
  string source_helper_id = 2;
  korpis.v1.MigrationCrossing crossing = 3;
  // The volume (`vol_…`), which the pass's ticket names.
  string volume = 4;
  // In replicate and final_sync, the pass under way, which the control plane names: the source
  // sends it and the destination admits it under its ticket, each reporting it by this name.
  MigrationPass pass = 5;
}

// One pass of a volume (§8.1 of docs/05-scheduling.md).
message MigrationPass {
  // The pass, a UUID.
  string pass = 1;
  // The pass it is an increment from, which the destination holds; empty for a whole one, and
  // always for a tree, which sends what differs.
  string parent = 2;
  // Its ticket (`korpismt_`), signed by the control plane's token key: the migration, the
  // volume, the two nodes, the pass and its parent, and the expiry.
  string ticket = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// One stream's watermark at quiesce: its next offset, and the position in its changes log the
// source's agent journaled and offloaded to (§4 of docs/14-streams.md).
message StreamWatermark {
  string stream = 1;
  uint64 next_offset = 2;
  uint64 journaled_to = 3;
}

// A node's report of its side of a migration's phase (§8.1 of docs/05-scheduling.md), believed
// only from the node assigned that side, about the phase the migration is in.
message MigrationProgress {
  string migration = 1;
  MigrationPhase phase = 2;
  MigrationSide side = 3;
  // Done, or failed; a report of neither says how far it has come.
  MigrationOutcomeOfPhase outcome = 4;
  // Why it failed, for the record.
  string detail = 5;
  // Each volume's part: the pass sent or held, what it sent, the destination's identifier for
  // it, and its manifest's digest.
  repeated MigrationVolumeProgress volumes = 6;
  // At quiesce, from the source: each stream's watermark.
  repeated StreamWatermark watermarks = 7;
}

enum MigrationOutcomeOfPhase {
  MIGRATION_OUTCOME_OF_PHASE_UNSPECIFIED = 0;
  MIGRATION_OUTCOME_OF_PHASE_DONE = 1;
  MIGRATION_OUTCOME_OF_PHASE_FAILED = 2;
}

message MigrationVolumeProgress {
  string name = 1;
  // The pass, by the identifier its ticket names.
  string pass = 2;
  // On the source: what the pass sent.
  uint64 sent_bytes = 3;
  // On the destination: the pass is held whole.
  bool held = 4;
  // On the destination: the helper's identifier for the volume there.
  string helper_id = 5;
  // At verify: the digest of the volume's manifest, `sha256:` and hexadecimal.
  string manifest = 6;
  // At verify: the manifest in runs of entries, each run's first path and digest, so the control
  // plane names where two copies first differ without either sending its whole manifest.
  repeated ManifestChunk chunks = 7;
}

message ManifestChunk {
  string first_path = 1;
  string digest = 2;
}

enum MigrationSide {
  MIGRATION_SIDE_UNSPECIFIED = 0;
  MIGRATION_SIDE_SOURCE = 1;
  MIGRATION_SIDE_DESTINATION = 2;
}

enum MigrationPhase {
  MIGRATION_PHASE_UNSPECIFIED = 0;
  MIGRATION_PHASE_PREPARE = 1;
  MIGRATION_PHASE_REPLICATE = 2;
  MIGRATION_PHASE_QUIESCE = 3;
  MIGRATION_PHASE_FINAL_SYNC = 4;
  MIGRATION_PHASE_VERIFY = 5;
  MIGRATION_PHASE_CUTOVER = 6;
  MIGRATION_PHASE_RELEASE = 7;
}

message Ack {
  string set_digest = 1;
}

// ---------------------------------------------------------------------------------------------
// Leases (§4.5 of docs/02-architecture.md)

// The holder's lease runs from the send: valid until sent_at + term × (1 − ρ) on its own
// monotonic clock. The grantor's runs from receipt: received_at + term.
message LeaseRequest {
  string workload = 1;
  // Echoed by the grant.
  bytes nonce = 2;
  // The epoch the agent holds, zero if none.
  uint64 held_epoch = 3;
}

message LeaseGrant {
  string workload = 1;
  bytes nonce = 2;
  uint64 epoch = 3;
  google.protobuf.Duration term = 4;
  // The declared bound on clock-rate error, in parts per million.
  uint32 rho_ppm = 5;
  korpis.v1.OnLeaseExpiry on_expiry = 6;
}

// Why a lease was not granted. The control plane always knows which case it is in.
message LeaseRefusal {
  string workload = 1;
  bytes nonce = 2;
  LeaseRefusalReason reason = 3;
  // For SUPERSEDED: the node now holding the workload.
  string superseded_by = 4;
}

enum LeaseRefusalReason {
  LEASE_REFUSAL_REASON_UNSPECIFIED = 0;
  // Another node holds a newer epoch: stop, retain data, report the volume as an orphan.
  LEASE_REFUSAL_REASON_SUPERSEDED = 1;
  // The workload is not assigned to this node.
  LEASE_REFUSAL_REASON_NOT_ASSIGNED = 2;
  // A transient condition; retry.
  LEASE_REFUSAL_REASON_UNAVAILABLE = 3;
}

// Asks the holder to release early. Safety never depends on its delivery.
message LeaseRevoke {
  string workload = 1;
  uint64 epoch = 2;
}

// The node has stopped acting under an epoch. Also written to the journal.
message LeaseReleased {
  string workload = 1;
  uint64 epoch = 2;
}

// ---------------------------------------------------------------------------------------------
// Edge leases (§3.1 of docs/07-networking.md)

// Asks for, or renews, the lease on an address this member is told to hold. Fenced as a
// workload's lease is: the member's runs from the send, valid until sent_at + term × (1 − ρ) on
// its own monotonic clock, and the grantor's from receipt.
// The challenges of Edges the node's proxy has been given (§3.1 of docs/07-networking.md): every
// HTTP-01 token and TLS-ALPN-01 digest, sent whenever they change and on every new session.
message EdgeChallengesHeld {
  repeated string tokens = 1;
  repeated bytes alpn_digests = 2;
}

message EdgeLeaseRequest {
  string address = 1;
  // Echoed by the answer.
  bytes nonce = 2;
  // The epoch the member holds the address under, zero if none.
  uint64 held_epoch = 3;
}

message EdgeLeaseGrant {
  string address = 1;
  bytes nonce = 2;
  uint64 epoch = 3;
  google.protobuf.Duration term = 4;
  // The declared bound on clock-rate error, in parts per million.
  uint32 rho_ppm = 5;
}

// Why an address's lease was not granted: SUPERSEDED where another member holds it and this one
// should not, NOT_ASSIGNED where this member should not hold it, UNAVAILABLE where it should but
// the last holder's lease is not over yet.
message EdgeLeaseRefusal {
  string address = 1;
  bytes nonce = 2;
  LeaseRefusalReason reason = 3;
  // For SUPERSEDED: the member holding it, `nd_...`.
  string superseded_by = 4;
}

// The member has stopped holding the address under `epoch`: it is off the member's interface,
// its connections forgotten.
message EdgeLeaseReleased {
  string address = 1;
  uint64 epoch = 2;
}

// ---------------------------------------------------------------------------------------------
// Journal (§4.10 of docs/02-architecture.md)

message JournalRecords {
  repeated JournalRecord records = 1;
}

message JournalRecord {
  // Monotonic per node, never reused, survives agent restart.
  uint64 seq = 1;
  // The node's clock, informational.
  google.protobuf.Timestamp occurred_at = 2;
  oneof body {
    korpis.v1.Effect effect = 3;
    MeteringSample metering = 4;
    BreakGlass break_glass = 5;
    LeaseReleased lease_released = 6;
    JournalGap gap = 7;
    StreamSegmentEvent stream_segment = 9;
    VolumeEvent volume = 10;
    SnapshotEvent snapshot = 11;
    BackupEvent backup = 12;
    ReplicaEvent replica = 13;
    MigrationProgress migration = 14;
  }
  // Coalesced identical records: how many this one stands for.
  uint64 count = 8;
}

// One workload's meter at the end of one metering interval (§2 of docs/15-observability.md,
// "Measuring it, as designed"). It carries the workload's cumulative counters, not what the
// interval used: the control plane takes each interval as the difference of two samples, so a
// sample lost loses where within a span its use fell, never the use.
message MeteringSample {
  string workload = 1;
  google.protobuf.Timestamp interval_start = 2;
  google.protobuf.Duration interval = 3;
  reserved 4 to 8;
  reserved "usage", "cpu_seconds", "memory_byte_hours", "disk_byte_hours", "egress_bytes";
  // The lease epoch it ran under here; zero for a workload that holds no lease.
  uint64 lease_epoch = 9;
  // Its counters since it first ran on this node, across every object it ran as.
  MeterCounters counters = 10;
  // The most memory it used within the interval, as read and as the kernel's high-water marks
  // rose; absent where nothing of it was read.
  optional uint64 memory_peak_bytes = 11;
  // The bytes its volumes hold at the sample, where their filesystem accounts them.
  optional uint64 disk_bytes = 12;
  // What the node knows it could not measure since its previous sample.
  repeated MeterLoss losses = 13;
  // `disk_bytes` counts what block devices' images have allocated, not what their guests'
  // filesystems hold (§3.1 of docs/06-storage.md).
  bool disk_allocated = 14;
}

// Cumulative counters. Each is absent where nothing measured it, never zero for that.
message MeterCounters {
  // CPU time, and the time it was throttled, in microseconds.
  optional uint64 cpu_usec = 1;
  optional uint64 cpu_throttled_usec = 2;
  // Bytes read from and written to block devices.
  optional uint64 io_read_bytes = 3;
  optional uint64 io_write_bytes = 4;
  // Bytes its network interface received and sent: what reached the workload, and what it sent.
  // Not split by destination (§2 of docs/15-observability.md).
  optional uint64 net_rx_bytes = 5;
  optional uint64 net_tx_bytes = 6;
  // Memory in use integrated over time from ten-second readings, in KiB-seconds: a sum of
  // measurements, not a kernel counter.
  optional uint64 memory_kib_seconds = 7;
  // Bytes that left its link for anything but another workload's link on its node, counted in
  // the host's table: its egress, which its egress budget is measured in (§5.1 of
  // docs/05-scheduling.md).
  optional uint64 egress_bytes = 8;
  // What each of its endpoints whose accounting is on carried, by name (§7 of
  // docs/07-networking.md).
  repeated EndpointCounters endpoints = 9;
  // Each dedicated core its placement held on the node, for the seconds it was held, whatever
  // ran on it (§5.2 of docs/05-scheduling.md): integrated by the node from its readings. Added
  // 2026-10-25.
  optional uint64 dedicated_core_seconds = 10;
  // Each device its placement held, by class, for the seconds it was held (§6 of
  // docs/05-scheduling.md). Added 2026-10-25.
  repeated korpis.v1.DeviceSeconds device_seconds = 11;
}

// One endpoint's counters, cumulative: what was sent to its port, and what left it.
message EndpointCounters {
  string endpoint = 1;
  uint64 received_bytes = 2;
  uint64 received_packets = 3;
  uint64 sent_bytes = 4;
  uint64 sent_packets = 5;
}

// A span the node could not measure, and why: "counter reset", "node rebooted".
message MeterLoss {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  string cause = 3;
}

// A segment of a workload's stream was sealed, offloaded, or pruned on this node (§4 of
// docs/14-streams.md): what the control plane's segment index is kept from.
message StreamSegmentEvent {
  string workload = 1;
  korpis.v1.StreamKind kind = 2;
  SegmentEvent event = 3;
  // The segment as it stands after the event; the node field is ignored, since the record's
  // node is the one that holds it.
  korpis.v1.StreamSegment segment = 4;
  // The run whose console stream it is, for a task or scheduled workload; empty otherwise.
  string run = 5;
}

// A volume of a workload was ensured or deleted on this node (§7 of docs/06-storage.md): what
// the control plane's volume objects are kept from. Journaled after every ensure, created or
// found, so a crash between creating a volume and journaling it is repaired by the next ensure.
message VolumeEvent {
  string workload = 1;
  // The name the workload knows it by, or `stream_console` for its console stream's.
  string name = 2;
  // The helper's identifier for it on this node.
  string helper_id = 3;
  string storage_class = 4;
  uint64 size_bytes = 5;
  // Whether its size is enforced in the write path (§3 of docs/06-storage.md).
  bool quota_enforced = 6;
  VolumeEventKind event = 7;
  // A console stream's volume rather than one the workload declared.
  bool stream = 8;
}

// A snapshot taken, rolled back to, or deleted on this node, after the helper did it (§4 of
// docs/06-storage.md).
message SnapshotEvent {
  string workload = 1;
  // The helper's identifier of the volume.
  string volume = 2;
  string snapshot = 3;
  string name = 4;
  SnapshotEventKind event = 5;
}

enum SnapshotEventKind {
  SNAPSHOT_EVENT_KIND_UNSPECIFIED = 0;
  SNAPSHOT_EVENT_KIND_TAKEN = 1;
  SNAPSHOT_EVENT_KIND_ROLLED_BACK = 2;
  SNAPSHOT_EVENT_KIND_DELETED = 3;
}

enum VolumeEventKind {
  VOLUME_EVENT_KIND_UNSPECIFIED = 0;
  VOLUME_EVENT_KIND_ENSURED = 1;
  VOLUME_EVENT_KIND_DELETED = 2;
}

enum SegmentEvent {
  SEGMENT_EVENT_UNSPECIFIED = 0;
  // Sealed on the node: its digest is final.
  SEGMENT_EVENT_SEALED = 1;
  // Held by the offload target as well.
  SEGMENT_EVENT_OFFLOADED = 2;
  // Removed from the node to its retention; if it was not offloaded, its records are gone.
  SEGMENT_EVENT_PRUNED = 3;
}

message BreakGlass {
  string operator = 1;
  string reason = 2;
  string session = 3;
}

// Records the node no longer has: lost because the journal filled ("journal exhausted"),
// discarded before a control plane restored from an older backup ingested them, or unreadable on
// the node's disk ("journal damaged"); a visible loss, never a silent one. A gap stands for
// first_seq through last_seq, and the JournalRecord carrying it is numbered last_seq (§4.10 of
// docs/02-architecture.md).
message JournalGap {
  uint64 first_seq = 1;
  uint64 last_seq = 2;
  string cause = 3;
}

// The highest sequence durably ingested; the agent may discard up to it after the retention
// window.
message JournalAck {
  uint64 seq = 1;
}

// ---------------------------------------------------------------------------------------------
// Placement, content, liveness

// A side-effect-free Prepare against a supplied manifest (§2.1 of docs/05-scheduling.md): asked
// of the best scored nodes before a workload is bound, outside the placement lock. `query` is
// random and answered by the node it was sent to alone.
message FeasibilityQuery {
  string query = 1;
  korpis.v1.IntentBody body = 2;
  bytes recipe_manifest = 3;
}

// What the node's driver said. `accepted` is Prepare's acceptance; otherwise `reason` and
// `detail` are its refusal, which the control plane keeps for the target, unless `unanswered`
// says the driver could not be asked at all (it is not running, or the call failed), which
// decides nothing and is not kept.
message FeasibilityResult {
  string query = 1;
  bool accepted = 2;
  korpis.v1.UnsatisfiableReason reason = 3;
  string detail = 4;
  bool unanswered = 5;
}

message ContentHint {
  repeated string digests = 1;
}

message ContentStatus {
  repeated string present = 1;
}

// The grants a verifier refuses in any token's chain (§6.3 of docs/08-identity.md), whole: each
// list replaces the last. It is signed by the capability-token key, so a verifier trusts it
// exactly as far as it trusts the tokens it checks, and a copy cached on disk or passed on to a
// relay carries its own proof.
message RevocationList {
  // Revoked or suspended grant identifiers, sorted; a token is refused if any link of its chain
  // is listed.
  repeated string grants = 1;
  // Token identifiers were listed here once; the chain check made them unnecessary (finding S30).
  reserved 2;
  reserved "tokens";
  // When the control plane computed the list, in milliseconds since the Unix epoch.
  uint64 version = 3;
  // The token key that signed it, one of Enrolled.token_keys.
  string key_id = 4;
  // Ed25519 over the canonical form: "korpis.revocation.v1\n", the version in decimal and a
  // newline, then each grant identifier in hyphenated lowercase followed by a newline.
  bytes signature = 5;
}

message Probe {
  bytes nonce = 1;
}

message ProbeReply {
  bytes nonce = 1;
}

// Measure whether the node can be reached at what it advertises (§9 of docs/07-networking.md):
// the node listens on `port`, over TCP and UDP on every address, for fifteen seconds, and answers
// each 32-byte nonce it is sent there with its node key's Ed25519 signature over
// "korpis.agent.v1.Reachability|<node>|<port>|<nonce in lowercase hexadecimal>".
message ReachabilityProbe {
  string probe = 1;
  // One of the node's advertised range.
  uint32 port = 2;
}

// The node is listening for a probe, or could not.
message ProbeListening {
  string probe = 1;
  // Empty when listening; otherwise why not, such as the port being taken.
  string error = 2;
}
