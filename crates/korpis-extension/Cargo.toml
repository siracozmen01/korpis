[package]
name = "korpis-extension"
description = "The SDK a Korpis extension is written with: its identity, its events, and its provider stream"
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The well-known types an identity provider's assertion carries its instant in.
buffa-types = { version = "=0.9.2" }
connectrpc = { version = "=0.9.1", default-features = false, features = ["client", "client-tls"] }
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
getrandom = "0.4"
# Signing a request to an S3-compatible store, and verifying one presigned for a store a provider
# serves itself (§5.6 of docs/06-storage.md).
hmac = "0.12"
# Keys a key management provider hands out are sealed to their one recipient, never sent or
# stored in the clear (§5.5 of docs/06-storage.md): HPKE, RFC 9180, base mode.
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
korpis-proto = { workspace = true, features = ["client"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
# The relay its node serves (§9.5 of docs/08-identity.md) is a socket TLS is spoken over.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"

[dev-dependencies]
rusty-s3 = "0.10"
url = "2"

[lints]
workspace = true
