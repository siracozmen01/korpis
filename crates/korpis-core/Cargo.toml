[package]
name = "korpis-core"
description = "Korpis domain logic shared by the control plane and the agent"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# The authorization path: grant algebra, evaluation, and capability tokens. Off by default so
# that the privileged helper, which needs none of it, links none of it.
authz = ["dep:base64", "dep:biscuit-auth", "dep:getrandom", "dep:ipnet", "dep:sha2"]

[dependencies]
biscuit-auth = { version = "=6.0.0", default-features = false, features = ["datalog-macro"], optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.4", optional = true }
ipnet = { version = "2", optional = true }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[[test]]
name = "authz"
required-features = ["authz"]
