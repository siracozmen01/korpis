[package]
name = "korpis-backup"
description = "Korpis backups: content-defined chunks and directory trees, sealed under a workload's data key, written to and read from an object store"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A MinIO fixture for tests, in this crate's and other crates' tests.
testing = []

[[bin]]
name = "korpis-backup-job"
path = "src/bin/job.rs"

[dependencies]
# Chunk and tree identifiers: a keyed hash, so equal content in two workloads has unrelated
# identifiers (§5.3 of docs/06-storage.md).
blake3 = "1"
buffa = { version = "=0.9.2" }
buffa-types = { version = "=0.9.2" }
# Every object is encrypted before it leaves the node, under a key derived from the workload's
# data key (§5.5 of docs/06-storage.md).
chacha20poly1305 = "0.10"
# Uploads and fetches run several at once.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
# Content-defined chunk boundaries, so an insertion moves one chunk rather than every one after it.
fastcdc = "5"
getrandom = "0.4"
hkdf = "0.12"
# A job confines itself to its directory and its store's port before it reads anything.
landlock = "0.4"
# The repository format's messages only: no RPC stack.
korpis-proto = { workspace = true }
# The node's one object store client: every store a repository can name speaks S3 or is fronted
# by something that does (§5.6 of docs/06-storage.md). Requests are signed without I/O, and sent
# with the HTTP client the agent already links.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustix = { version = "1", features = ["fs", "thread"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rusty-s3 = "0.10"
sha2 = "0.10"
url = "2"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Derived keys are wiped when dropped.
zeroize = "1"
# Objects are compressed before they are sealed: game worlds compress well, and ciphertext does
# not compress at all.
zstd = "0.13"

[dev-dependencies]
korpis-backup = { path = ".", features = ["testing"] }
rustix = { version = "1", features = ["fs", "process"] }
tempfile = "3"
