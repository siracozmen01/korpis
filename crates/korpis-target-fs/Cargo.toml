[package]
name = "korpis-target-fs"
description = "Korpis's first-party backup target provider for a disk: its own volume, served as an S3 subset over TLS with access it mints per job"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# A first-party extension is built as a third party's would be (§1 of docs/22-first-party.md): the
# SDK and the wire contract, and nothing else of ours. scripts/check-layers.sh holds it to that.
[dependencies]
buffa-types = { version = "=0.9.2" }
bytes = "1"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
korpis-extension = { path = "../korpis-extension" }
korpis-proto = { workspace = true }
# The store's own certificate, made when it starts and pinned by every reader (§5.6 of
# docs/06-storage.md).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
korpis-backup = { path = "../korpis-backup", features = ["testing"] }
tempfile = "3"
