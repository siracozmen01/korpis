[package]
name = "korpis-helper"
description = "Korpis privileged helper: synchronous, single-threaded, socket-activated"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A shared storage class on a directory no network reaches, which tests use to have two nodes on
# one machine share storage (§2.1 of docs/06-storage.md). Never in a binary an operator runs.
testing = []

# No async runtime and no second thread, ever (§4 of docs/21-stack.md): every dependency here is
# synchronous, korpis-proto without its `services` feature included, and the list stays this short.
# scripts/check-layers.sh holds it to that.
[dependencies]
buffa = { version = "=0.9.2" }
korpis-core.workspace = true
ipnet = "2"
korpis-proto = { workspace = true }
# CPU lists are read and written as the agent and drivers read and write them.
korpis-topology = { workspace = true }
libc = "0.2"
# Links, addresses, and routes are made over netlink (§4.1 of docs/07-networking.md).
netlink-packet-core = "0.9"
# The mesh's interface is configured over WireGuard's generic netlink family (§9.1 of
# docs/07-networking.md).
netlink-packet-generic = "0.5"
netlink-packet-route = "0.33"
netlink-packet-wireguard = "0.5"
netlink-sys = "0.8"
rustix = { version = "1", features = ["event", "fs", "mount", "net", "process", "std", "thread"] }
# nftables rules are written as its JSON input.
serde_json = "1"
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
korpis-agent = { path = "../korpis-agent" }
korpis-backup = { path = "../korpis-backup", features = ["testing"] }
korpis-core = { workspace = true }
korpis-files = { path = "../korpis-files" }
korpis-wire = { workspace = true }
rustix = { version = "1", features = ["process"] }
sha2 = "0.10"
tempfile = "3"
tokio = { workspace = true }
