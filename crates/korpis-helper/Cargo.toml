[package]
name = "korpis-helper"
description = "Korpis privileged helper: synchronous, single-threaded, socket-activated"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# No async runtime and no second thread, ever (§4 of docs/21-stack.md): every dependency here is
# synchronous, korpis-proto without its `services` feature included, and the list stays this short.
# scripts/check-layers.sh holds it to that.
[dependencies]
buffa = { version = "=0.9.2" }
korpis-core.workspace = true
korpis-proto = { workspace = true }
libc = "0.2"
rustix = { version = "1", features = ["event", "fs", "net", "process", "std"] }
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
korpis-agent = { path = "../korpis-agent" }
korpis-backup = { path = "../korpis-backup", features = ["testing"] }
tempfile = "3"
rustix = { version = "1", features = ["process"] }
tokio = { workspace = true }
